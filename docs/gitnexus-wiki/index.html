creenshots.mjs` | 截图 |\n| `submit-to-miaoda-pm.mjs` | 项目管理 |\n| `submit-updates-to-miaoda-pm.mjs` | 项目管理 |\n| `set-agent-nickname.ts` | 工具 |\n| `list-available-agents.ts` | 工具 |\n| `scheduled-job-runner.ts` | 定时任务 |\n\n---\n\n## 飞书集成\n\n### `feishu-bot-mvp.ts`\n\n最简 Agent 通信工具，通过 Feishu 群聊实现 Windows ↔ Linux Agent 之间的实时通信。\n\n**架构：**\n\n```mermaid\ngraph LR\n    A[Feishu 群聊] -->|Event Subscription 回调| B[FeishuBotServer]\n    B --> C[MessageHandler]\n    C -->|isMentionedToMe| D{是否@自己?}\n    D -->|是| E[generateResponse]\n    E --> F[FeishuClient.replyMessage]\n    F --> A\n```\n\n**核心类：**\n\n- **`FeishuClient`** — 封装 Feishu Open API 调用\n  - `getTenantAccessToken()` — 获取并缓存 tenant access token（提前 100 秒刷新）\n  - `sendTextMessage(chatId, text)` — 发送文本消息到群聊\n  - `replyMessage(chatId, messageId, text)` — 带引用回复消息\n\n- **`MessageHandler`** — 消息解析与响应逻辑\n  - `parseMessageEvent(body)` — 解析 Feishu 事件，提取消息类型、内容、@提及\n  - `isMentionedToMe(mentions)` — 检查是否被@\n  - `generateResponse(message)` — 基于关键词匹配生成响应（测试/你好/状态/ping）\n  - `handleMessage(event)` — 完整处理流程\n\n- **`FeishuBotServer`** — HTTP 服务器，接收 Feishu 回调\n  - 处理 `url_verification` 挑战验证\n  - 转发消息事件到 `MessageHandler`\n\n**环境变量：**\n\n| 变量 | 说明 |\n|------|------|\n| `FEISHU_APP_ID` | 应用 ID |\n| `FEISHU_APP_SECRET` | 应用密钥 |\n| `FEISHU_VERIFICATION_TOKEN` | 验证 Token |\n| `FEISHU_CHAT_ID` | 群聊 ID |\n| `AGENT_NAME` | 当前 Agent 名称 |\n| `AGENT_ID` | 当前 Agent 的 Feishu user_id |\n| `PORT` | 回调监听端口（默认 3001） |\n\n**运行方式：**\n```bash\nnpx ts-node scripts/feishu-bot-mvp.ts\n```\n\n---\n\n### `feishu-standalone-monitor.js`\n\n独立运行的飞书长连接运行时，作为 systemd 用户服务部署。\n\n**关键行为：**\n- 通过 `ts-node` 注册加载 TypeScript 模块\n- 修补 `Module._resolveFilename` 以支持 `@/` 路径别名\n- 调用 `startFeishuLongConnectionRuntime()` 启动长连接\n- 注册 `SIGTERM`/`SIGINT` 处理器，调用 `shutdownFeishuRuntime()` 优雅关闭\n- 处理 `unhandledRejection` 和 `uncaughtException` 防止进程崩溃\n\n**运行方式：**\n```bash\nnode scripts/feishu-standalone-monitor.js\n```\n\n---\n\n### `feishu-ws-smoke.js`\n\n飞书 WebSocket 长连接冒烟测试脚本，用于验证 `@larksuiteoapi/node-sdk` 的 `WSClient` 连接是否正常。\n\n**行为：**\n1. 从环境变量读取 `FEISHU_APP_ID` 和 `FEISHU_APP_SECRET`\n2. 创建 `Lark.EventDispatcher` 并注册多个事件处理器（消息接收、已读、机器人加入/退出、表情反应、卡片交互）\n3. 创建 `Lark.WSClient` 并启动\n4. 运行指定时长（默认 30 秒，通过 `FEISHU_SMOKE_DURATION_MS` 配置）后自动退出\n\n**运行方式：**\n```bash\nFEISHU_APP_ID=xxx FEISHU_APP_SECRET=xxx node scripts/feishu-ws-smoke.js\n```\n\n---\n\n## 远程节点系统\n\n远程节点系统由三部分组成：**Runner**（运行在远程机器上）、**Gateway**（平台侧 WebSocket 网关）、**注册脚本**（将远程机器注册到平台）。\n\n```mermaid\ngraph TB\n    subgraph 平台侧\n        GW[remote-runner-gateway.ts]\n        GW -->|handleNodeConnection| WS[remote-node-ws]\n        GW -->|executeOnNode| WS\n        GW -->|configureNodeWorkspace| WS\n        GW -->|cancelNodeRun| WS\n    end\n    subgraph 远程机器\n        R[agent-platform-runner.js]\n        R -->|spawn| PI[pi-agent 进程]\n    end\n    R -->|WebSocket| GW\n```\n\n### `agent-platform-runner.js`\n\n运行在远程机器上的 Agent 执行器，通过 WebSocket 连接到平台 Gateway，接收任务并调用 `pi-agent` 执行。\n\n**核心功能：**\n\n- **WebSocket 连接管理** — 内置完整的 WebSocket 客户端实现（当 `ws` 包不可用时），支持帧编解码、掩码、分片、心跳\n- **自动重连** — 指数退避（1s → 2s → 4s → ... → 30s 上限）\n- **任务执行** — 接收 `run` 消息，调用 `spawnPi()` 启动 `pi-agent` 子进程\n- **输出流式回传** — 实时将 stdout/stderr 通过 WebSocket 发回平台\n- **工作区安全** — `safeCwd()` 确保工作目录在配置的 workspace 内\n- **配置持久化** — 保存到 `~/.agent-platform/runner.json`\n\n**关键函数：**\n\n| 函数 | 说明 |\n|------|------|\n| `connect()` | 建立 WebSocket 连接，注册消息处理器 |\n| `run(ws, message)` | 执行单个任务，管理子进程生命周期 |\n| `spawnPi(piArgs, cwd)` | 跨平台启动 pi-agent（Windows 使用 PowerShell 编码命令） |\n| `safeCwd(value)` | 验证工作目录在 workspace 范围内 |\n| `assistantText(line)` | 从 JSON 行中提取 assistant 文本内容 |\n| `sessionDirFor(taskId)` | 生成会话目录路径 |\n\n**命令行参数：**\n\n| 参数 | 说明 |\n|------|------|\n| `--server` | 平台 WebSocket 地址 |\n| `--node` | 节点名称 |\n| `--token` | 节点认证 Token |\n| `--workspace` | 工作目录 |\n| `--pi` | pi-agent 可执行文件路径 |\n| `--pairing-token` | 配对 Token（首次注册用） |\n\n**环境变量：**\n- `REMOTE_PI_AGENT_BIN` — pi-agent 二进制路径\n- `REMOTE_PI_AGENT_TOOLS` — 可用工具列表（默认 `read,bash,edit,write,grep,find,ls`）\n\n**运行方式：**\n```bash\nnode scripts/agent-platform-runner.js --server ws://host:3012/runner --node my-node --token <secret>\n```\n\n---\n\n### `remote-runner-gateway.ts`\n\n平台侧的 HTTP + WebSocket 网关服务，作为远程 Runner 的接入点。\n\n**HTTP 端点：**\n\n| 方法 | 路径 | 说明 |\n|------|------|------|\n| GET | `/health` | 健康检查 |\n| POST | `/workspace` | 配置节点工作区（仅限本地访问） |\n| POST | `/run` | 在远程节点上执行任务，返回 NDJSON 流 |\n\n**WebSocket 端点：**\n- 路径：`/runner`\n- 调用 `handleNodeConnection(ws, req)` 处理节点连接\n\n**`/run` 端点行为：**\n1. 验证请求参数（`nodeName`, `runId`, `taskId`, `cwd`, `prompt`）\n2. 调用 `executeOnNode()` 执行任务\n3. 以 NDJSON 格式流式返回 `stdout`/`stderr`/`complete` 事件\n4. 客户端断开时调用 `cancelNodeRun()` 取消任务\n\n**环境变量：**\n- `REMOTE_RUNNER_GATEWAY_HOST` — 监听地址（默认 `127.0.0.1`）\n- `REMOTE_RUNNER_GATEWAY_PORT` — 监听端口（默认 `3012`）\n\n---\n\n### `register-remote-gateway.js`\n\n在远程 OpenClaw 实例上运行的网关注册脚本，向 Agent Platform 注册网关信息并维持心跳。\n\n**命令：**\n\n| 命令 | 说明 |\n|------|------|\n| `register` | 注册网关 |\n| `heartbeat` | 发送一次心跳 |\n| `unregister` | 注销网关 |\n| `daemon`（默认） | 注册后持续发送心跳 |\n\n**关键函数：**\n- `getGatewayInfo()` — 收集网关信息（IP、端口、Agent 列表、系统资源）\n- `normalizeAgent(agent, index)` — 标准化 Agent 信息，支持多种 ID 字段回退\n- `parseRuntimeAgentsOverride(fs)` — 从 `RUNTIME_AGENTS_JSON` 或 `RUNTIME_AGENTS_FILE` 读取 Agent 覆盖配置\n- `getLocalIP()` — 获取本机非回环 IPv4 地址\n\n**环境变量：**\n\n| 变量 | 说明 |\n|------|------|\n| `PLATFORM_URL` | 平台地址（默认 `http://localhost:3000`） |\n| `GATEWAY_ID` | 网关 ID |\n| `GATEWAY_NAME` | 网关名称 |\n| `GATEWAY_PORT` | 网关端口 |\n| `GATEWAY_TOKEN` | 认证 Token |\n| `HEARTBEAT_INTERVAL` | 心跳间隔（默认 30000ms） |\n| `GATEWAY_IP` | 优先使用的 IP |\n| `RUNTIME_AGENTS_JSON` | Agent 列表 JSON |\n| `RUNTIME_AGENTS_FILE` | Agent 列表文件路径 |\n\n---\n\n### `register-remote-node.ts`\n\n将远程节点注册到平台的轻量脚本。\n\n**用法：**\n```bash\nnpm run remote-runner:register -- --node <name> --token <secret>\n```\n\n调用 `provisionNode(nodeName, token)` 完成注册。\n\n---\n\n## 工作流文档管理\n\n工作流系统基于 `workflow-contract.yaml` 定义的规则，管理 PLAN 和 HANDOVER 文档的创建与校验。\n\n### `new-workflow-document.ts`\n\n创建新的 PLAN 或 HANDOVER 工作流文档。\n\n**用法：**\n```bash\n# 创建 Phase PLAN\nnpm run workflow:new -- --kind plan --title \"主题\" [--plan-kind phase|interrupt]\n\n# 创建 Interrupt PLAN\nnpm run workflow:new -- --kind plan --title \"修复主题\" --plan-kind interrupt \\\n  --parent-plan docs/xxx_PLAN.md --parent-slice S01 --return-to S02\n\n# 创建 HANDOVER\nnpm run workflow:new -- --kind handover --plan docs/xxx_PLAN.md --slice S01\n```\n\n**核心流程：**\n1. 解析命令行参数\n2. 读取 `workflow-contract.yaml` 获取规则\n3. 计算下一个文档编号（`nextNumber()`）\n4. 从模板中提取对应区块（`templateBlock()`）\n5. 填充占位符生成文档内容\n6. 调用 `validateWorkflowDocuments()` 校验\n7. 写入文件（校验失败时保留 `.tmp` 文件）\n\n**关键函数：**\n\n| 函数 | 说明 |\n|------|------|\n| `createWorkflowDocument(cwd, args)` | 主入口，导出供测试使用 |\n| `nextNumber(cwd, directory, pattern, width)` | 扫描工作目录和 Git 跟踪文件，计算下一个编号 |\n| `templateBlock(source, heading)` | 从模板 Markdown 中提取指定标题下的代码块 |\n| `workflowSlices(content, pattern)` | 从 PLAN 内容中提取所有 Slice 编号 |\n| `cleanTitle(value)` | 清理标题，确保文件名安全 |\n\n**依赖：**\n- `src/lib/scheduled-jobs/workflow-validator` — 提供 `GitRefReader`、`WorkingTreeReader`、`readWorkflowContract`、`validateWorkflowDocuments`\n\n---\n\n### `validate-workflow-documents.ts`\n\n工作流文档校验器，支持多种运行模式。\n\n**模式：**\n\n| 模式 | 触发方式 | 说明 |\n|------|----------|------|\n| 标准模式 | `npm run workflow:validate -- <ref> <file>...` | 校验指定 Git ref 下的文档 |\n| 预检模式 | `--preflight <file> [--json]` | 校验工作区中的单个文件 |\n| Hook 批量模式 | `--hook-batch <batch-file>` | Git 提交钩子批量校验 |\n\n**Hook 批量模式行为：**\n- 读取制表符分隔的批次文件（`contractRef\\tref\\tcontractPath\\tfilePath`）\n- 按 `(contractRef, ref, contractPath)` 分组\n- 文档校验失败 → 输出 `WORKFLOW_DOCUMENT_VALIDATION_FAILED` 标记，退出码 1（阻止提交）\n- 运行时错误 → 输出警告，退出码 2（不阻止提交）\n\n**导出：**\n- `DOCUMENT_VALIDATION_FAILED_MARKER` — 常量 `'WORKFLOW_DOCUMENT_VALIDATION_FAILED'`，Git 钩子通过此标记判断是否拒绝提交\n\n---\n\n### `build-workflow-validator.mjs`\n\n将工作流校验器打包为单文件 CommonJS bundle，输出到 `src/lib/scheduled-jobs/generated/workflow-validator.cjs`。\n\n**流程：**\n1. 使用 TypeScript `transpileModule` 将源文件编译为 JS\n2. 静态分析 `require()` 调用，递归收集依赖模块\n3. 生成自包含的 bundle（内置 `__bundleRequire` 模块加载器）\n4. 写入目标路径\n\n**源文件：**\n- `src/lib/scheduled-jobs/workflow-reader.ts`\n- `src/lib/scheduled-jobs/workflow-validator.ts`\n- `scripts/validate-workflow-documents.ts`\n\n---\n\n## 数据库迁移\n\n### `migrate-sqlite-to-postgresql.mjs`\n\n将 SQLite 数据库迁移到 PostgreSQL。\n\n**流程：**\n1. 验证源文件存在且目标为 PostgreSQL\n2. 检查目标 schema 包含所有源表\n3. 检查目标表为空\n4. 按外键依赖顺序导入（`importOrder()`）\n5. 分批插入（每批 250 行）\n6. 恢复延迟列（自引用外键）\n\n**延迟列处理：**\n\n以下列因自引用外键需要延迟填充：\n- `Task.currentTaskSessionId`\n- `LiveRoom.currentSpeakerMemberId`\n- `LiveRoomMessage.replyToMessageId`\n\n**运行方式：**\n```bash\nDATABASE_URL=postgresql://... node scripts/migrate-sqlite-to-postgresql.mjs [path/to/dev.db]\n```\n\n---\n\n### `verify-postgresql-migration.mjs`\n\n验证迁移结果的正确性。\n\n**检查项：**\n- 每张表的行数匹配\n- 每张表的 SHA-256 行哈希匹配\n- 所有外键无孤儿行\n\n**运行方式：**\n```bash\nDATABASE_URL=postgresql://... node scripts/verify-postgresql-migration.mjs [path/to/dev.db]\n```\n\n---\n\n### `bootstrap-postgresql.sh`\n\nPostgreSQL 初始化脚本，标记已有迁移为已应用并执行 `prisma migrate deploy`。\n\n```bash\nDATABASE_URL=postgresql://... bash scripts/bootstrap-postgresql.sh\n```\n\n---\n\n## 部署运维\n\n### `load-local-env.sh`\n\n环境变量加载工具库，提供以下函数：\n\n| 函数 | 说明 |\n|------|------|\n| `load_dotenv_file <file>` | 解析并导出 `.env` 文件中的变量 |\n| `load_local_env_fallbacks` | 依次尝试加载 `.env.feishu.local` 和 `.env.runtime.local` |\n| `normalize_database_url` | 验证 `DATABASE_URL` 使用 PostgreSQL 协议 |\n\n---\n\n### `install-systemd-user-services.sh`\n\n安装并启动所有 systemd 用户服务：\n\n- `agent-platform-dev.service` — 开发服务器\n- `agent-platform-feishu.service` — 飞书运行时\n- `agent-platform-remote-runner-gateway.service` — 远程 Runner 网关\n- `agent-platform-scheduled-jobs.service` — 定时任务运行器\n\n---\n\n### 服务启动脚本\n\n| 脚本 | 启动的服务 |\n|------|-----------|\n| `run-agent-platform-dev.sh` | `npm run dev` |\n| `run-feishu-runtime.sh` | `npm run feishu:runtime` |\n| `run-scheduled-job-runner.sh` | `npm run scheduled-jobs:runtime` |\n\n所有脚本共享相同的模式：\n1. `cd` 到项目根目录\n2. 加载本地环境变量\n3. 验证 `DATABASE_URL`\n4. 设置 `PATH`\n5. `exec` 启动对应命令\n\n---\n\n## 质量检查\n\n### `check-long-files.ts`\n\n检查项目中是否存在超过阈值行数的文件。\n\n**调用链：**\n```\nmain() → captureLongFileBaseline(cwd) → longFileNotice(baseline)\n```\n\n**运行方式：**\n```bash\nnpx ts-node scripts/check-long-files.ts\n```\n\n---\n\n## 截图工具\n\n### `capture-full.mjs` 和 `take-screenshots.mjs`\n\n使用 Playwright 对平台各页面进行截图，输出到 `docs/screenshots/`。\n\n**覆盖页面：**\n- Dashboard（`/`）\n- Workspaces（`/workspaces`）\n- Chat（`/chat`）\n- Gateway Tools（`/gateway-tools`）\n- Rooms（`/rooms`）\n- Workflow（`/workflow`）\n- Tasks（`/tasks`）\n\n**认证方式：** 从 `.env` 读取 `AUTH_ADMIN_USERNAME` 和 `AUTH_ADMIN_PASSWORD`，通过 UI 登录。\n\n**`take-screenshots.mjs` 额外功能：** 生成 16:9 比例的封面图（`platform_cover_*.png`）。\n\n---\n\n## 项目管理\n\n### `submit-to-miaoda-pm.mjs`\n\n向飞书秒搭 PM 平台提交项目展示记录。\n\n**行为：**\n1. 检查 `FEISHU_DOC_URL` 是否有效\n2. 若无效，自动通过 `importMarkdownAsFeishuDocument()` 从 `docs/AGENT_PLATFORM_V2_SHOWCASE.md` 创建飞书云文档\n3. 构建项目展示 payload\n4. 检查是否已存在同名记录（存在则 PATCH，否则 POST）\n\n### `submit-updates-to-miaoda-pm.mjs`\n\n向飞书秒搭 PM 平台同步项目进展记录（5 个阶段：25% → 55% → 75% → 90% → 100%）。\n\n---\n\n## 工具脚本\n\n### `set-agent-nickname.ts`\n\n列出所有 Agent 并展示设置昵称的方法（API 和 Prisma Studio）。\n\n### `list-available-agents.ts`\n\n调用 `listLiveRoomCatalogAgents()` 列出可用的 Agent ID 和标签。\n\n### `scheduled-job-runner.ts`\n\n定时任务运行器入口，调用 `startScheduledJobRunner(prisma, signal)`，支持 `SIGINT`/`SIGTERM` 优雅关闭。\n\n---\n\n## 与核心代码的依赖关系\n\n```mermaid\ngraph TB\n    subgraph scripts\n        A[validate-workflow-documents.ts]\n        B[new-workflow-document.ts]\n        C[check-long-files.ts]\n        D[remote-runner-gateway.ts]\n        E[scheduled-job-runner.ts]\n        F[register-remote-node.ts]\n        G[feishu-standalone-monitor.js]\n    end\n    subgraph src/lib\n        H[workflow-validator]\n        I[workflow-reader]\n        J[long-file-guard]\n        K[remote-node-ws]\n        L[scheduled-jobs/runner]\n        M[remote-node-registry]\n        N[feishu-long-connection]\n    end\n    A --> H\n    A --> I\n    B --> H\n    B --> I\n    C --> J\n    D --> K\n    E --> L\n    F --> M\n    G --> N\n```\n\n---\n\n## 注意事项\n\n1. **Windows 兼容性** — `agent-platform-runner.js` 中的 `spawnPi()` 在 Windows 上使用 PowerShell 编码命令（Base64 UTF-16LE）来避免参数转义问题，prompt 通过临时文件传递\n2. **WebSocket 回退** — `agent-platform-runner.js` 内置了完整的 WebSocket 客户端实现，当 `ws` 包不可用时自动启用\n3. **工作区安全** — 远程 Runner 严格限制工作目录在配置的 workspace 内，防止路径穿越\n4. **Git 钩子集成** — `validate-workflow-documents.ts` 的 `--hook-batch` 模式专为 Git 提交钩子设计，区分文档校验失败（阻止提交）和运行时错误（允许提交）\n5. **systemd 部署** — 生产环境通过 systemd 用户服务管理各进程，`install-systemd-user-services.sh` 一键安装","skills":"# skills\n\n\n\n# Skills 模块\n\n`skills/` 目录是 Agent Platform v2 的**技能定义层**，为各类 AI Agent（Codex、Claude Code、Antigravity、Pi Agent、Deepseek 等）提供标准化的操作指南。每个子目录包含一个 `SKILL.md` 文件，定义特定场景下的行为规范、工作流和 API 调用约定。\n\n## 技能清单\n\n| 技能名称 | 目录 | 用途 |\n|---|---|---|\n| `feishu-doc-import` | `skills/feishu-doc-import/` | 本地 Markdown → 飞书云文档导入 + 展示记录同步 |\n| `feishu-miaoda` | `skills/feishu-miaoda/` | 飞书秒搭 PM 集成的标准操作指南（主文档） |\n| `feishu-miaodao` | `skills/feishu-miaodao/` | `feishu-miaoda` 的别名入口 |\n| `karpathy-codex` | `skills/karpathy-codex/` | Karpathy 风格编码规范（高严谨度、最小 diff） |\n\n## 技能间关系\n\n```mermaid\ngraph LR\n    A[\"feishu-doc-import\"] -->|\"调用 importMarkdownAsFeishuDocument\"| B[\"lark-cli\"]\n    A -->|\"更新 FEISHU_DOC_URL\"| C[\".env\"]\n    A -->|\"提交展示记录\"| D[\"feishu-miaoda\"]\n    D -->|\"GET / PATCH / POST\"| E[\"Miaoda PM OpenAPI\"]\n    F[\"feishu-miaodao\"] -.->|\"别名引用\"| D\n```\n\n`feishu-doc-import` 是**执行层**技能，负责具体的文档导入和 URL 生成；`feishu-miaoda` 是**规范层**技能，定义所有 Agent 与 Miaoda PM 交互的标准流程。`feishu-miaodao` 仅作为别名存在，内容指向 `feishu-miaoda`。\n\n---\n\n## feishu-doc-import\n\n### 适用场景\n\n当本地 Markdown 文档需要自动转换为飞书云文档（Feishu Cloud Doc）时使用。典型触发条件：\n\n- 飞书文档链接返回 404 或空白\n- 链接中包含占位符 token（如 `doxcnAgentPlatformV2Showcase2026`）\n- 需要将 `docs/AGENT_PLATFORM_V2_SHOWCASE.md` 发布为在线文档\n\n### 核心 API\n\n```typescript\nimport { importMarkdownAsFeishuDocument } from '../src/lib/feishu-document-import';\n\nconst docUrl = await importMarkdownAsFeishuDocument({\n  content: markdownString,\n  name: '文档标题',\n});\n// 返回: \"https://*.feishu.cn/docx/...\"\n```\n\n### 内部机制\n\n`importMarkdownAsFeishuDocument` 的执行流程：\n\n1. 创建临时目录，写入 `plan.md`（去除 frontmatter 和顶层 `#` 标题，确保渲染干净）\n2. 调用 `lark-cli`：\n\n```bash\nlark-cli docs +create --as bot --api-version v2 \\\n  --title \"<Title>\" \\\n  --doc-format markdown \\\n  --content @plan.md \\\n  --format json\n```\n\n3. 从 JSON 响应中提取文档 URL 并返回\n\n### 自动化脚本\n\n`scripts/submit-to-miaoda-pm.mjs` 封装了完整的导入 + 同步流程：\n\n```bash\nnode scripts/submit-to-miaoda-pm.mjs\n# 或指定已有文档 URL：\nnode scripts/submit-to-miaoda-pm.mjs --doc-url=https://feishu.cn/docx/<token>\n```\n\n脚本行为：\n\n| 步骤 | 行为 |\n|---|---|\n| 占位符检测 | 检查 `FEISHU_DOC_URL` 是否为空或包含 `doxcnAgentPlatformV2Showcase2026` |\n| 自动导入 | 若无效，调用 `importMarkdownAsFeishuDocument` 创建新文档 |\n| 环境持久化 | 将新 URL 写回 `.env` 的 `FEISHU_DOC_URL` 字段 |\n| 展示记录 Upsert | 查询 Miaoda PM 中名为 `'Agent Platform v2'` 的记录，存在则 `PATCH`，不存在则 `POST` |\n\n---\n\n## feishu-miaoda\n\n### 定位\n\n所有 AI Agent 与飞书秒搭（Miaoda PM）低代码平台交互的**标准操作规范**。定义了环境变量要求、工作流步骤、数据库 Schema 和故障排查方法。\n\n### 必需环境变量\n\n| 变量名 | 说明 |\n|---|---|\n| `FEISHU_MIAODA_PM_API_KEY` | Miaoda PM OpenAPI 的 Bearer Token |\n| `FEISHU_MIAODA_PM_NEW_API_URL` | Miaoda PM 数据库 API 端点 URL |\n| `FEISHU_DOC_URL` | 飞书云文档在线 URL，同步到记录的 `docUrls` 字段 |\n\n### 标准工作流（4 步）\n\n1. **更新本地展示文档** — 确保 `docs/AGENT_PLATFORM_V2_SHOWCASE.md` 内容准确\n2. **执行同步脚本** — `node scripts/submit-to-miaoda-pm.mjs`\n3. **脚本自动处理** — 文档验证 → 自动创建 → `.env` 持久化 → Miaoda PM Upsert\n4. **验证响应** — 确认输出包含 `HTTP Status: 200/201` 和 `Record ID`\n\n### Miaoda PM 数据库 Schema\n\n```json\n{\n  \"name\": \"Agent Platform v2\",\n  \"description\": \"面向企业级复杂研发场景的高能 AI Agent 协作平台...\",\n  \"resultDescription\": \"1. 👥 多 Agent Live Room\\n2. ⚡️ 飞书卡片 50ms Fast-Ack\\n...\",\n  \"categoryId\": \"3d2ce773-9f06-49b7-b9b9-04217e09cd3e\",\n  \"categoryName\": \"内部工具\",\n  \"tags\": [\"工程\", \"测试\"],\n  \"gitUrl\": \"file:///data1/code/agent-platform-v2\",\n  \"projectUrl\": \"\",\n  \"docUrls\": [\n    { \"name\": \"说明文档\", \"url\": \"https://feishu.cn/docx/...\" }\n  ],\n  \"isShowcase\": true,\n  \"status\": \"completed\",\n  \"priority\": \"P2\"\n}\n```\n\n### 故障排查\n\n| 症状 | 原因 | 解决方案 |\n|---|---|---|\n| `❌ 缺少环境变量 FEISHU_MIAODA_PM_NEW_API_URL 或 FEISHU_MIAODA_PM_API_KEY` | `.env` 未配置 | 检查并填充对应变量 |\n| `lark-cli` 执行失败 | CLI 未安装或认证过期 | 检查 `lark-cli` 状态，或手动传入 `--doc-url=<valid_url>` |\n| HTTP 401 / 403 | Token 过期 | 更新 `FEISHU_MIAODA_PM_API_KEY` |\n\n---\n\n## feishu-miaodao\n\n`feishu-miaodao` 是 `feishu-miaoda` 的**别名技能**，其 `SKILL.md` 仅包含对主文档的引用：\n\n> 请参阅主技能文档 `skills/feishu-miaoda/SKILL.md`。\n\n存在目的：兼容不同 Agent 框架对技能名称的拼写差异（\"miaoda\" vs \"miaodao\"）。\n\n---\n\n## karpathy-codex\n\n### 适用场景\n\n当用户要求更高的工程严谨度和更低的 diff 噪音时启用。适用于非平凡的工程任务。\n\n### 核心规则\n\n| 规则 | 要点 |\n|---|---|\n| **先思考再编码** | 明确假设；多义请求时主动澄清而非静默选择 |\n| **简洁优先** | 用最少的组件解决问题；不添加未被要求的抽象或扩展性 |\n| **外科手术式修改** | 只触碰与任务直接相关的文件和行；不重构相邻代码 |\n| **目标驱动执行** | 将模糊需求转化为具体检查项；完成前用最低成本验证 |\n\n### 反模式\n\n- 静默假设跳跃\n- 以修复为名的重构\n- 用户未要求的\"未来兼容性\"设计\n- 冗长解释（短答案 + 验证步骤即可）\n\n---\n\n## 技能注册位置\n\n所有技能在以下位置注册，确保各 Agent 框架均可发现：\n\n- `AGENTS.md`\n- `CLAUDE.md`\n- `skills/<name>/SKILL.md`\n- `.claude/skills/<name>/SKILL.md`\n\n## 与代码库的集成点\n\n| 集成点 | 路径 | 说明 |\n|---|---|---|\n| 文档导入模块 | `src/lib/feishu-document-import.ts` | 提供 `importMarkdownAsFeishuDocument` 函数 |\n| 同步脚本 | `scripts/submit-to-miaoda-pm.mjs` | 自动化导入 + Miaoda PM 同步 |\n| 展示文档 | `docs/AGENT_PLATFORM_V2_SHOWCASE.md` | 被导入为飞书云文档的源文件 |\n| 环境配置 | `.env` | 存储 `FEISHU_DOC_URL`、`FEISHU_MIAODA_PM_API_KEY` 等 |","src-app":"# src — app\n\n\n\n# src/app — 应用层\n\n## 概述\n\n`src/app` 是 Next.js App Router 的根目录，承载了平台的所有前端页面和 API 路由。它分为两大块：\n\n- **页面组件**（`page.tsx`）：客户端组件，负责 UI 渲染和状态管理\n- **API 路由**（`api/*/route.ts`）：服务端处理函数，负责业务逻辑、数据持久化和外部服务调用\n\n---\n\n## 架构总览\n\n```mermaid\ngraph TB\n    subgraph 前端页面\n        Dashboard[Dashboard 首页]\n        Agents[Agent 管理]\n        AdminUsers[用户管理]\n        Chat[聊天]\n        Tasks[任务]\n        Rooms[Live Rooms]\n        GatewayTools[Gateway 工具]\n    end\n\n    subgraph API 路由\n        AuthAPI[api/auth/*]\n        AdminAPI[api/admin/users/*]\n        AgentsAPI[api/agents/*]\n        ChatAPI[api/chat/*]\n        GatewaysAPI[api/gateways/*]\n        FeishuAPI[api/feishu/*]\n        LiveRoomsAPI[api/live-rooms/*]\n        ControlPlane[api/control-plane/*]\n    end\n\n    subgraph 核心库\n        AuthLib[lib/auth-users]\n        Prisma[lib/prisma]\n        GatewayAuth[lib/gateway-auth]\n        OpenClaw[lib/openclaw-client]\n        FeishuLib[lib/feishu*]\n        LiveRoomLib[lib/live-room*]\n    end\n\n    Dashboard --> AgentsAPI\n    Dashboard --> GatewaysAPI\n    Agents --> AgentsAPI\n    AdminUsers --> AdminAPI\n    Chat --> ChatAPI\n    Tasks --> AgentsAPI\n    Rooms --> LiveRoomsAPI\n    GatewayTools --> GatewaysAPI\n\n    AuthAPI --> AuthLib\n    AdminAPI --> AuthLib\n    AdminAPI --> Prisma\n    AgentsAPI --> Prisma\n    ChatAPI --> Prisma\n    GatewaysAPI --> GatewayAuth\n    GatewaysAPI --> OpenClaw\n    GatewaysAPI --> Prisma\n    FeishuAPI --> FeishuLib\n    LiveRoomsAPI --> LiveRoomLib\n    LiveRoomsAPI --> Prisma\n    ControlPlane --> GatewayAuth\n```\n\n---\n\n## 页面组件\n\n### Dashboard（`src/app/page.tsx`）\n\n平台首页，展示 Gateway 状态、Agent 列表和远程 Runner 面板。\n\n- 调用 `fetchDashboardData` 获取聚合数据\n- 集成 `RegisterGatewayModal`、`CreateAgentModal`、`RemoteRunnersPanel` 等组件\n\n### Agent 管理（`src/app/agents/page.tsx`）\n\nAgent 身份配置页面，支持为每个 Agent 设置：\n\n| 字段 | 说明 |\n|------|------|\n| `userNickname` | 用户自定义昵称，用于 @mention |\n| `roleDescription` | 角色描述 |\n| `emojiIcon` | 图标（从预设列表选择） |\n| `colorTag` | 颜色标签（从预设色板选择） |\n\n**关键行为：**\n\n- Agent 按 Gateway 分组展示（Platform Local 按 hostname 分组）\n- 编辑时调用 `PATCH /api/agents/[id]`\n- 保存后自动更新 `displayName` 和 `shortAlias`\n- 状态徽章支持 `online` / `offline` / `busy` / `error` 四种状态\n\n**组件结构：**\n\n```\nAgentsPage\n├── AgentCard（每个 Agent 的卡片容器）\n│   ├── ViewMode（只读展示）\n│   └── EditMode（编辑表单）\n└── StatusBadge（状态标签）\n```\n\n### 用户管理（`src/app/admin/users/page.tsx`）\n\n管理员专属页面，功能包括：\n\n- **创建用户**：用户名（3-64 位字母/数字/`._-`）、显示名（可选）、初始密码（≥8 位）\n- **重置密码**：通过 `window.prompt` 输入新密码\n- **删除用户**：确认后删除，资源保留为无主资源\n\n所有操作需要管理员权限，通过 `requireAdmin` 中间件保护。\n\n### 其他页面\n\n| 路径 | 说明 |\n|------|------|\n| `chat/page.tsx` | 聊天界面，支持房间列表和消息收发 |\n| `tasks/page.tsx` | 任务管理，集成 ACPX harness 选项 |\n| `rooms/page.tsx` | Live Room 列表 |\n| `workspaces/page.tsx` | 工作区管理 |\n| `gateway-tools/page.tsx` | Gateway 工具（注册、测试、配置） |\n| `remote-ssh-tools/page.tsx` | 远程 SSH 主机管理 |\n| `login/page.tsx` | 登录页面 |\n\n---\n\n## API 路由\n\n### 认证（`api/auth/*`）\n\n| 路由 | 方法 | 说明 |\n|------|------|------|\n| `/api/auth/login` | POST | 用户名+密码登录，设置 `httpOnly` Cookie |\n| `/api/auth/logout` | POST | 清除会话 Cookie |\n| `/api/auth/me` | GET | 获取当前登录用户信息 |\n\n**登录流程：**\n\n```\nPOST /api/auth/login\n  → authenticateUser(username, password)\n  → createSessionForUser(user)\n  → 设置 AUTH_COOKIE（httpOnly, sameSite=lax, maxAge=86400）\n```\n\n生产环境下 Cookie 带 `secure` 标志。\n\n### 管理员用户管理（`api/admin/users/*`）\n\n| 路由 | 方法 | 说明 |\n|------|------|------|\n| `/api/admin/users` | GET | 列出所有用户 |\n| `/api/admin/users` | POST | 创建新用户 |\n| `/api/admin/users/[id]` | DELETE | 删除用户（不能删除自己） |\n| `/api/admin/users/[id]/reset-password` | POST | 重置密码 |\n\n**认证链：** 所有路由经过 `requireAdmin` → `requireCurrentUser` → `verifySessionToken` → `verifyOperatorSession` → `keyedDigest`（恒定时间比较）。\n\n**创建用户验证规则：**\n- 用户名：`/^[a-zA-Z0-9._-]{3,64}$/`\n- 密码：至少 8 位\n- 显示名：最多 100 字符\n- 用户名重复返回 `409`\n\n### Agent 管理（`api/agents/*`）\n\n#### `GET /api/agents`\n\n获取所有 Agent 列表，是平台最核心的数据聚合端点。\n\n**执行流程：**\n\n1. 调用 `ensurePlatformLocalAgents()` 确保平台内置 Agent 存在于数据库\n2. 从数据库查询所有 Agent（含 Gateway 关联）\n3. 按 `backend:type` 统计数量（用于生成去重显示名）\n4. 为每个 Agent 计算：\n   - `displayName`：用户昵称 > 自动生成名\n   - `rawName`：格式如 `\"Platform Local - Claude\"` 或 `\"Linux Gateway - Claude\"`\n   - `shortAlias`：基于昵称生成的简短别名\n   - `colorTag` / `emojiIcon`：用户设置 > 默认值\n   - `status`：通过 `computeEffectiveAgentStatus` 计算有效状态（远程 Agent 考虑心跳新鲜度，90 秒阈值）\n   - `capabilities`：解析 JSON 字符串，解析失败返回空数组\n\n**响应契约（Dashboard AgentCard 等消费方依赖）：**\n\n```typescript\n{\n  id: string;\n  agentKey: string;           // \"gatewayId:type\" 或 \"platform_local:type\"\n  originalName: string;       // 数据库中的原始名称\n  rawName: string;            // 完整来源名称\n  displayName: string;        // 显示名\n  name: string;               // 与 displayName 同值（向后兼容）\n  userNickname: string | null;\n  shortAlias: string | null;\n  roleDescription: string | null;\n  colorTag: string;\n  emojiIcon: string;\n  hostname: string | null;\n  status: string;             // 有效状态\n  storedStatus: string;       // 数据库原始状态\n  type: string;\n  runtimeAgentId: string | null;\n  gateway: { id, name } | null;\n  location: string | null;\n  backend: string;            // \"platform_local\" | \"gateway_openclaw\" | \"unknown\"\n  isPlatformLocal: boolean;\n  capabilities: string[];\n  lastHeartbeat: string;      // ISO 时间\n  createdAt: string;\n  updatedAt: string;\n}\n```\n\n#### `PATCH /api/agents/[id]`\n\n更新 Agent 身份信息。如果设置了 `userNickname`，会自动调用 `generateShortAlias` 生成简短别名。\n\n#### `GET/POST /api/agents/register-real`\n\n管理真实 Agent（antigravity、codex、claude、deepseek、gemini-cli、pi-agent、kimi-code 等）的注册和状态检查。\n\n### 聊天（`api/chat/*`）\n\n| 路由 | 方法 | 说明 |\n|------|------|------|\n| `/api/chat/rooms` | GET | 获取房间列表（自动确保默认房间存在） |\n| `/api/chat/messages` | GET | 获取消息（支持分页：`limit`、`before`） |\n| `/api/chat/messages` | POST | 发送消息 |\n| `/api/chat/agent-response` | POST | 生成 Agent 响应并通过 WebSocket 广播 |\n\n**消息访问控制（`canAccessRoom`）：**\n- 管理员可访问所有房间\n- 普通用户只能访问自己任务关联的房间（通过 `room.description` 中的 `TASK_ROOM:<id>` 标记匹配）\n\n**消息目标类型（`targetType`）：**\n- `task`：面向整个任务\n- `participant`：面向特定参与者（需 `targetParticipantKey` + `targetParticipantLabel`）\n- `all`：面向所有人\n\n### Gateway 管理（`api/gateways/*`）\n\n这是最复杂的 API 组，涵盖 Gateway 的完整生命周期。\n\n#### 基础 CRUD\n\n| 路由 | 方法 | 说明 |\n|------|------|------|\n| `/api/gateways` | GET | 列出所有 Gateway（含 Agent 列表） |\n| `/api/gateways` | POST | 创建 Gateway（token 加密存储） |\n\n#### 注册与心跳\n\n`POST /api/gateways/register` 支持三种 action：\n\n| action | 说明 |\n|--------|------|\n| `register` | 首次注册，upsert Gateway + Agent |\n| `heartbeat` | 心跳续期，更新状态和 Agent 信息 |\n| `unregister` | 下线，标记 Gateway 和 Agent 为 offline |\n\n**认证要求：** 请求必须携带有效 Token，且 Token 对应的 `gatewayId` 必须与请求体中的 `gatewayId` 一致。\n\n**Agent 注册时的 `runtimeAgentId` 解析优先级：**\n`runtimeAgentId` → `openclawAgentId` → `acpAgentId` → `agentId` → `id`\n\n#### 健康检查\n\n`GET /api/gateways/[id]/health`：\n\n1. 从数据库获取 Gateway 信息\n2. 向 Gateway 的 `/health` 端点发送请求（5 秒超时）\n3. 根据结果更新 `controlPlaneState`：\n   - 成功 → `status: 'online'`，计算 `loadScore`\n   - HTTP 错误 → `status: 'unhealthy'`，`consecutiveFails +1`\n   - 网络错误 → `status: 'offline'`，`consecutiveFails +1`\n\n**负载分数计算：** `cpu * 0.4 + memory * 0.4 + disk * 0.2`，上限 100。\n\n#### 连接测试\n\n`POST /api/gateways/[id]/test`：\n\n- 需要 Token 认证\n- 依次尝试 `/health`、`/healthz`、`/api/health` 三个路径\n- 如果数据库中有加密 token，解密后作为 Bearer 发送\n- 成功时更新 Gateway 状态为 `online`\n\n#### Token 管理\n\n| 路由 | 方法 | 说明 |\n|------|------|------|\n| `/api/gateways/token` | POST | 生成/刷新 Token（32 字节随机 hex） |\n| `/api/gateways/token` | GET | 验证 Token 有效性 |\n| `/api/gateways/token` | DELETE | 撤销 Token |\n\n#### OpenClaw 配置\n\n| 路由 | 方法 | 说明 |\n|------|------|------|\n| `/api/gateways/[id]/openclaw/config` | GET | 获取配置（不返回 token 明文） |\n| `/api/gateways/[id]/openclaw/config` | POST | 设置 OpenClaw Token（加密存储） |\n| `/api/gateways/[id]/openclaw/config` | DELETE | 清除 OpenClaw Token |\n| `/api/gateways/[id]/openclaw/respond` | POST | 调用 OpenClaw 响应 API |\n\n#### 跨 Gateway 聊天\n\n`POST /api/gateways/chat` 实现两个 Gateway 之间的 Agent 对话：\n\n```\n用户 prompt\n  → Gateway A Agent 回复\n  → 构建 relay prompt（包含原始问题 + A 的回复）\n  → Gateway B Agent 回复\n  → （可选，turns=2）构建 return prompt\n  → Gateway A Agent 再次回复\n```\n\n支持会话持久化（`crossGatewayChatSession` + `crossGatewayChatMessage`），可通过 `sessionId` 继续历史会话。\n\n#### Gateway 间消息\n\n| 路由 | 方法 | 说明 |\n|------|------|------|\n| `/api/gateways/messages/send` | POST | 发送消息（支持 `direct` 和 `broadcast`） |\n| `/api/gateways/messages/send` | GET | 获取消息历史 |\n| `/api/gateways/messages/incoming` | POST | 接收来自其他 Gateway 的消息 |\n| `/api/gateways/messages/incoming` | GET | 获取接收消息历史 |\n\n所有消息路由都需要 Gateway Token 认证。\n\n#### Agent 刷新\n\n`POST /api/gateways/[id]/agents/refresh`：调用 `syncGatewayAgents` 从远端 Gateway 同步 Agent 列表。\n\n### 飞书集成（`api/feishu/*`）\n\n#### Webhook（`POST /api/feishu/webhook`）\n\n飞书消息入口，处理流程：\n\n```\n接收请求\n  → 验证签名（validateFeishuRequestSignature）\n  → 验证 token（validateFeishuVerificationToken）\n  → 处理 challenge（URL 验证）\n  → 解析消息（parseFeishuMessage）\n  → 过滤：非 @bot 消息 / 自身消息 / 未授权用户\n  → 解析命令（parseFeishuCommand）\n  → 分支：\n    ├─ 是命令 → handleFeishuCommand → 回复\n    └─ 非命令 → tryRelayNonCommandToLiveRoom\n         ├─ 成功 → 可能发送 session watermark 警告\n         └─ 失败 → 发送未绑定提示\n```\n\n**关键设计：**\n- 使用 `noStore()` 禁用缓存\n- 处理过程中添加/移除 typing reaction\n- 错误时尝试向飞书发送错误回复\n\n#### 授权（`GET /api/feishu/grant`）\n\n处理飞书授权卡片的回调：\n\n1. 验证 `token` 参数（`verifyGrantActionToken`）\n2. 调用 `grantRightsForRoom` 授予权限\n3. 返回 HTML 页面展示授权结果\n\n#### 连接状态（`GET /api/feishu/connection`）\n\n检查飞书长连接运行时状态，返回 `200`（运行中）或 `503`（未运行）。\n\n### Live Room（`api/live-rooms/*`）\n\n| 路由 | 方法 | 说明 |\n|------|------|------|\n| `/api/live-rooms/[id]/members` | POST | 添加成员（Agent） |\n| `/api/live-rooms/[id]/members` | GET | 获取成员列表 |\n| `/api/live-rooms/[id]/members/[memberId]` | PATCH | 更新成员（昵称、角色、权限、Codex 设置） |\n| `/api/live-rooms/[id]/members/[memberId]` | DELETE | 移除成员 |\n| `/api/live-rooms/[id]/interrupt` | POST | 中断成员回复 |\n| `/api/live-rooms/[id]/clear-task-room` | POST | 清空关联 Task Room 的历史消息 |\n\n**添加成员时的去重逻辑：** 基于 `runtimeAgentId` + `backend` + `gatewayId`（remote_ssh 用 `roleLabel` 中的 hostId）判断是否重复。\n\n**成员权限配置（`permissionProfile`）：**\n- `safe_local`：安全本地\n- `dev_local`：开发本地（默认）\n- `full_access`：完全权限\n\n### 控制平面（`api/control-plane/execute`）\n\n通过 `GatewayManager` 单例执行控制命令：\n\n| command | 说明 |\n|---------|------|\n| `assign` | 分配任务到 Gateway |\n| `broadcast` | 广播任务到所有 Gateway |\n| `select` | 根据条件选择最佳 Gateway |\n| `status` | 获取所有 Gateway 状态 |\n\n### 其他\n\n| 路由 | 说明 |\n|------|------|\n| `GET /api/health` | 平台健康检查 |\n| `GET /api/acpx/harness-options` | 获取 ACPX harness 选项（需登录） |\n\n---\n\n## 关键设计模式\n\n### 认证分层\n\n```\nrequireAdmin(request)\n  └─ requireCurrentUser(request)\n       └─ verifySessionToken(request)\n            └─ verifyOperatorSession(token)\n                 └─ keyedDigest / safeEqual（恒定时间比较）\n```\n\n- **用户认证**：基于 Cookie 中的 session token\n- **Gateway 认证**：基于 `Authorization: Bearer <token>` 或 `X-Gateway-Token` 头\n- 两种认证体系独立，互不干扰\n\n### 数据加密\n\nGateway Token 和 OpenClaw Token 在数据库中加密存储（`encryptToken`），仅在需要时解密使用。API 响应中只返回 `hasToken: boolean`，不暴露明文。\n\n### 状态计算\n\nAgent 的 `status` 字段区分了：\n- `storedStatus`：数据库中的原始值\n- `status`：通过 `computeEffectiveAgentStatus` 计算的有效值\n\n对于远程 Gateway Agent，如果心跳超过 90 秒，即使 `storedStatus` 为 `online`，有效状态也会降级。\n\n### 响应格式约定\n\n- 成功：`{ success: true, ...data }` 或直接返回数据\n- 错误：`{ error: '描述' }` + 对应 HTTP 状态码\n- 认证错误：通过 `authenticationErrorResponse` 统一处理\n\n---\n\n## 与核心库的依赖关系\n\n| 库 | 被哪些 API 使用 |\n|----|----------------|\n| `lib/auth-users` | auth/*, admin/users/*, chat/*, live-rooms/*, acpx/* |\n| `lib/prisma` | 几乎所有 API 路由 |\n| `lib/gateway-auth` | gateways/*（register, test, messages） |\n| `lib/encryption` | gateways/*（token, openclaw/config） |\n| `lib/openclaw-client` | gateways/chat, gateways/[id]/openclaw/respond |\n| `lib/openclaw-gateway-rpc` | gateways/[id]/agents/refresh |\n| `lib/feishu*` | feishu/webhook, feishu/grant |\n| `lib/live-room*` | live-rooms/* |\n| `lib/agent-identity` | agents/*, live-rooms/* |\n| `lib/agent-effective-status` | agents/* |\n| `lib/platform-local-init` | agents/* |\n| `lib/websocket` | chat/agent-response |\n| `lib/control-plane/GatewayManager` | control-plane/execute |\n| `lib/gateway-router` | gateways/messages/send |","src-components":"# src — components\n\n\n\n# src/components 模块文档\n\n## 模块概览\n\n`src/components` 是 Agent Platform 前端的所有 UI 组件层，按功能域划分为四个子模块：\n\n| 子模块 | 职责 | 主要消费者 |\n|--------|------|-----------|\n| `common/` | 全局基础设施：认证、导航、设备配对 | `RootLayout`、`LoginPage` |\n| `dashboard/` | 仪表盘：Agent 管理、Gateway 监控、跨网关对话 | `DashboardPage`、`ChatPage`、`GatewayToolsPage` |\n| `chat/` | 聊天室：消息输入、消息展示、房间侧栏 | `ChatPage` |\n| `live-room/` | 实时协作房间：多 Agent 讨论、角色管理、权限控制 | `WorkspacesPage`、`LiveRoomsPage`、`LiveRoomDetailPage` |\n| `tasks/` | 任务管理：任务表单、任务卡片、权限快照 | `TaskChatPage` |\n\n## 架构关系\n\n```mermaid\ngraph TD\n    RootLayout[\"RootLayout (app/layout.tsx)\"]\n    RootLayout --> AuthProvider[\"AuthProvider\"]\n    RootLayout --> Sidebar[\"Sidebar\"]\n    Sidebar --> PairComputerButton[\"PairComputerButton\"]\n    Sidebar --> useAuth[\"useAuth()\"]\n\n    DashboardPage[\"DashboardPage (app/page.tsx)\"]\n    DashboardPage --> DashboardStatsView[\"DashboardStatsView\"]\n    DashboardPage --> AgentGrid[\"AgentGrid\"]\n    DashboardPage --> CreateAgentModal[\"CreateAgentModal\"]\n    DashboardPage --> RegisterGatewayModal[\"RegisterGatewayModal\"]\n    DashboardPage --> RemoteRunnersPanel[\"RemoteRunnersPanel\"]\n    DashboardPage --> FeishuRuntimeMonitor[\"FeishuRuntimeMonitor\"]\n\n    ChatPage[\"ChatPage (app/chat/page.tsx)\"]\n    ChatPage --> CrossGatewayChatPanel[\"CrossGatewayChatPanel\"]\n    ChatPage --> ChatInput[\"ChatInput\"]\n    ChatPage --> ChatMessage[\"ChatMessage\"]\n    ChatPage --> ChatSidebar[\"ChatSidebar\"]\n\n    LiveRoomWorkspace[\"LiveRoomWorkspace\"]\n    LiveRoomWorkspace --> LiveRoomDetailsPanel[\"LiveRoomDetailsPanel\"]\n    LiveRoomWorkspace --> LiveRoomThread[\"LiveRoomThread\"]\n    LiveRoomWorkspace --> LiveRoomRoomsPanel[\"LiveRoomRoomsPanel\"]\n    LiveRoomWorkspace --> useLiveRoomController[\"useLiveRoomController\"]\n    useLiveRoomController --> useLiveRoomEffects[\"useLiveRoomEffects\"]\n    useLiveRoomEffects --> websocketClient[\"websocket-client.ts\"]\n```\n\n---\n\n## common/ — 全局基础设施\n\n### AuthProvider\n\n**文件**: `src/components/common/AuthProvider.tsx`\n\n基于 React Context 的认证状态管理，是整个应用的安全边界。\n\n**核心接口**:\n\n```typescript\ninterface AuthUser {\n  id: string;\n  username: string;\n  role: 'admin' | 'user';\n  displayName: string | null;\n}\n\ninterface AuthContextValue {\n  user: AuthUser | null;\n  loading: boolean;\n  login: (username: string, password: string) => Promise<{ success: boolean; error?: string }>;\n  logout: () => Promise<void>;\n}\n```\n\n**生命周期**:\n\n1. 挂载时调用 `GET /api/auth/me` 恢复会话\n2. `login()` 调用 `POST /api/auth/login`，成功后更新 `user` 状态\n3. `logout()` 调用 `POST /api/auth/logout`，清空 `user`\n\n**使用方式**:\n\n```tsx\n// 在任意组件中获取认证状态\nconst { user, loading, login, logout } = useAuth();\n```\n\n**关键设计**:\n- `loading` 初始为 `true`，防止未认证时闪烁\n- `Sidebar` 组件依赖 `loading` 和 `user` 做路由守卫（未登录重定向到 `/login`）\n\n---\n\n### Sidebar\n\n**文件**: `src/components/common/Sidebar.tsx`\n\n应用主导航栏，包含路由守卫逻辑。\n\n**菜单结构**:\n\n| 路由 | 标签 | 图标 | 可见性 |\n|------|------|------|--------|\n| `/` | Dashboard | 📊 | 所有用户 |\n| `/workspaces` | Workspaces | 🧠 | 所有用户 |\n| `/chat` | Chat Room | 💬 | 所有用户 |\n| `/gateway-tools` | Gateway Tools | 🛠️ | 所有用户 |\n| `/remote-ssh-tools` | Remote SSH | 🧷 | 所有用户 |\n| `/tasks` | 任务 | 📋 | 所有用户 |\n| `/workflow` | Workflow | 🧭 | 所有用户 |\n| `/admin/users` | 用户管理 | 👥 | 仅 admin |\n\n**行为**:\n- 折叠状态持久化到 `localStorage`（key: `app-sidebar-collapsed`）\n- 在 `/login` 页面完全隐藏\n- 底部集成 `PairComputerButton` 和退出登录按钮\n\n---\n\n### PairComputerButton\n\n**文件**: `src/components/common/PairComputerButton.tsx`\n\n将本地电脑接入平台的配对入口。\n\n**执行流程**:\n\n```\n用户点击 → POST /api/pairing-tickets → 获得 token\n→ 生成命令: {origin}/runner.js | node - --pairing-token={token}\n→ 用户复制到目标机器终端执行\n```\n\n**剪贴板兼容策略** (`copyText` 函数):\n\n1. 优先使用 `navigator.clipboard.writeText`（需要 HTTPS 或 localhost）\n2. 失败时回退到 `document.execCommand('copy')`（创建临时 textarea）\n3. 两者都失败时提示用户手动复制\n\n> **注意**: 平台通常通过 HTTP 在局域网提供服务，因此 `navigator.clipboard` 通常不可用，回退路径是主要执行路径。\n\n---\n\n## dashboard/ — 仪表盘组件\n\n### 导出索引\n\n**文件**: `src/components/dashboard/index.ts`\n\n```typescript\nexport { AgentCard } from './AgentCard';\nexport { AgentGrid } from './AgentGrid';\nexport { CreateAgentForm } from './CreateAgentForm';\nexport { CreateAgentModal } from './CreateAgentModal';\nexport { CrossGatewayChatPanel } from './CrossGatewayChatPanel';\nexport { DashboardStatsView } from './DashboardStats';\nexport { OpenClawGatewayConsole } from './OpenClawGatewayConsole';\nexport { RemoteGatewayForm } from './RemoteGatewayForm';\nexport { RegisterGatewayModal } from './RegisterGatewayModal';\nexport { RemoteRunnersPanel } from './RemoteRunnersPanel';\n```\n\n---\n\n### AgentCard / AgentGrid\n\n**文件**: `src/components/dashboard/AgentCard.tsx`, `src/components/dashboard/AgentGrid.tsx`\n\nAgent 状态展示与管理的核心组件。\n\n**AgentCard** 展示单个 Agent 的：\n- 名称、状态（online/offline/busy/error）\n- 位置、能力标签\n- 状态切换按钮（上线/下线/忙碌）\n- 最后心跳时间（通过 `formatAgentHeartbeat` 格式化）\n\n**AgentGrid** 实现乐观更新模式：\n\n```\n用户点击状态按钮\n  → 立即更新本地 state（乐观 UI）\n  → 调用 PUT /api/agents/{id}\n  → 成功：通知父组件刷新\n  → 失败：回滚到原始 agents 数组\n```\n\n**状态颜色映射**:\n\n| 状态 | 颜色 | 标签 |\n|------|------|------|\n| online | `bg-green-500` | 在线 |\n| offline | `bg-gray-400` | 离线 |\n| busy | `bg-yellow-500` | 忙碌 |\n| error | `bg-red-500` | 错误 |\n\n---\n\n### CreateAgentForm / CreateAgentModal\n\n**文件**: `src/components/dashboard/CreateAgentForm.tsx`, `src/components/dashboard/CreateAgentModal.tsx`\n\n创建 Agent 的表单和模态框。\n\n**表单字段**:\n\n| 字段 | 类型 | 必填 | 说明 |\n|------|------|------|------|\n| name | text | ✅ | Agent 名称 |\n| type | select | ✅ | generic / specialized / claude / codex / gemini / pi-agent |\n| location | text | ❌ | 位置描述 |\n| capabilities | text | ❌ | 逗号分隔的能力列表 |\n| gatewayId | text | ❌ | 关联的网关 ID |\n\n**API 调用**: `POST /api/agents`\n\n---\n\n### CrossGatewayChatPanel\n\n**文件**: `src/components/dashboard/CrossGatewayChatPanel.tsx`\n\n跨 Gateway 对话面板，让两个不同 Gateway 上的 Agent 进行多轮对话。\n\n**核心概念**:\n\n- **Transcript**: 对话记录，每条消息包含 `speaker`、`gatewayId`、`agentId`、`text`\n- **Session**: 可持久化的对话会话，支持续聊\n- **Turns**: 对话轮次（1 轮 = User→A→B，2 轮 = User→A→B→A）\n\n**Agent 解析逻辑** (`resolveAgentValue`):\n\n```typescript\n// 优先级：runtimeAgentId > 非前缀 id > name\nfunction resolveAgentValue(gatewayId: string, agent: GatewayAgentSummary): string {\n  if (agent.runtimeAgentId?.trim()) return agent.runtimeAgentId.trim();\n  if (agent.id && !agent.id.startsWith(`${gatewayId}:`)) return agent.id;\n  return agent.name;\n}\n```\n\n**自动刷新机制**:\n- 选择 Gateway 后自动调用 `POST /api/gateways/{id}/agents/refresh`\n- 使用 `autoRefreshedGatewayIds` ref 确保每个 Gateway 只自动刷新一次\n- 支持手动刷新按钮\n\n**API 端点**:\n- `GET /api/gateways/chat?limit=6` — 获取历史会话\n- `POST /api/gateways/chat` — 执行跨网关对话\n- `POST /api/gateways/{id}/agents/refresh` — 刷新 Agent 列表\n\n**前置条件**: 至少 2 个已配置 `hasOpenClawToken` 的 Gateway。\n\n---\n\n### DashboardStatsView\n\n**文件**: `src/components/dashboard/DashboardStats.tsx`\n\n仪表盘顶部统计卡片，展示 Agent 总数、在线数、忙碌数、离线数。\n\n接收 `DashboardStats` 类型数据（来自 `@/types`），渲染 4 个 `StatsCard`。\n\n---\n\n### FeishuRuntimeMonitor\n\n**文件**: `src/components/dashboard/FeishuRuntimeMonitor.tsx`\n\n飞书 Standalone Runtime 的进程监控面板。\n\n**监控指标**:\n\n| 指标 | 预警阈值 | 说明 |\n|------|----------|------|\n| 线程数 | ≥100 | 线程泄漏检测 |\n| 文件句柄 | — | 总体资源使用 |\n| SQLite 句柄 | ≥25 | 连接泄漏检测 |\n| RSS 内存 | — | 内存使用 |\n\n**轮询机制**: 每 10 秒调用 `GET /api/feishu/connection`，记录 baseline 用于计算增量。\n\n**健康等级**:\n- `healthy` — 所有指标正常\n- `warning` — 接近阈值\n- `critical` — 超过阈值\n\n---\n\n### GatewayMonitor\n\n**文件**: `src/components/dashboard/GatewayMonitor.tsx`\n\nGateway 健康状态实时监控面板。\n\n**数据获取流程**:\n\n```\nGET /api/gateways → 获取所有 Gateway 列表\n  → 对每个 Gateway 并行调用 GET /api/gateways/{id}/health\n  → 合并为 GatewayHealthStatus[]\n```\n\n**刷新策略**: 默认 30 秒自动刷新，支持手动刷新。\n\n**GatewayCard 展开内容**:\n- 资源使用（CPU / 内存 / 磁盘）— 进度条形式\n- Agent 列表及状态\n\n**延迟颜色规则**:\n- ≤200ms: 绿色\n- 200-500ms: 黄色\n- >500ms: 红色\n\n---\n\n### OpenClawGatewayConsole\n\n**文件**: `src/components/dashboard/OpenClawGatewayConsole.tsx`\n\nOpenClaw Gateway 的调试控制台，用于：\n1. 配置/更新每个 Gateway 的 OpenClaw token\n2. 直接发送 prompt 测试 Agent 响应\n\n**API 端点**:\n- `POST /api/gateways/{id}/openclaw/config` — 保存 token\n- `POST /api/gateways/{id}/openclaw/respond` — 发送 prompt（固定 `agentId: 'main'`）\n\n**状态管理**: 使用 `Record<string, ...>` 模式为每个 Gateway 独立维护 token 草稿、prompt 草稿、响应、错误、忙碌状态。\n\n---\n\n### RemoteGatewayForm / RegisterGatewayModal\n\n**文件**: `src/components/dashboard/RemoteGatewayForm.tsx`, `src/components/dashboard/RegisterGatewayModal.tsx`\n\n远程网关注册向导，分三步：\n\n1. **选择方式**: 手动配置 或 自动生成脚本\n2. **手动配置**: 填写名称、IP、端口、Token、Agent 列表 → `POST /api/gateways/register`\n3. **自动生成脚本**: 生成 PowerShell 脚本，在远程机器上运行 `register-remote-gateway.js daemon`\n\n**Agent 类型选项**: coding / analysis / communication / monitoring / operations / generic\n\n---\n\n### RemoteRunnersPanel\n\n**文件**: `src/components/dashboard/RemoteRunnersPanel.tsx`\n\nRemote Runner 节点状态面板，独立于 Gateway Agents 展示。\n\n**数据模型** (`RemoteRunnerNode`):\n\n```typescript\ninterface RemoteRunnerNode {\n  id: string;\n  name: string;\n  host: string;\n  status: 'online' | 'offline';\n  lastSeen: string | null;\n  harnesses?: string[] | null;\n  workspace?: string | null;\n}\n```\n\n**功能**:\n- 查看节点连接状态和最近连接时间\n- 编辑 workspace 路径（Pi 的文件和工具访问边界）\n- 删除离线 runner（需确认）\n\n**API 端点**:\n- `GET /api/remote-nodes` — 获取节点列表\n- `POST /api/remote-nodes` — 更新 workspace\n- `DELETE /api/remote-nodes` — 删除节点\n\n**设计原则**: RemoteNode 是独立数据模型，不与 `/api/agents` 合并。API 只返回非敏感元数据，不暴露 node secret hash。\n\n---\n\n## chat/ — 聊天室组件\n\n### ChatInput\n\n**文件**: `src/components/chat/ChatInput.tsx`\n\n聊天输入框，支持 @提及 功能。\n\n**提及检测逻辑**:\n\n```typescript\n// 正则匹配文本末尾的 @mention\nconst match = value.match(/@([\\w\\u4e00-\\u9fa5-]*)$/);\n```\n\n支持英文、数字、下划线、连字符和中文（`\\u4e00-\\u9fa5`）。\n\n**交互流程**:\n\n```\n用户输入 @ → 显示候选列表（最多 6 个，按名称模糊匹配）\n  → 点击候选项 → 替换 @query 为 @name + 空格\n  → 按 Enter（非 Shift+Enter）→ 发送消息\n  → 按 Shift+Enter → 换行\n```\n\n**防 blur 技巧**:\n- 候选按钮使用 `onMouseDown={(e) => e.preventDefault()}` 防止触发 textarea 的 blur\n- `handleBlur` 使用 200ms 延迟隐藏，避免点击按钮时先触发 blur\n\n**Props**:\n\n```typescript\n{\n  onSend: (content: string) => void;\n  placeholder?: string;\n  agents: AgentRef[];  // 来自 @/lib/mentions\n}\n```\n\n---\n\n### ChatMessage\n\n**文件**: `src/components/chat/ChatMessage.tsx`\n\n单条消息的展示组件。\n\n**提及高亮**: 使用正则 `/(@[a-zA-Z0-9_-]+)/g` 分割文本，将 `@xxx` 部分渲染为 `text-indigo-600 font-medium`。\n\n**布局**:\n- `isOwn=true`: 右对齐，蓝色背景白字\n- `isOwn=false`: 左对齐，白色背景灰字\n\n---\n\n### ChatSidebar\n\n**文件**: `src/components/chat/ChatSidebar.tsx`\n\n聊天室侧栏，展示房间列表和在线用户。\n\n**Props**:\n\n```typescript\n{\n  rooms: ChatRoom[];\n  currentRoomId: string;\n  onSelectRoom: (roomId: string) => void;\n  users: ChatUser[];\n}\n```\n\n---\n\n## live-room/ — 实时协作房间\n\n### 架构概览\n\nLive Room 是最复杂的组件模块，实现了多 Agent 实时协作讨论。\n\n**核心文件**（部分在截断中，但通过调用图可推断）:\n\n| 文件 | 职责 |\n|------|------|\n| `LiveRoomWorkspace.tsx` | 顶层容器，组合所有子组件 |\n| `LiveRoomThread.tsx` | 消息线程展示 |\n| `LiveRoomRoomsPanel.tsx` | 房间列表侧栏 |\n| `LiveRoomDetailsPanel.tsx` | 房间详情面板（设置、成员、权限） |\n| `use-live-room-controller.ts` | 核心状态管理和业务逻辑 |\n| `use-live-room-effects.ts` | WebSocket 连接和副作用 |\n| `use-live-room-derived.ts` | 派生状态计算 |\n| `live-room-workspace-models.tsx` | 数据模型和工具函数 |\n| `live-room-context.tsx` | React Context 提供 |\n\n**WebSocket 连接流程**:\n\n```\nuseLiveRoomController\n  → useLiveRoomEffects\n    → connectSocket\n      → ensureSocketServerReady (src/lib/websocket-client.ts)\n```\n\n### LiveRoomDetailsPanel\n\n**文件**: `src/components/live-room/LiveRoomDetailsPanel.tsx`\n\n房间详情面板，包含以下区域：\n\n**1. 房间设置**\n- Title / Description / Mode\n- Mode 选项:\n  - `discussion`: 仅定向成员或当前 speaker 回复\n  - `execution`: 按 planner → researcher → implementer → reviewer → tester 顺序\n  - `hybrid`: 平时 discussion，发送 `/run ...` 时启动角色队列\n- 操作: 保存 / 归档 / 永久删除（仅已归档房间）\n\n**2. 当前 Topic**\n- 可编辑的讨论主题\n\n**3. 当前 Speaker**\n- 点击成员切换发言者\n\n**4. 房间成员**\n- 显示每个成员的：\n  - 权限标签（`permissionProfile`）\n  - 上下文水印状态（`contextWatermark`）\n  - 角色（`role`，仅非 user 类型）\n  - Codex 配置（`codexModel`、`codexReasoningEffort`，仅 `harnessType === 'codex'`）\n\n**工具函数**（来自 `live-room-workspace-models.tsx`）:\n\n| 函数 | 用途 |\n|------|------|\n| `getAgentLabel` | 获取 Agent 显示标签 |\n| `getMemberSubtitle` | 获取成员副标题 |\n| `getPermissionBadgeTone` | 权限徽章颜色 |\n| `getPermissionProfileLabel` | 权限配置标签 |\n| `getWatermarkPolicyLabel` | 水印策略标签 |\n| `getWatermarkPolicyTone` | 水印策略颜色 |\n| `getWatermarkTooltip` | 水印提示文本 |\n| `getWatermarkUsageBarTone` | 水印使用量条颜色 |\n| `getWatermarkUsageLabel` | 水印使用量标签 |\n\n**常量**:\n- `MEMBER_ROLES` — 成员角色列表\n- `PERMISSION_PROFILES` — 权限配置列表\n- `CODEX_REASONING_EFFORTS` — Codex 推理力度选项\n\n---\n\n## tasks/ — 任务组件\n\n### TaskForm\n\n**文件**: `src/components/tasks/TaskForm.tsx`\n\n任务创建表单。\n\n**关键依赖**:\n- `getHarnessKey` — 内部工具函数\n- `getPermissionProfileLabel` — 来自 `lib/acpx/permissions.ts`\n- `buildAcpxPermissionConfigForProfile` — 来自 `lib/acpx/permissions.ts`\n- `toggleAgent` — 内部 Agent 选择切换\n\n### TaskCard\n\n**文件**: `src/components/tasks/TaskCard.tsx`\n\n任务卡片，展示任务状态并提供执行操作。\n\n**内部函数**:\n- `handleExecuteTask` — 执行任务\n- `formatTime` — 时间格式化\n\n### WorkflowPermissionSnapshotCard\n\n**文件**: `src/components/tasks/WorkflowPermissionSnapshotCard.tsx`\n\n工作流权限快照卡片，在任务聊天页面中展示。\n\n**导出函数**: `workflowPermissionSnapshotFrom` — 从数据源构建权限快照。\n\n---\n\n## 关键设计模式\n\n### 1. 乐观更新\n\n`AgentGrid` 和 `RemoteRunnersPanel` 都采用乐观更新模式：先更新 UI，再调用 API，失败时回滚。\n\n```typescript\n// AgentGrid 中的模式\nsetAgentList(prev => prev.map(a => a.id === agentId ? { ...a, status: newStatus } : a));\ntry {\n  await fetch(`/api/agents/${agentId}`, { method: 'PUT', ... });\n  onAgentRefresh?.();\n} catch {\n  setAgentList(agents); // 回滚\n}\n```\n\n### 2. 轮询监控\n\n`FeishuRuntimeMonitor`（10s）和 `GatewayMonitor`（30s）使用 `setInterval` 轮询，组件卸载时清理。\n\n```typescript\nuseEffect(() => {\n  let active = true;\n  const refresh = async () => { /* ... */ };\n  void refresh();\n  const interval = setInterval(() => void refresh(), 10_000);\n  return () => { active = false; clearInterval(interval); };\n}, []);\n```\n\n### 3. 模态框模式\n\n`CreateAgentModal` 和 `RegisterGatewayModal` 使用相同的模态框结构：\n- `isOpen` 控制渲染\n- 背景遮罩点击关闭\n- 内部表单成功后调用 `onSuccess` + `onClose`\n\n### 4. 多 Gateway 状态隔离\n\n`OpenClawGatewayConsole` 和 `CrossGatewayChatPanel` 使用 `Record<string, T>` 模式为每个 Gateway 独立维护状态，避免状态交叉污染。\n\n### 5. 剪贴板降级\n\n`PairComputerButton` 的 `copyText` 函数实现了三级降级：\n1. `navigator.clipboard.writeText`\n2. `document.execCommand('copy')`\n3. 提示用户手动复制\n\n---\n\n## 与外部模块的集成\n\n| 外部模块 | 集成点 |\n|----------|--------|\n| `@/types` | `Agent`、`Gateway`、`GatewayAgentSummary`、`DashboardStats` 类型定义 |\n| `@/lib/chat-types` | `ChatMessage`、`ChatRoom`、`ChatUser` 类型 |\n| `@/lib/mentions` | `AgentRef` 类型（ChatInput 使用） |\n| `@/lib/dashboard-display` | `formatAgentHeartbeat`、`formatRemoteNodeLastSeen`、`UNREPORTED_CAPABILITIES_LABEL` |\n| `@/lib/websocket-client` | `getSocketClient`、`ensureSocketServerReady`（Live Room 使用） |\n| `lib/acpx/permissions` | `getPermissionProfileLabel`、`buildAcpxPermissionConfigForProfile`（TaskForm 使用） |\n| `app/layout.tsx` | 挂载 `AuthProvider` 和 `Sidebar` |\n| `app/page.tsx` | 组合 Dashboard 组件 |\n| `app/chat/page.tsx` | 组合 Chat 和 CrossGatewayChatPanel |\n| `app/workspaces/page.tsx` | 使用 `LiveRoomWorkspace` |\n| `app/rooms/page.tsx` | 使用 `LiveRoomWorkspace` |\n| `app/login/page.tsx` | 使用 `useAuth` |\n| `app/gateway-tools/page.tsx` | 使用 `OpenClawGatewayConsole` |\n| `gateways/register/page.tsx` | 使用 `RemoteGatewayForm` |\n\n---\n\n## 测试覆盖\n\n`live-room-workspace-models.tsx` 中的工具函数有专门的测试文件：\n\n- `tests/context-watermark-display.test.ts` — 测试 `getWatermarkPolicyLabel`、`getWatermarkTooltip`、`getWatermarkUsageLabel`\n\n这些函数是纯函数，不依赖 React 状态，便于单元测试。","src-lib":"# src — lib\n\n\n\n# ACPX 执行引擎模块\n\n## 概述\n\n`src/lib/acpx` 是平台的 **Agent 控制平面执行引擎**（Agent Control Plane eXecution），负责将任务（Task）分发到不同的 AI Harness（如 Codex、Claude、DeepSeek、Gemini CLI 等）并管理其完整生命周期。\n\n核心职责：\n\n- **多后端执行**：支持 `platform_local`（本地进程）、`gateway_openclaw`（OpenClaw 网关）、`remote_ssh`（远程 SSH / Runner）三种执行后端\n- **会话续接**：通过 session/thread ID 实现跨运行的上下文延续\n- **交互请求**：检测 harness 输出中的权限请求、选择请求、输入请求，并驱动用户审批流程\n- **存活检测**：监控本地 harness 进程是否意外消失，自动收口任务状态\n- **权限控制**：基于 profile 的沙箱、网络、审批策略管理\n- **事件总线**：通过 WebSocket 实时推送任务运行事件\n\n## 架构总览\n\n```mermaid\ngraph TB\n    subgraph \"执行层\"\n        RH[runner-harness.ts]\n        RH -->|platform_local| LA[Harness Adapter]\n        RH -->|gateway_openclaw| OC[OpenClaw Gateway]\n        RH -->|remote_ssh| SSH[Remote SSH / Runner]\n    end\n\n    subgraph \"交互层\"\n        RI[runner-interactions.ts]\n        IA[interaction-actions.ts]\n        IN[interactions.ts]\n        IP[in-process-approvals.ts]\n    end\n\n    subgraph \"基础设施\"\n        EB[event-bus.ts]\n        PR[process-registry.ts]\n        LVL[liveness.ts]\n        CAP[capabilities.ts]\n        CAT[catalog.ts]\n        PERM[permissions.ts]\n        PROMPT[prompt.ts]\n        HE[harness-events.ts]\n        CR[continuation-retry.ts]\n        RM[runner-metadata.ts]\n        LFC[long-file-runtime-context.ts]\n    end\n\n    RH --> RI\n    RI --> IN\n    IA --> CR\n    IA --> EB\n    LVL --> PR\n    LVL --> EB\n    LVL --> IN\n    CAT --> CAP\n    RH --> PROMPT\n    RH --> RM\n    RH --> PR\n    RH --> LFC\n    CR --> RH\n```\n\n## 核心组件\n\n### 1. 执行后端（runner-harness.ts）\n\n`runner-harness.ts` 是执行入口，根据 `executionBackend` 分发到不同实现：\n\n| 函数 | 后端 | 说明 |\n|------|------|------|\n| `executeViaLocalHarness` | `platform_local` | 通过 Harness Adapter 在本地 spawn 子进程 |\n| `executeViaGateway` | `gateway_openclaw` | 通过 OpenClaw 网关 API 远程执行 |\n| `executeViaRemoteSshHarness` | `remote_ssh` | 通过 SSH 或 Remote Runner 在远程节点执行 |\n\n**本地执行流程**：\n\n1. 调用 `getHarnessAdapter(harnessType)` 获取对应适配器\n2. 解析权限配置（`permissionConfig`），确定 `workspaceRoot`、`extraWritableRoots`、`extraReadOnlyPaths`\n3. 判断是否为续接运行（`continuationMessage` + `resumeSessionId`）：\n   - 是 → 调用 `adapter.resume()`\n   - 否 → 调用 `adapter.execute()`\n4. 通过 `registerRunningProcess` 将子进程注册到全局注册表\n5. 执行完成后，对特定 harness（kimi-code、antigravity）收集上下文使用量遥测\n\n**超时配置**：\n- 本地默认：24 小时（`DEFAULT_LOCAL_HARNESS_MAX_RUNTIME_MS`）\n- 远程默认：由 `DEFAULT_REMOTE_EXECUTION_TIMEOUT_MS` 决定\n- 可通过 `request.watchdogConfig.maxRuntimeMs` 覆盖\n\n### 2. 能力检测（capabilities.ts）\n\n`getHarnessCapabilities(harnessType, executionBackend)` 返回 `HarnessCapability` 对象，描述特定 harness 在特定后端下支持的能力：\n\n```typescript\ninterface HarnessCapability {\n  supportsQueuedUserMessages: boolean;    // 支持排队用户消息\n  supportsImmediateInterrupt: boolean;    // 支持立即中断\n  supportsResumeAfterInterrupt: boolean;  // 中断后可恢复\n  supportsLiveSessionControl: boolean;    // 支持实时会话控制\n  supportsSoftStop: boolean;              // 支持软停止\n}\n```\n\n**能力矩阵**（`platform_local` 后端）：\n\n| Harness | 排队消息 | 立即中断 | 中断恢复 | 实时控制 | 软停止 |\n|---------|---------|---------|---------|---------|--------|\n| codex | ✓ | ✓ | ✓ | ✓ | ✓ |\n| claude | ✓ | ✓ | ✓ | ✗ | ✓ |\n| gemini-cli | ✓ | ✓ | ✓ | ✗ | ✓ |\n| deepseek | ✗ | ✗ | ✗ | ✗ | ✓ |\n\n优先通过 `getHarnessAdapter` 获取适配器自定义能力，无适配器时回退到硬编码矩阵。\n\n### 3. 目录发现（catalog.ts）\n\n`deriveGatewayHarnessOptions(user)` 是 harness 选项的发现入口，根据用户角色返回可用的执行选项列表：\n\n- **非 admin 用户**：仅返回其拥有的 `remoteNode` 对应的选项\n- **admin 用户**：聚合以下来源：\n  1. **Platform Local**：从数据库 `Agent` 表（`hostname` 匹配当前服务器）获取，回退到 `getRealAgentsStatus()` 检测本地可用性\n  2. **Gateway**：从 `Gateway` + `Agent` 表获取在线的 OpenClaw 网关代理\n  3. **Remote SSH Host**：从 `RemoteHarnessHost` 表获取声明了 `supportedHarnesses` 的主机\n  4. **Remote Node**：从 `RemoteNode` 表的 `metadata.harnesses` 字段解析\n\n返回的 `HarnessOption` 包含 `gatewayId`、`executionBackend`、`harnessType`、`agentId` 等字段，供前端选择器使用。\n\n### 4. 交互请求系统\n\n交互请求是 harness 与用户之间的双向通信机制，覆盖权限审批、选项选择、补充输入等场景。\n\n#### 4.1 检测（runner-interactions.ts）\n\n`detectHarnessInteractionRequest(chunk)` 通过关键词匹配从 harness 输出流中检测交互请求：\n\n| 类型 | 触发关键词（示例） | 响应格式 |\n|------|-------------------|---------|\n| `permission_request` | \"permission\" + \"?\"、\"approve this action\"、\"需要你的确认\" | `approve_deny` |\n| `choice_request` | \"select an option\"、\"请选择\" | `single_choice` |\n| `input_request` | \"waiting for input\"、\"请输入\" | `text` |\n| `workspace_issue` | \"只读环境\"、\"read-only environment\" | — |\n\n`handleHarnessInteractionRequest` 的完整流程：\n\n1. 检查权限边界（`isPermissionRequestWithinBoundary`）—— 非 full_access 模式下，路径超出 `writableRoots` 则直接拒绝\n2. 去重：查找同 taskRun + participant + kind + message 的 pending 请求\n3. 持久化到 `TaskRunInteractionRequest` 表\n4. 更新 TaskRun / Participant / TaskSession 状态为 `waiting_for_input`\n5. 发布 `interaction_request_created` 事件\n6. 推送飞书审批卡片（`sendFeishuApprovalCard`）\n7. 若为 `in_process` 策略（仅 Codex 本地），调用 `waitForInProcessApproval` 阻塞等待\n\n#### 4.2 解决（interaction-actions.ts）\n\n`resolveInteractionRequestWithContinuation` 处理用户响应：\n\n```\n用户响应\n  │\n  ├─ 过期/已取消 → 标记 expired/cancelled，取消 in-process approval\n  │\n  ├─ deny → 标记 denied，participant 标记 failed，run 标记 failed\n  │\n  ├─ approve + in_process（Codex 本地）\n  │    → resolveInProcessApproval 唤醒阻塞的 Promise\n  │    → 原进程继续执行，无需重启\n  │\n  └─ approve/answer + 其他\n       → 构建 continuationMessage\n       → 调用 executeAcpxTaskRunWithContinuationFallback\n       → 以 resumeSessionId 启动新运行\n```\n\n**in-process 审批**（`in-process-approvals.ts`）：\n\n使用模块级 `Map<string, (result) => void>` 实现进程内 Promise 等待：\n\n- `waitForInProcessApproval(requestId, timeoutMs)` — 创建 Promise，10 分钟超时自动 deny\n- `resolveInProcessApproval(requestId, decision)` — 由用户操作触发 resolve\n- `cancelInProcessApproval(requestId)` — 取消等待，resolve 为 `{ decision: 'deny', cancelled: true }`\n\n#### 4.3 持久化（interactions.ts）\n\n提供 `TaskRunInteractionRequest` 的 CRUD 操作：\n\n- `createTaskRunInteractionRequest` — 创建\n- `findRecentPendingInteractionRequest` — 去重查询\n- `listPendingTaskRunInteractionRequests` — 列表\n- `resolveTaskRunInteractionRequest` — 标记已解决\n- `expireStaleTaskRunInteractionRequests` — 批量过期\n- `finishPendingTaskRunInteractionRequests` — 按 scope 批量取消/过期\n\n### 5. 存活检测（liveness.ts）\n\n`reconcileTaskRunLiveness(taskId)` 检测本地 harness 进程是否意外消失：\n\n**检测逻辑**：\n\n1. 查找所有 `running` / `waiting_for_input` 状态的 TaskRun\n2. 对每个 run，筛选 `platform_local` 且状态为 `running`/`waiting_for_input` 的 participant\n3. 对每个 participant：\n   - 检查 `process-registry` 中是否仍有注册 → 有则跳过\n   - 从 `controlMetadata.childPid` 读取 PID，通过 `/proc/{pid}/cmdline` 验证进程是否存活且匹配 harness 类型\n   - 若 PID 不存在且超过 30 秒宽限期（`LOCAL_STALE_GRACE_MS`）→ 标记为 stale\n4. 若存在 stale participant：\n   - 根据 `controlState` 映射最终状态（`stop_requested` → `stopped`，`interrupt_requested` → `interrupted`，其他 → `failed`）\n   - 事务性更新 TaskRun、Task、TaskSession、所有 Participant\n   - 清理 pending 交互请求\n   - 发布 `participant_failed` / `run_failed` 等事件\n\n### 6. 事件总线（event-bus.ts）\n\n`publishTaskRunEvent` 是事件发布的统一入口：\n\n1. 查询当前 taskRun 的最大 `sequence`，递增后创建 `TaskRunEvent` 记录\n2. 计算 `tier`：`stdout_chunk` / `stderr_chunk` → `detail`，其他 → `summary`\n3. 通过 Socket.IO 向 `task-run:{taskId}` 房间广播 `task-run:event` 事件\n\n### 7. 进程注册表（process-registry.ts）\n\n使用 `globalThis` 上的 Map 实现进程级单例注册表（避免热重载时丢失）：\n\n- `registerRunningProcess(entry)` — 注册\n- `getRunningProcess(participantId)` — 查询\n- `clearRunningProcess(participantId)` — 清除\n- `requestRunControl(taskRunId, participantId, action)` — 发送控制信号（`SIGKILL` 或 `SIGINT`）\n- `consumeRunControlRequest(participantId)` — 消费控制请求\n\n### 8. 权限系统（permissions.ts）\n\n**权限配置结构**：\n\n```typescript\ninterface AcpxPermissionConfig {\n  profile: 'safe_local' | 'dev_local' | 'full_access' | 'custom';\n  sandboxMode: 'read-only' | 'workspace-write' | 'danger-full-access';\n  networkAccess: 'enabled' | 'restricted';\n  approvalPolicy: 'on-request' | 'never';\n  writableRoots: string[];  // 必须以 / 开头的绝对路径\n}\n```\n\n**Profile 映射**：\n\n| Profile | sandboxMode | networkAccess | approvalPolicy |\n|---------|-------------|---------------|----------------|\n| `safe_local` | workspace-write | restricted | never |\n| `dev_local` | workspace-write | enabled | on-request |\n| `full_access` | danger-full-access | enabled | on-request |\n\n`normalizeAcpxPermissionConfig` 负责校验和归一化，`getLocalHarnessPermissionSupport` 返回各 harness 对权限配置的实际支持程度（`applied` / `partially_applied` / `recorded_only`）。\n\n### 9. Prompt 构建（prompt.ts）\n\n`buildHarnessPrompt` 组装发送给 harness 的完整 prompt，包含：\n\n- 任务名称、角色、harness 类型、执行后端\n- 最新任务室指令（最高优先级）\n- 任务背景\n- 近期任务室对话记录\n- 前序参与者输出摘要\n- 上下文水位警告（`contextWarning`）\n- 长文件运行时上下文（`longFileContext`）\n- 飞书外部 bot 联系指令（`withFeishuBotContactInstructions`）\n- Antigravity 完成契约（要求最终响应必须自包含）\n\n**上下文水位检测**（`checkContextWatermark`）：\n\n- 优先使用 provider 遥测（Codex / Kimi Code / Antigravity 的 token 使用率）\n- 回退到硬信号：任务室消息数 ≥ 60 或事件数 ≥ 400\n- 阈值：60% 提示、85% 警告（要求立即总结并建议新 session）\n\n### 10. 会话元数据持久化（runner-metadata.ts）\n\n按 harness 类型分别持久化 session 信息到 `controlMetadata`：\n\n| Harness | 元数据字段 | sessionKind |\n|---------|-----------|-------------|\n| Codex | `codexThreadId` | `codex_thread` |\n| Claude | `claudeSessionId` | `claude_session` |\n| DeepSeek | `deepseekThreadId` | `deepseek_thread` |\n| Gemini | `geminiSessionId` | `gemini_session` |\n\n每个持久化操作同时维护 `sessionTracking` 结构，记录 `rootRunId`、`latestRunId`、`rootSessionId`、`latestSessionId` 等，用于跨运行追踪同一会话链。\n\n### 11. 续接重试（continuation-retry.ts）\n\n`executeAcpxTaskRunWithContinuationFallback` 实现\"续接失败 → 新会话重试\"的降级策略：\n\n1. 首次调用 `executeAcpxTaskRun`\n2. 若单参与者且失败，检查错误是否为\"无效续接\"（通过 `adapter.isInvalidContinuationError`）\n3. 若是 → 标记原 participant 的续接为 stale，剥离 `resumeSessionId` / `resumeThreadId`，以全新会话重试\n\n### 12. Harness 事件归一化（harness-events.ts）\n\n提供事件流的去重和预览清洗：\n\n- `sanitizePreview(value, { workspaceRoot })` — 截断至 80 字符、脱敏（API key、Bearer token、签名等）、路径相对化\n- `createProgressDedupe({ toolMinMs, thinkingMinMs })` — 返回 `{ consume, flush }` 闭包：\n  - 工具事件：相同签名在 3 秒内合并计数\n  - 思考事件：相同签名或 8 秒内重复则丢弃\n  - 其他事件：相同签名去重\n\n### 13. 长文件运行时上下文（long-file-runtime-context.ts）\n\n`getLongFileRuntimeContext` 在 `platform_local` 执行前：\n\n1. 从 `config/projects.yaml` 加载项目配置\n2. 查找匹配的 `long_file_detector` job\n3. 从 git HEAD 读取长文件契约（`LONG_FILE_CONTRACT_PATH`）\n4. 扫描项目目录，统计各文件行数\n5. 返回基线（baseline）和违规文件列表（offenders）\n\n`assertLongFileRuntimeContext` 在运行结束后检查是否有文件增长超过阈值，若有则抛出错误。\n\n## 数据流\n\n```mermaid\nsequenceDiagram\n    participant Caller as 调用方\n    participant RH as runner-harness\n    participant Adapter as Harness Adapter\n    participant RI as runner-interactions\n    participant EB as event-bus\n    participant WS as WebSocket\n\n    Caller->>RH: executeViaLocalHarness(request, participant, ...node[\")\"]\n    RH->>RH: buildHarnessPrompt\n    RH->>Adapter: adapter.execute / adapter.resume\n    Adapter-->>RH: stream callbacks (stdout, stderr, events)\n    RH->>EB: publishTaskRunEvent (stdout_chunk, ...node[\")\"]\n    EB->>WS: emit 'task-run:event'\n\n    Note over Adapter: harness 输出包含权限请求\n    Adapter-->>RI: detectHarnessInteractionRequest\n    RI->>RI: createTaskRunInteractionRequest\n    RI->>EB: publishTaskRunEvent (interaction_request_created)\n    RI->>WS: 推送飞书审批卡片\n    RI-->>Caller: 阻塞等待 (in-process) 或返回\n\n    Note over Caller: 用户批准\n    Caller->>RH: resolveInteractionRequestWithContinuation\n    RH->>RH: executeAcpxTaskRunWithContinuationFallback\n    RH->>Adapter: adapter.resume (新运行)\n```\n\n## 与外部模块的依赖关系\n\n| 外部模块 | 用途 |\n|---------|------|\n| `@/lib/harness` | Harness 适配器注册和获取 |\n| `@/lib/prisma` | 数据库操作 |\n| `@/lib/websocket` | Socket.IO 服务器实例 |\n| `@/lib/feishu-api` | 飞书消息推送（审批卡片） |\n| `@/lib/openclaw-client` | OpenClaw 网关通信 |\n| `@/lib/remote-harness/*` | 远程 SSH / Runner 执行 |\n| `@/lib/real-agents/*` | 本地 agent 状态检测、遥测 |\n| `@/lib/codex-telemetry` | Codex 配额和上下文使用量 |\n| `@/lib/long-file-guard` | 长文件规则解析 |\n| `@/lib/scheduled-jobs/project-config` | 项目配置加载 |\n| `@/lib/platform-local-init` | 平台本地 agent 初始化和主机名 |\n| `@/lib/task-room` | 任务室消息计数 |\n| `@/lib/redact-sensitive` | 敏感文本脱敏 |\n\n## 关键设计决策\n\n1. **globalThis 注册表**：`process-registry.ts` 使用 `globalThis` 而非模块级变量，确保 Next.js 热重载时进程注册不丢失。\n\n2. **in-process 审批**：仅 Codex 本地支持。通过 Promise + Map 实现零延迟审批，避免重启进程。其他 harness 的审批通过\"续接运行\"实现。\n\n3. **续接降级**：`continuation-retry.ts` 确保即使 session 过期或无效，任务仍能以新会话完成，而非直接失败。\n\n4. **存活检测宽限期**：30 秒（`LOCAL_STALE_GRACE_MS`）避免在进程正常退出和状态更新之间的竞态窗口误判。\n\n5. **权限 profile 检测**：`normalizeAcpxPermissionConfig` 支持从具体配置反推 profile，也支持显式指定 `custom` profile。","src-src":"# src — src\n\n\n\n# src 模块\n\n## 概述\n\n`src` 模块包含 Next.js 应用的全局入口逻辑，由两个文件组成：\n\n| 文件 | 职责 |\n|------|------|\n| `src/instrumentation.ts` | Next.js instrumentation 钩子（当前为空占位） |\n| `src/middleware.ts` | 全局请求中间件，负责路由级认证与授权 |\n\n---\n\n## `src/instrumentation.ts`\n\n```ts\nexport async function register() {\n  // Feishu long-connection runs in a dedicated standalone Node process.\n}\n```\n\nNext.js 在应用启动时调用 `register()`。当前函数体为空——飞书长连接已拆分为独立的 Node 进程运行，不再通过 instrumentation 启动。保留此文件是为了满足 Next.js 对 `instrumentation.ts` 的约定（若存在则必须导出 `register`）。\n\n---\n\n## `src/middleware.ts`\n\n### 职责\n\n在请求到达具体路由处理函数之前，根据路径和 HTTP 方法决定：\n\n1. 该路由是否需要认证\n2. 需要什么级别的权限（普通用户 / 管理员）\n3. 未通过时如何响应（401 / 403 / 404 / 重定向）\n\n### 认证流程\n\n```mermaid\nflowchart TD\n    A[请求进入] --> B{路径匹配?}\n    B -->|排除静态资源| C[跳过中间件]\n    B -->|匹配| D{判断 surface}\n    D -->|/api/*| E[api]\n    D -->|其他| F[page]\n    E --> G[resolveRouteAuth]\n    F --> G\n    G --> H{access 级别}\n    H -->|public / machine / self_verified| I[放行]\n    H -->|deny| J[404]\n    H -->|authenticated / admin| K[调用 /api/auth/me]\n    K --> L{用户存在?}\n    L -->|否| M{surface?}\n    M -->|api| N[401 JSON]\n    M -->|page| O[重定向 /login]\n    L -->|是| P{需要 admin?}\n    P -->|是且非 admin| Q[403 JSON]\n    P -->|否 或 是 admin| I\n```\n\n### 关键逻辑说明\n\n**1. Surface 判定**\n\n```ts\nconst surface = request.nextUrl.pathname.startsWith('/api/') ? 'api' : 'page';\n```\n\n仅以 `/api/` 前缀区分。这决定了未认证时的响应形式：API 返回 JSON 错误，页面则重定向到登录页。\n\n**2. 路由认证解析**\n\n调用 `resolveRouteAuth({ surface, pathname, method })`（来自 `src/lib/auth-routes.ts`），返回一个包含 `access` 字段的对象。`access` 的可能值：\n\n| 值 | 含义 | 中间件行为 |\n|----|------|-----------|\n| `public` | 无需认证 | 直接放行 |\n| `machine` | 机器/服务间调用 | 直接放行（由其他机制保障） |\n| `self_verified` | 用户自验证即可 | 直接放行 |\n| `deny` | 路由不存在或禁止访问 | 返回 404 |\n| `authenticated` | 需要登录 | 检查用户，未登录则拦截 |\n| `admin` | 需要管理员 | 检查用户角色，非 admin 则 403 |\n\n**3. 用户信息获取**\n\n中间件通过内部 `fetch` 调用 `/api/auth/me` 获取当前用户：\n\n```ts\nconst authResponse = await fetch(new URL('/api/auth/me', request.url), {\n  headers: { cookie: request.headers.get('cookie') || '' },\n  cache: 'no-store',\n});\n```\n\n- 透传原始请求的 `cookie` 头\n- `cache: 'no-store'` 确保每次请求都重新验证，不依赖缓存\n- 仅提取 `user.role` 字段用于权限判断\n\n**4. 未认证响应**\n\n- **API 请求**：`401` + `{ error: 'Authentication required' }`\n- **页面请求**：302 重定向到 `/login?next=<原路径>`，登录成功后可回跳\n\n### 匹配规则\n\n```ts\nexport const config = {\n  matcher: ['/((?!_next/static|_next/image|favicon.ico|fonts/).*)'],\n};\n```\n\n排除 Next.js 静态资源（`_next/static`、`_next/image`）、`favicon.ico` 和 `fonts/` 目录下的所有文件。其余所有路径均经过中间件处理。\n\n---\n\n## 与代码库的连接\n\n```\nmiddleware (src/middleware.ts)\n  └── resolveRouteAuth (src/lib/auth-routes.ts)   ← 路由→权限映射表\n  └── /api/auth/me (API 路由)                      ← 用户会话验证\n```\n\n- **`src/lib/auth-routes.ts`**：维护路径模式到 `access` 级别的映射。新增受保护路由时，需在此文件中注册。\n- **`/api/auth/me`**：实际的会话验证逻辑（解析 cookie、查询用户）。中间件不直接操作数据库，而是委托给该 API。\n- **测试**：`tests/auth-users.test.ts` 中的 `main` 函数直接调用 `middleware` 进行集成测试。\n\n---\n\n## 注意事项\n\n- 中间件运行在 Edge Runtime（Next.js 默认），不能直接访问 Node.js 特有 API（如 `fs`、`crypto` 的部分方法）。\n- `fetch` 调用 `/api/auth/me` 是中间件中唯一的 I/O 操作，性能敏感场景下可考虑缓存策略（当前为 `no-store`，每次请求都验证）。\n- `deny` 级别返回 404 而非 403，目的是不暴露路由的存在性。","src-types":"# src — types\n\n\n\n# src/types — 类型定义模块\n\n## 模块概述\n\n`src/types/index.ts` 是前端应用的**领域模型类型定义层**，集中声明了所有与后端 API 交互的 TypeScript 接口。该模块不包含任何运行时逻辑，纯粹作为类型契约，供组件、状态管理和 API 层引用。\n\n所有类型均为 `interface`（非 `type`），支持声明合并（declaration merging），便于后续扩展。\n\n---\n\n## 类型关系总览\n\n```mermaid\nclassDiagram\n    class Agent {\n        +id: string\n        +name: string\n        +type: string\n        +status: online|offline|busy|error\n        +capabilities: string[]\n        +lastHeartbeat: string|null\n    }\n\n    class Gateway {\n        +id: string\n        +name: string\n        +status: online|offline|maintenance\n        +agentCount: number\n        +agents: GatewayAgentSummary[]\n    }\n\n    class GatewayAgentSummary {\n        +id: string\n        +name: string\n        +status: online|offline|busy|error\n    }\n\n    class GatewayResources {\n        +cpu: number\n        +memory: number\n        +disk: number\n    }\n\n    class Task {\n        +id: string\n        +status: pending|running|completed|failed\n        +assignedAgents: Agent[]\n    }\n\n    class LiveRoomSummary {\n        +id: string\n        +title: string\n        +mode: string\n        +memberCount: number\n    }\n\n    class LiveRoomDetail {\n        +members: LiveRoomMember[]\n        +pendingReplies: array\n    }\n\n    class LiveRoomMember {\n        +id: string\n        +role: string\n        +contextWatermark: object|null\n    }\n\n    class LiveRoomMessage {\n        +id: string\n        +content: string\n        +senderType: string\n    }\n\n    class WorkspaceSummary {\n        +workspaceStatus: idle|running|waiting_for_you|failed|archived\n        +attentionState: quiet|new_updates|waiting_for_you|failed\n        +unreadCount: number\n    }\n\n    class WorkspaceDetail {\n        +pendingActionCount: number\n    }\n\n    class WorkspaceChannel {\n        +kind: web_room|feishu_chat\n        +status: connected|disconnected\n    }\n\n    Gateway *-- GatewayAgentSummary\n    Gateway *-- GatewayResources\n    Task *-- Agent\n    LiveRoomDetail --|> LiveRoomSummary\n    LiveRoomDetail *-- LiveRoomMember\n    WorkspaceSummary --|> LiveRoomSummary\n    WorkspaceDetail --|> LiveRoomDetail\n    WorkspaceDetail *-- WorkspaceChannel\n```\n\n---\n\n## 核心实体\n\n### `Agent`\n\n智能体的完整表示，是系统中所有\"可执行工作单元\"的基础模型。\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| `id` | `string` | 唯一标识 |\n| `name` | `string` | 显示名称 |\n| `runtimeAgentId` | `string?` | 运行时层面对应的 ID（与平台 ID 解耦） |\n| `type` | `string` | 智能体类型标识 |\n| `location` | `string?` | 部署位置描述 |\n| `capabilities` | `string[]` | 能力标签列表 |\n| `status` | `'online' \\| 'offline' \\| 'busy' \\| 'error'` | 当前状态 |\n| `lastHeartbeat` | `string \\| null` | 最近心跳时间（ISO 格式）；`null` 表示从未心跳 |\n| `gatewayId` | `string?` | 所属网关 ID |\n| `createdAt` / `updatedAt` | `string` | 时间戳 |\n\n**设计要点：**\n- `lastHeartbeat` 使用 `string | null` 而非 `string | undefined`，明确区分\"从未心跳\"（`null`）和\"字段未返回\"（`undefined`）。\n- `runtimeAgentId` 与 `id` 分离，支持同一平台智能体在不同运行时中有不同标识。\n\n### `Gateway`\n\n网关是智能体的**部署和连接层**，一个网关可托管多个智能体。\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| `id` | `string` | 唯一标识 |\n| `name` | `string` | 显示名称 |\n| `url` | `string?` | 网关 API 地址 |\n| `ip` | `string?` | 遗留字段（旧版使用 IP 直连） |\n| `status` | `'online' \\| 'offline' \\| 'maintenance'` | 网关状态 |\n| `resources` | `GatewayResources?` | 资源用量 |\n| `agentCount` | `number?` | 托管智能体数量 |\n| `hasToken` | `boolean?` | 是否已配置认证令牌 |\n| `hasOpenClawToken` | `boolean?` | 是否已配置 OpenClaw 令牌 |\n| `agents` | `GatewayAgentSummary[]?` | 智能体摘要列表 |\n| `createdAt` / `updatedAt` | `string` | 时间戳 |\n\n### `GatewayAgentSummary`\n\n网关视角下的智能体**精简表示**，仅包含列表展示所需的最小字段。与完整 `Agent` 的区别在于省略了 `capabilities`、`lastHeartbeat`、`location` 等详情字段。\n\n### `GatewayResources`\n\n网关资源用量快照：\n\n```typescript\ninterface GatewayResources {\n  cpu: number;    // CPU 使用率（百分比）\n  memory: number; // 内存使用率（百分比）\n  disk: number;   // 磁盘使用率（百分比）\n}\n```\n\n### `Task`\n\n任务模型，将工作分配给一个或多个智能体。\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| `id` | `string` | 唯一标识 |\n| `name` | `string` | 任务名称 |\n| `description` | `string?` | 任务描述 |\n| `status` | `'pending' \\| 'running' \\| 'completed' \\| 'failed'` | 任务状态 |\n| `assignedAgents` | `Agent[]` | 被分配的智能体（完整对象） |\n| `result` | `Record<string, unknown>?` | 执行结果（结构不固定） |\n| `error` | `string?` | 失败时的错误信息 |\n| `startedAt` / `completedAt` | `string?` | 执行时间 |\n| `createdAt` / `updatedAt` | `string` | 时间戳 |\n\n**注意：** `assignedAgents` 内嵌完整 `Agent` 对象而非 ID 引用，意味着任务详情接口会返回智能体的完整数据，前端无需额外请求。\n\n---\n\n## 实时房间（Live Room）体系\n\n实时房间是系统的**多智能体协作对话空间**，支持多成员、多话题、多消息类型的实时交互。\n\n### `LiveRoomSummary`\n\n房间的**列表级摘要**，用于房间列表页展示。\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| `id` | `string` | 房间 ID |\n| `title` | `string` | 房间标题 |\n| `description` | `string?` | 描述 |\n| `currentTopic` | `string?` | 当前讨论话题 |\n| `mode` | `string` | 房间模式 |\n| `status` | `string` | 房间状态 |\n| `createdBy` | `string` | 创建者 |\n| `currentSpeakerMemberId` | `string?` | 当前发言者 ID |\n| `currentSpeakerName` | `string?` | 当前发言者名称 |\n| `memberCount` | `number` | 成员数量 |\n| `lastMessagePreview` | `string?` | 最后一条消息预览 |\n| `lastMessageAt` | `string?` | 最后消息时间 |\n\n### `LiveRoomDetail`\n\n继承自 `LiveRoomSummary`，增加**房间内部详情**：\n\n| 新增字段 | 类型 | 说明 |\n|----------|------|------|\n| `sourceTask` | `{ id, name } \\| null` | 关联的源任务（房间可能由任务创建） |\n| `pendingReplyCount` | `number?` | 待回复总数 |\n| `pendingReplyTargetNames` | `string[]?` | 待回复目标名称列表 |\n| `pendingReplies` | `PendingReply[]?` | 待回复详情数组 |\n| `members` | `LiveRoomMember[]` | 完整成员列表 |\n\n#### `pendingReplies` 元素结构\n\n每个待回复项包含：\n\n| 字段 | 说明 |\n|------|------|\n| `memberId` / `displayName` | 目标成员 |\n| `pendingCount` / `queuedCount` / `runningCount` | 各状态数量 |\n| `oldestPendingAt` / `newestPendingAt` | 时间范围 |\n| `newestPendingAgeSeconds` | 最新待回复的等待秒数 |\n| `lastProgressAt` / `lastProgressAgeSeconds` | 最近进度 |\n| `progressLabel` | 进度描述文本 |\n| `activeDeliveryId` | 当前活跃投递 ID |\n| `backend` / `harnessType` | 后端和框架类型 |\n| `interruptSupported` | 是否支持中断 |\n| `status` | `'queued' \\| 'running' \\| 'stalled'` |\n\n### `LiveRoomMember`\n\n房间成员，是系统中**字段最丰富的类型**，承载了成员身份、角色、权限、上下文水位等多维度信息。\n\n**核心字段：**\n\n| 字段 | 说明 |\n|------|------|\n| `id` / `roomId` | 成员 ID 和所属房间 |\n| `memberType` | 成员类型（如 `agent`、`human`） |\n| `displayName` | 显示名称 |\n| `role` | 角色标识 |\n| `roleLabel` | 角色显示标签 |\n| `specialty` | 专长领域 |\n| `joinStatus` / `presenceStatus` | 加入状态 / 在线状态 |\n| `canReply` | 是否可回复 |\n| `sortOrder` | 排序权重 |\n| `gatewayId` / `gatewayName` | 所属网关 |\n| `agentRecordId` | 关联的智能体记录 ID |\n| `permissionProfile` / `permissionLabel` | 权限配置 |\n| `codexModel` / `codexReasoningEffort` | 模型和推理强度配置 |\n\n#### `contextWatermark`\n\n上下文水位是**智能体上下文窗口使用情况的实时快照**，用于前端展示\"上下文快满了\"等警告。\n\n```typescript\ninterface ContextWatermark {\n  source: 'provider' | 'unknown' | 'not_applicable';\n  usagePercentage: number | null;\n  usageStatus: 'light' | 'elevated' | 'high' | 'unknown' | 'not_applicable';\n  policyStatus: 'normal' | 'warning' | 'critical';\n  policyLabel: string;\n  dominantReason: 'provider' | 'messages' | 'events' | 'transcript';\n  dominantLabel: string;\n  usedTokens?: number;\n  contextWindow?: number | null;\n  recommendedAction: string;\n  messageCount: number;\n  eventCount: number;\n  transcriptChars: number;\n  remainingMessages: number;\n  remainingEvents: number;\n  remainingTranscriptChars: number;\n}\n```\n\n**设计要点：**\n- `usageStatus` 和 `policyStatus` 分离：前者反映实际使用率，后者反映策略判定（可能因配置阈值不同而不同）。\n- `dominantReason` 标识上下文消耗的主要来源（provider 返回、消息、事件、转录），帮助开发者定位问题。\n- `remaining*` 字段提供\"还能用多少\"的直观信息。\n\n### `LiveRoomMessage`\n\n房间消息：\n\n| 字段 | 说明 |\n|------|------|\n| `id` / `roomId` | 消息 ID 和所属房间 |\n| `senderMemberId` / `senderName` / `senderLabel` | 发送者信息 |\n| `senderType` | 发送者类型 |\n| `content` | 消息内容 |\n| `messageType` | 消息类型 |\n| `visibility` | 可见性 |\n| `topicSnapshot` | 发送时的话题快照 |\n| `replyToMessageId` | 回复目标消息 ID |\n| `metadata` | 扩展元数据 |\n\n### `LiveRoomCatalogAgent`\n\n房间目录中的智能体条目，用于**房间创建/配置时选择智能体**的场景。与 `Agent` 的区别在于它携带了 `gatewayId`、`gatewayName`、`backend`、`harnessType` 等部署上下文信息。\n\n| 字段 | 说明 |\n|------|------|\n| `id` | 智能体 ID |\n| `agentRecordId` | 关联记录 ID |\n| `gatewayId` / `gatewayName` | 所属网关 |\n| `backend` | `'platform_local' \\| 'gateway_openclaw' \\| 'remote_ssh'` |\n| `harnessType` | 框架类型 |\n| `label` | 显示标签 |\n| `agentName` | 智能体名称 |\n| `runtimeAgentId` | 运行时 ID |\n| `status` | 状态 |\n\n---\n\n## 工作区（Workspace）体系\n\n工作区是**房间的上层抽象**，一个工作区可以关联多个频道（房间或外部聊天），并维护独立的生命周期状态。\n\n### `WorkspaceChannel`\n\n工作区关联的频道：\n\n| 字段 | 说明 |\n|------|------|\n| `id` | 频道 ID |\n| `workspaceId` | 所属工作区 |\n| `kind` | `'web_room' \\| 'feishu_chat'` — 内部房间或飞书群 |\n| `label` | 显示名称 |\n| `externalId` | 外部系统 ID（飞书场景） |\n| `status` | `'connected' \\| 'disconnected'` |\n\n### `WorkspaceSummary`\n\n继承自 `LiveRoomSummary`，增加工作区级别的状态：\n\n| 新增字段 | 类型 | 说明 |\n|----------|------|------|\n| `workspaceStatus` | `'idle' \\| 'running' \\| 'waiting_for_you' \\| 'failed' \\| 'archived'` | 工作区状态 |\n| `attentionState` | `'quiet' \\| 'new_updates' \\| 'waiting_for_you' \\| 'failed'` | 注意力状态（驱动 UI 角标/提醒） |\n| `unreadCount` | `number` | 未读数量 |\n| `lastActivityAt` | `string` | 最后活跃时间 |\n| `lifecycleStatus` | `'active' \\| 'archived'` | 生命周期状态 |\n| `linkedChannels` | `WorkspaceChannel[]` | 关联频道列表 |\n\n**`workspaceStatus` vs `attentionState` 的区别：**\n- `workspaceStatus` 描述工作区**正在做什么**（运行中、等待你、失败等）。\n- `attentionState` 描述**用户需要关注什么**（安静、有新更新、需要你操作、出错了）。\n\n### `WorkspaceDetail`\n\n继承自 `LiveRoomDetail`，增加：\n\n| 新增字段 | 说明 |\n|----------|------|\n| `workspaceStatus` | 同 `WorkspaceSummary` |\n| `attentionState` | 同 `WorkspaceSummary` |\n| `unreadCount` | 未读数量 |\n| `lastActivityAt` | 最后活跃时间 |\n| `lifecycleStatus` | 生命周期状态 |\n| `linkedChannels` | 关联频道 |\n| `pendingActionCount` | 待处理操作数量 |\n\n---\n\n## 仪表盘\n\n### `DashboardStats`\n\n仪表盘顶部统计卡片的数据源：\n\n```typescript\ninterface DashboardStats {\n  totalAgents: number;\n  onlineAgents: number;\n  busyAgents: number;\n  offlineAgents: number;\n}\n```\n\n注意：没有 `errorAgents` 字段，`error` 状态的智能体可能归入 `offlineAgents` 或单独处理。\n\n---\n\n## 设计约定\n\n### 状态枚举\n\n| 实体 | 状态值 |\n|------|--------|\n| `Agent` | `online` / `offline` / `busy` / `error` |\n| `Gateway` | `online` / `offline` / `maintenance` |\n| `Task` | `pending` / `running` / `completed` / `failed` |\n| `Workspace` | `idle` / `running` / `waiting_for_you` / `failed` / `archived` |\n| `WorkspaceChannel` | `connected` / `disconnected` |\n\n### 时间戳\n\n所有时间字段使用 **ISO 8601 字符串**（`string` 类型），而非 `Date` 对象。前端在需要时自行解析。\n\n### 可选字段策略\n\n- 使用 `?` 表示\"API 可能不返回该字段\"。\n- 使用 `| null` 表示\"API 会返回该字段，但值可能为 null\"（如 `lastHeartbeat`、`contextWatermark`）。\n- 两者语义不同：`undefined` 意味着\"不知道\"，`null` 意味着\"明确为空\"。\n\n### 继承关系\n\n- `WorkspaceSummary extends LiveRoomSummary` — 工作区摘要复用房间摘要的基础字段。\n- `WorkspaceDetail extends LiveRoomDetail` — 工作区详情复用房间详情的成员和待回复信息。\n\n这意味着工作区在数据层面**就是一个房间**，只是额外包装了生命周期和频道管理。\n\n### 命名约定\n\n- 接口名使用 PascalCase。\n- 字段名使用 camelCase。\n- 枚举值使用 snake_case（如 `waiting_for_you`、`not_applicable`）。\n- 带 `Snapshot` 后缀的字段表示\"发送/创建时的快照\"，不随源数据变化。\n- 带 `Label` 后缀的字段是面向用户的显示文本，与对应的标识字段（如 `role` / `roleLabel`）配对。","src":"# src\n\n\n\n# src\n\n## 模块定位\n\n`src` 是 Agent Platform 的 Next.js 应用源码根目录，按职责分为五个子模块，形成从请求入口到 UI 渲染的完整链路。\n\n| 子模块 | 层级 | 核心职责 |\n|--------|------|----------|\n| [src/src](src-src.md) | 入口层 | 全局中间件（认证/授权拦截）、instrumentation 钩子 |\n| [src/app](src-app.md) | 应用层 | 页面组件 + API 路由，是前后端交汇点 |\n| [src/lib](src-lib.md) | 业务逻辑层 | ACPX 执行引擎、飞书集成、认证、加密、定时任务等 |\n| [src/components](src-components.md) | UI 组件层 | 按功能域划分的可复用 React 组件 |\n| [src/types](src-types.md) | 类型契约层 | 所有领域模型的 TypeScript 接口定义 |\n\n## 协作关系\n\n```mermaid\ngraph TB\n    subgraph 请求入口\n        MW[\"middleware.ts<br/>认证 / 授权拦截\"]\n    end\n\n    subgraph 应用层\n        API[\"API 路由<br/>(api/*/route.ts)\"]\n        Pages[\"页面组件<br/>(page.tsx)\"]\n    end\n\n    subgraph 业务逻辑层\n        ACXP[\"ACPX 执行引擎\"]\n        Feishu[\"飞书集成\"]\n        Auth[\"认证 / 加密\"]\n        LiveRoom[\"Live Room 管理\"]\n        Scheduled[\"定时任务\"]\n    end\n\n    subgraph UI 层\n        Common[\"common/\"]\n        Dashboard[\"dashboard/\"]\n        Chat[\"chat/\"]\n        LiveRoomUI[\"live-room/\"]\n        Tasks[\"tasks/\"]\n    end\n\n    Types[\"types/index.ts<br/>领域模型契约\"]\n\n    MW --> API\n    MW --> Pages\n    API --> ACXP\n    API --> Feishu\n    API --> Auth\n    API --> LiveRoom\n    API --> Scheduled\n    Pages --> Common\n    Pages --> Dashboard\n    Pages --> Chat\n    Pages --> LiveRoomUI\n    Pages --> Tasks\n    ACXP --> Types\n    Feishu --> Types\n    LiveRoom --> Types\n    Common --> Types\n    Dashboard --> Types\n    Chat --> Types\n    LiveRoomUI --> Types\n    Tasks --> Types\n```\n\n## 关键跨模块工作流\n\n### 1. 任务执行流\n\n用户通过 Dashboard 或飞书发起任务 → API 路由接收请求 → `lib/acpx` 执行引擎根据 profile 选择后端（本地进程 / OpenClaw 网关 / 远程 SSH）→ harness adapter 启动 AI 会话 → 通过 WebSocket 事件总线实时推送状态 → 前端 `tasks/` 组件更新 UI。\n\n### 2. 飞书集成流\n\n飞书消息到达 → `lib/feishu.ts` 解析命令 → 根据命令类型分发到 `feishu-task-commands`、`feishu-live-room-commands`、`feishu-room-controls` 等子模块 → 操作 Live Room 成员权限、触发 ACPX 执行、或发送审批卡片 → 结果通过 `feishu-api.ts` 回传飞书。\n\n### 3. 认证与授权流\n\n所有请求先经过 `middleware.ts` 的路径匹配和 surface 判断 → API 路由内部调用 `lib/auth-users.ts` 的 `requireCurrentUser` / `requireAdmin` → 验证 session token（`lib/auth.ts` 中的 `verifySessionToken`）→ 未通过时返回 401/403 或重定向到登录页。\n\n### 4. Live Room 协作流\n\n`live-room/` 组件渲染多 Agent 讨论界面 → 用户发送消息 → API 路由调用 `lib/live-room-delivery-execution.ts` → 通过 ACPX 执行引擎分发到各 Agent → 执行结果经 `live-room-process-registry.ts` 追踪 → 可选地通过 `feishu-live-room-relay.ts` 同步到飞书群。\n\n## 设计原则\n\n- **类型先行**：`types/` 作为唯一契约源，所有模块共享同一套接口定义，避免前后端类型漂移\n- **中间件前置**：认证逻辑在 `middleware.ts` 做粗粒度拦截，细粒度权限在 API 路由内通过 `lib/auth-users.ts` 完成\n- **执行引擎解耦**：ACPX 通过 adapter 模式隔离不同 AI 后端，新增 harness 只需实现 adapter 接口，不影响上层路由和 UI","tests-e2e":"# tests — e2e\n\n\n\n# tests/e2e — E2E 测试模块\n\n## 概述\n\n本模块基于 **Playwright** 框架，为 Agent Platform v2 提供端到端测试覆盖。测试分为两大类：\n\n- **API 测试**：通过 `request` fixture 直接调用 HTTP 端点，验证响应结构和业务逻辑\n- **UI 测试**：通过 `page` fixture 操作浏览器，验证页面渲染和交互行为\n\n测试目标应用运行在 `http://localhost:3000`（主应用）和 `http://localhost:3010`（Workspace 应用）。\n\n---\n\n## 文件结构\n\n```\ntests/e2e/\n├── api.spec.ts                  # 核心 API 端点测试\n├── chat.spec.ts                 # Chat 页面 UI 测试\n├── dashboard.spec.ts            # Dashboard 页面 UI 测试\n├── control-plane.spec.ts        # Control Plane 集成测试\n├── gateway-health-api.spec.ts   # Gateway 健康检查 API 测试\n├── gateway-monitor.spec.ts      # Gateway 监控面板 UI 测试\n├── workspace-checklist.spec.ts  # Workspace 完整功能检查\n├── workspace-smoke.spec.ts      # Workspace 冒烟测试\n├── FEATURE_1_SUMMARY.md         # Control Plane 测试总结\n├── FEATURE_2_SUMMARY.md         # Linux Gateway 通信测试总结\n└── FEATURE_12_SUMMARY.md        # E2E 框架搭建总结\n```\n\n---\n\n## 测试文件详解\n\n### `api.spec.ts` — 核心 API 端点\n\n测试 `http://localhost:3000/api` 下的基础 REST 端点。\n\n| 测试用例 | 方法 | 端点 | 验证内容 |\n|---------|------|------|---------|\n| Agent 列表 | GET | `/api/agents` | 返回数组，每项含 `id`、`name`、`status`、`type` |\n| Gateway 列表 | GET | `/api/gateways` | 返回数组，每项含 `id`、`name`、`url` |\n| 聊天房间 | GET | `/api/chat/rooms` | 返回数组 |\n| 创建消息 | POST | `/api/chat/messages` | 返回含 `id` 和 `content` 的对象 |\n| 单个 Agent | GET | `/api/agents/[id]` | 返回匹配 ID 的 Agent |\n| 更新 Agent | PUT | `/api/agents/[id]` | 更新 `status` 字段 |\n\n**关键模式**：`GET /api/agents/[id]` 和 `PUT /api/agents/[id]` 测试采用\"先查列表获取有效 ID，再操作单个资源\"的两步策略，避免硬编码 ID。\n\n---\n\n### `control-plane.spec.ts` — Control Plane 集成测试\n\n验证 Control Plane 三大核心组件的 API 行为：\n\n```\n┌─────────────────────────────────────────────────────┐\n│  Control Plane                                       │\n│                                                      │\n│  ┌──────────────┐  ┌────────────────┐  ┌─────────┐ │\n│  │ GatewayClient │  │ GatewayManager │  │ Feishu  │ │\n│  │              │  │                │  │ Command │ │\n│  │ 单 Gateway   │  │ 多 Gateway     │  │ Router  │ │\n│  │ 连接/通信    │  │ 编排/监控      │  │ 命令解析 │ │\n│  └──────────────┘  └────────────────┘  └─────────┘ │\n└─────────────────────────────────────────────────────┘\n```\n\n**GatewayClient 测试**（3 个用例）：\n- 类型定义验证：确认 Gateway 对象包含 `id`、`name`、`url`、`status` 字段\n- 健康检查模拟：验证响应延迟 < 5000ms\n- Token 认证验证：无效 Bearer Token 应返回 200 或 401\n\n**GatewayManager 测试**（3 个用例）：\n- 多 Gateway 列表：至少返回 1 个 Gateway\n- 状态监控：每个 Gateway 的 `status` 必须是 `online`/`offline`/`maintenance`/`unhealthy` 之一\n- Agent 关联：每个 Agent 必须包含 `gatewayId` 字段\n\n**FeishuCommandRouter 测试**（3 个用例）：\n- 命令解析：POST `/api/chat/messages` 发送 `/status` 命令\n- 广播命令：GET `/api/chat/rooms` 验证可获取多个房间\n- 帮助命令：POST `/api/chat/messages` 发送 `/help` 命令\n\n**集成场景**（3 个用例）：\n- 完整流程：获取 Gateways → Agents → Rooms → 发送任务消息\n- 无效 Gateway：GET 不存在的 Gateway ID，应返回 200 或 404\n- 离线 Gateway：向离线 Agent 发送消息不应导致系统崩溃\n\n---\n\n### `gateway-health-api.spec.ts` — Gateway 健康检查 API\n\n测试 `GET /api/gateways/[id]/health` 端点的完整响应结构。\n\n**期望响应格式**：\n\n```typescript\n{\n  success: boolean,\n  latencyMs: number,        // 0 ≤ latencyMs < 10000\n  statusCode: number,       // HTTP 状态码\n  lastChecked: string,      // ISO 8601 时间戳\n  gatewayInfo: {\n    id: string,\n    name: string,\n    url: string,\n    status: 'online' | 'offline' | 'maintenance' | 'unhealthy' | 'unknown'\n  },\n  agents: Array<{\n    id: string,\n    name: string,\n    status: 'online' | 'offline' | 'busy'\n  }>,\n  resources?: object        // 可选\n}\n```\n\n**测试覆盖**（10 个用例）：\n\n| 类别 | 用例 |\n|------|------|\n| 数据结构 | 必需字段存在且类型正确 |\n| Gateway 信息 | `gatewayInfo` 包含完整字段 |\n| Agents 信息 | `agents` 数组结构正确 |\n| 延迟信息 | 多次请求延迟均在合理范围 |\n| 错误处理 | 不存在的 Gateway 返回 404 + `success: false` |\n| 状态更新 | 健康检查后 Gateway 状态已更新 |\n| 时间戳 | `lastChecked` 在 1 分钟内 |\n| 响应时间 | API 响应 < 6000ms |\n| 边界情况 | 空 ID 返回 400/404 |\n| 安全 | 特殊字符 ID 不导致 500 |\n\n**关键设计**：当无可用 Gateway 时，测试使用 `test.skip()` 优雅跳过而非失败。\n\n---\n\n### `gateway-monitor.spec.ts` — Gateway 监控面板 UI\n\n测试 Dashboard 页面上 Gateway 监控组件的渲染和交互。\n\n**测试分组**：\n\n| 分组 | 验证内容 |\n|------|---------|\n| Component Rendering | 面板渲染、状态统计、刷新时间、手动刷新按钮、自动刷新说明 |\n| Status Indicators | Gateway 卡片、状态颜色（绿/红/黄）、延迟显示（`XXXms`）、状态码、最后检查时间 |\n| Interactive Features | 手动刷新按钮功能、卡片展开详情、统计数字正确性 |\n| Auto Refresh | 30 秒自动刷新间隔验证（等待 35 秒） |\n| Error Handling | 空状态和 API 错误（当前 `test.skip()`） |\n\n**选择器策略**：\n- 文本匹配：`page.getByText(/Gateway 监控/i)`\n- 属性选择器：`page.locator('button[title=\"手动刷新\"]')`\n- 类名模糊匹配：`page.locator('[class*=\"bg-green\"], [class*=\"bg-red\"]')`\n\n---\n\n### `dashboard.spec.ts` — Dashboard 页面\n\n测试主 Dashboard 页面的基本渲染和导航。\n\n| 测试用例 | 验证内容 |\n|---------|---------|\n| 标题显示 | 页面标题匹配 `/Agent Platform/`，heading 匹配 `/dashboard/i` |\n| 统计面板 | 显示 \"total agents\"、\"online\"、\"busy\"、\"offline\" 文本 |\n| Agent 网格 | 存在 Agent 卡片元素 |\n| 状态颜色 | 存在绿色/黄色/灰色状态指示器 |\n| 导航到 Chat | 点击 Chat 链接后 URL 变为 `/chat/` |\n| 导航到 Tasks | 点击 Tasks 链接后 URL 变为 `/tasks/` |\n\n---\n\n### `chat.spec.ts` — Chat 页面\n\n测试 Chat 页面的交互功能。\n\n| 测试用例 | 验证内容 |\n|---------|---------|\n| 页面显示 | 标题和 heading 可见 |\n| 输入框 | `textbox` 角色，名称匹配 `/message/i` |\n| 发送按钮 | `button` 角色，名称匹配 `/send/i` |\n| 消息列表 | 存在消息容器元素 |\n| @提及自动补全 | 输入 `@` 后出现下拉列表 |\n| 发送消息 | 输入文本 → 点击发送 → 消息出现在列表中 |\n| @提及 Agent | 输入 `@Agent` → 选择
