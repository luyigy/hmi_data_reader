var PAGES = {"config":"# config\n\n\n\n# Config 模块\n\n## 概述\n\n`config` 模块是系统的**声明式配置层**，以 YAML 和 JSON 文件定义所有项目的注册信息、飞书集成参数、定时任务编排以及运行时环境。该模块不包含任何可执行代码，所有配置在系统启动时被加载并驱动任务调度器。\n\n## 文件结构\n\n```\nconfig/\n├── projects.yaml          # 项目注册表 + 任务编排\n└── runtime-environments.json  # 运行时环境路径映射\n```\n\n## projects.yaml\n\n### 顶层结构\n\n```yaml\nprojects:\n  - id: <string>\n    name: <string>\n    path: <string>\n    ref: <string>\n    feishu:\n      chat_id: <string>\n      approver_open_ids:\n        - <string>\n    jobs:\n      - id: <string>\n        type: <string>\n        schedule: <cron>\n        enabled: <bool>\n        mode: <string>\n        config: <object>\n```\n\n### 项目字段\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| `id` | string | 项目唯一标识，用于内部引用 |\n| `name` | string | 项目显示名称 |\n| `path` | string | 项目代码在服务器上的绝对路径 |\n| `ref` | string | Git 分支引用（如 `refs/heads/main`） |\n| `feishu.chat_id` | string | 飞书群/会话 ID，用于通知和交互 |\n| `feishu.approver_open_ids` | string[] | 审批人的飞书 open_id 列表 |\n\n### 任务（Job）字段\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| `id` | string | 任务唯一标识（项目内唯一） |\n| `type` | string | 任务类型，决定执行逻辑 |\n| `schedule` | string | Cron 表达式，定义执行频率 |\n| `enabled` | bool | 是否启用该任务 |\n| `mode` | string | 运行模式：`active` 或 `shadow` |\n| `config` | object | 任务特定配置，结构因 `type` 而异 |\n\n### 任务类型\n\n#### `workflow_watcher`\n\n核心任务类型，负责监控项目工作流状态并驱动自动化流程。\n\n**config 字段：**\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| `active_side_effects_enabled` | bool | 是否允许产生实际副作用（如推送代码、发送消息） |\n| `coding_bot_chat_id` | string | 编码机器人所在的飞书会话 ID |\n| `coding_bot_chat_type` | string | 会话类型：`p2p`（单聊）或 `group`（群聊） |\n| `coding_bot_app_id` | string | 编码机器人的飞书应用 ID |\n| `contract_path` | string | 工作流契约文件相对于项目根目录的路径 |\n| `branch_space` | string | 分支空间标识，`.` 表示当前分支，其他值为具体分支名 |\n| `initial_cursor_commit` | string | 初始游标 commit，用于确定监控起点 |\n| `workflow_autonomy` | string | 自治级别，当前支持 `semi_auto` |\n| `execution_policy.preset` | string | 执行策略预设：`workspace` 或 `full_access` |\n\n**执行策略预设：**\n\n| 预设 | 说明 |\n|------|------|\n| `workspace` | 受限模式，操作范围限定在工作区内 |\n| `full_access` | 完全访问模式，允许更广泛的操作 |\n\n#### `long_file_detector`\n\n定期检测项目中的超长文件，用于代码质量监控。\n\n**config 字段：** 无（空对象 `{}`）\n\n#### `noop_test`\n\n空操作测试任务，用于验证调度器本身是否正常工作。\n\n**config 字段：**\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| `delay_ms` | int | 模拟延迟（毫秒） |\n| `timeout_ms` | int | 超时阈值（毫秒） |\n\n### 运行模式\n\n| 模式 | 说明 |\n|------|------|\n| `active` | 正常执行，产生实际效果 |\n| `shadow` | 影子模式，执行但不产生副作用，用于验证逻辑 |\n\n### 当前注册项目\n\n| 项目 ID | 名称 | 路径 | 分支 | 任务数 |\n|---------|------|------|------|--------|\n| `agent-platform-v2` | Agent Platform V2 | `/data1/code/agent-platform-v2` | `oss-prep` | 3 |\n| `mold-data-webpage-tool` | 科学试模助手 | `/data1/code/mold-data-webpage-tool` | `dev` | 2 |\n| `workflow-test` | Workflow Test | `/data1/code/workflow-test` | `workflow-test` | 1 |\n| `hmi-data-reader` | HMI Reader | `/data1/code/hmi_data_reader` | `master` | 1 |\n\n## runtime-environments.json\n\n定义项目路径到运行时环境（如 conda 环境路径）的映射，供任务执行时设置 `PATH` 或激活环境。\n\n```json\n{\n  \"/data1/code/molding-assist\": [\"/home/hello/anaconda3\"]\n}\n```\n\n**格式：** `{ \"<项目绝对路径>\": [\"<环境路径1>\", \"<环境路径2>\", ...] }`\n\n## 配置关系\n\n```mermaid\ngraph TD\n    A[projects.yaml] --> B[项目定义]\n    B --> C[飞书集成]\n    B --> D[任务列表]\n    D --> E[workflow_watcher]\n    D --> F[long_file_detector]\n    D --> G[noop_test]\n    E --> H[contract_path 指向项目内契约文件]\n    I[runtime-environments.json] --> J[运行时环境路径]\n    J --> D\n```\n\n## 使用约定\n\n1. **新增项目**：在 `projects.yaml` 的 `projects` 列表末尾追加条目，确保 `id` 全局唯一。\n2. **新增任务**：在对应项目的 `jobs` 列表中追加，`id` 在项目内唯一。\n3. **禁用任务**：将 `enabled` 设为 `false`，而非删除条目，便于后续恢复。\n4. **影子验证**：新任务上线前可先以 `mode: shadow` 运行，确认逻辑正确后切换为 `active`。\n5. **调度频率**：`workflow_watcher` 通常设为 `* * * * *`（每分钟），`long_file_detector` 设为 `*/10 * * * *`（每 10 分钟）。","deploy":"# deploy\n\n\n\n# Deploy 模块\n\n## 概述\n\n`deploy` 模块包含 Agent Platform 的 **systemd user-level service 定义**，用于在生产环境中以用户级 systemd 服务的方式运行平台各组件。所有服务共享以下特征：\n\n- 工作目录：`/data1/code/agent-platform-v2`\n- 自动重启策略：`Restart=always`，重启间隔 5 秒\n- 停止超时：20 秒\n- 进程组终止：`KillMode=control-group`（确保子进程一并清理）\n- 依赖网络就绪：`After=network-online.target`\n\n## 服务架构\n\n```mermaid\ngraph TD\n    subgraph \"systemd user services\"\n        DEV[\"agent-platform-dev<br/>Next.js Dev Server\"]\n        FEISHU[\"agent-platform-feishu<br/>Feishu Runtime\"]\n        GATEWAY[\"agent-platform-remote-runner-gateway<br/>Remote Runner Gateway\"]\n        JOBS[\"agent-platform-scheduled-jobs<br/>Scheduled Job Runner\"]\n    end\n\n    PG[(\"PostgreSQL\")]\n    NET[\"network-online.target\"]\n\n    NET --> DEV\n    NET --> FEISHU\n    NET --> GATEWAY\n    NET --> JOBS\n    PG --> GATEWAY\n    PG --> JOBS\n```\n\n## 服务清单\n\n### agent-platform-dev.service\n\n| 属性 | 值 |\n|------|-----|\n| 描述 | Agent Platform Next.js Dev Server |\n| 启动命令 | `scripts/run-agent-platform-dev.sh` |\n| 特殊依赖 | 无额外依赖 |\n\nNext.js 前端开发服务器。通过 shell 脚本启动，脚本内部处理环境变量加载和 `npm run dev` 等逻辑。\n\n### agent-platform-feishu.service\n\n| 属性 | 值 |\n|------|-----|\n| 描述 | Agent Platform Feishu Runtime |\n| 启动命令 | `scripts/run-feishu-runtime.sh` |\n| 环境变量 | `TOKIO_WORKER_THREADS=8` |\n\n飞书消息处理运行时。基于 Rust/Tokio 异步运行时，通过 `TOKIO_WORKER_THREADS=8` 显式设置 8 个工作线程以匹配服务器 CPU 核心数。\n\n### agent-platform-remote-runner-gateway.service\n\n| 属性 | 值 |\n|------|-----|\n| 描述 | Agent Platform Remote Runner Gateway |\n| 启动命令 | `/usr/bin/npm run remote-runner:gateway` |\n| 环境变量 | `REMOTE_RUNNER_GATEWAY_HOST=0.0.0.0` |\n| 特殊依赖 | `postgresql.service` |\n\n远程 Runner 网关服务，负责接收远程执行器的连接和任务分发。\n\n**关键配置说明：**\n\n- 绑定 `0.0.0.0`（所有网络接口），使远程 Runner 可以从外部网络访问该服务。\n- 默认监听端口 **3012**。\n- 安全性依赖 **node secrets** 进行身份认证，而非网络隔离。\n- 依赖 PostgreSQL 服务先于本服务启动（`After=postgresql.service`）。\n\n### agent-platform-scheduled-jobs.service\n\n| 属性 | 值 |\n|------|-----|\n| 描述 | Agent Platform Scheduled Job Runner |\n| 启动命令 | `scripts/run-scheduled-job-runner.sh` |\n| 特殊依赖 | `postgresql.service` |\n\n定时任务运行器，负责执行平台内定义的周期性任务（如数据清理、状态同步等）。同样依赖 PostgreSQL 先启动。\n\n## 通用配置说明\n\n### 重启策略\n\n所有服务均配置为：\n\n```ini\nRestart=always\nRestartSec=5\n```\n\n无论退出码如何，服务都会在 5 秒后自动重启。这意味着：\n\n- 进程崩溃 → 自动恢复\n- 手动 `systemctl --user stop` → **不会**自动重启（`always` 仅在非手动停止时生效）\n- 系统重启 → 服务随 `default.target` 自动启动\n\n### 进程终止\n\n```ini\nTimeoutStopSec=20\nKillMode=control-group\n```\n\n停止服务时，systemd 会向整个 cgroup 发送 `SIGTERM`，等待最多 20 秒后发送 `SIGKILL`。`KillMode=control-group` 确保由主进程派生的所有子进程（如 Node.js 子进程、数据库连接池等）都被清理。\n\n### 安装方式\n\n所有服务均配置为：\n\n```ini\nWantedBy=default.target\n```\n\n这意味着通过 `systemctl --user enable <service>` 启用后，用户登录时服务会自动启动。\n\n## 部署与运维\n\n### 启用服务\n\n```bash\n# 启用所有服务\nsystemctl --user enable agent-platform-dev.service\nsystemctl --user enable agent-platform-feishu.service\nsystemctl --user enable agent-platform-remote-runner-gateway.service\nsystemctl --user enable agent-platform-scheduled-jobs.service\n\n# 启动所有服务\nsystemctl --user start agent-platform-dev.service\nsystemctl --user start agent-platform-feishu.service\nsystemctl --user start agent-platform-remote-runner-gateway.service\nsystemctl --user start agent-platform-scheduled-jobs.service\n```\n\n### 查看状态\n\n```bash\nsystemctl --user status agent-platform-feishu.service\njournalctl --user -u agent-platform-feishu.service -f\n```\n\n### 注意事项\n\n1. **用户级服务**：这些是 `--user` 级别的服务，需要用户会话活跃。如果用户注销，服务会停止。生产环境通常配合 `loginctl enable-linger <user>` 使用，使服务在用户未登录时继续运行。\n\n2. **PostgreSQL 依赖**：`remote-runner-gateway` 和 `scheduled-jobs` 依赖系统级 `postgresql.service`（非用户级），确保 PostgreSQL 以系统服务方式运行。\n\n3. **网络暴露**：`remote-runner-gateway` 绑定 `0.0.0.0:3012`，部署时需确保防火墙规则仅允许受信任的 Runner 节点访问该端口。","docs-architecture":"# docs — architecture\n\n\n\n# docs — architecture\n\n## 模块概述\n\n`docs/architecture/` 目录存放 Agent Platform V2 的架构设计文档。当前核心文档为 `agent-platform-v2_unified-agent-architecture_handover.md`，它是一份面向后续开发（包括 coding agent）的架构交接文档，定义了统一 Agent Runtime、消息流和配置体系的重构方向。\n\n**文档定位：** 架构方向指引，非一次性重写方案。优先渐进迁移，保留当前可工作的 Codex 路径。\n\n---\n\n## 核心问题\n\n平台支持多个 coding agent（Codex、Claude Code、Pi Agent、Kimi Code、Antigravity 等），当前架构的根本问题是：\n\n> `stdout chunk` 被当成了 `Agent semantic message`。\n\n不同 Agent 的 stdout 含义完全不同：\n\n| Agent | stdout 特征 |\n|-------|------------|\n| Codex | 相对稳定的 semantic event |\n| Antigravity | text_delta 碎片 |\n| Pi Agent | 某些事件是累计 snapshot |\n| Kimi | 多种 stream-json / Anthropic delta 兼容格式 |\n| 普通 CLI | 可能只是 console output |\n\n这导致：\n- delta 被截断\n- snapshot 被重复\n- 不同 Agent 体验完全不一致\n- throttle 直接造成信息丢失\n- Presentation 层出现大量 `if (harnessType === 'codex')` 特判\n\n---\n\n## 五层架构\n\n```mermaid\ngraph TD\n    A[\"Agents / Harnesses<br/>Codex | Claude | Pi | Kimi | Antigravity\"] --> B\n    B[\"1. Runtime / Transport<br/>process / PTY / SSH / Herdr\"] --> C\n    C[\"2. Agent Adapter<br/>CodexAdapter / PiAdapter / ...\"] --> D\n    D[\"3. Unified Agent Event Stream<br/>assistant.delta / tool.started / ...\"] --> E\n    D --> F[\"Event Store\"]\n    E --> G[\"State Projector\"]\n    G --> H[\"4. Presentation State\"]\n    H --> I[\"5a. Web Chat / Room\"]\n    H --> J[\"5b. Feishu Card Renderer\"]\n```\n\n### 各层职责\n\n| 层 | 职责 | 关键约束 |\n|----|------|----------|\n| 1. Runtime / Transport | 进程管理、PTY、SSH、输入输出 | 与 Agent 类型解耦 |\n| 2. Agent Adapter | 将 raw runtime event 翻译为 `AgentRunEvent` | 唯一允许 Agent-specific 逻辑的层 |\n| 3. Unified Event Stream | 统一事件契约，100% ingest | 不做 throttle，不丢弃 |\n| 4. Presentation State | 投影为 UI 可消费的状态 | 不感知 Harness 类型 |\n| 5. Renderer | Web / 飞书各自渲染 | 只做展示层 throttle |\n\n**核心原则：限流的是 Renderer，不是 Event Stream。**\n\n---\n\n## 统一事件契约 `AgentRunEvent`\n\n```ts\ntype AgentRunEvent =\n  | AgentStartedEvent\n  | AgentStatusEvent\n  | AssistantDeltaEvent\n  | AssistantSnapshotEvent\n  | AssistantCompletedEvent\n  | ToolStartedEvent\n  | ToolProgressEvent\n  | ToolCompletedEvent\n  | SubagentStartedEvent\n  | SubagentCompletedEvent\n  | InteractionRequestEvent\n  | ErrorEvent\n  | RawRuntimeEvent;\n```\n\n### Assistant 事件三态\n\n| 事件 | 语义 | Assembler 行为 |\n|------|------|----------------|\n| `assistant.delta` | 新增字符/token/phrase | **append** |\n| `assistant.snapshot` | 当前完整文本状态 | **replace** |\n| `assistant.completed` | 最终完整回复 | **finalize**（权威来源） |\n\n### 关键接口\n\n```ts\ninterface AssistantDeltaEvent {\n  type: 'assistant.delta';\n  messageId: string;\n  text: string;\n}\n\ninterface AssistantSnapshotEvent {\n  type: 'assistant.snapshot';\n  messageId: string;\n  text: string;\n}\n\ninterface AssistantCompletedEvent {\n  type: 'assistant.completed';\n  messageId: string;\n  text?: string;\n}\n```\n\n---\n\n## MessageAssembler\n\n公共组件，负责将 delta/snapshot/completed 事件组装为最终文本：\n\n```\nassistant.delta    → append\nassistant.snapshot → replace\nassistant.completed → finalize\n```\n\n**示例：**\n\nAntigravity（delta 模式）：\n```\ndelta: \"I \" → delta: \"have \" → delta: \"checked\"\nAssembler 输出: \"I have checked\"\n```\n\nPi Agent（snapshot 模式）：\n```\nsnapshot: \"I\" → snapshot: \"I have\" → snapshot: \"I have checked\"\nAssembler 输出: \"I have checked\"\n```\n\n文本语义差异在 Adapter + Assembler 层消灭，不下泄到飞书层。\n\n---\n\n## Presentation State\n\nUI 层唯一消费的数据结构，不感知 Harness 类型：\n\n```ts\ninterface AgentPresentationState {\n  status: 'starting' | 'working' | 'waiting' | 'completed' | 'failed';\n  currentAssistantText?: string;\n  currentTool?: {\n    name: string;\n    preview?: string;\n    startedAt?: number;\n  };\n  recentTools: Array<...>;\n  completedToolCount: number;\n  finalAnswer?: string;\n}\n```\n\n---\n\n## Agent Plugin Contract\n\n每个 Agent integration 收敛为一个 Plugin：\n\n```ts\ninterface AgentPlugin {\n  manifest: AgentManifest;\n  capabilities: AgentCapabilities;\n  models?: AgentModelProvider;\n  resolveConfig(...): ResolvedRuntimeConfig;\n  runtime: AgentRuntime;\n  eventAdapter: AgentEventAdapter;\n}\n```\n\n### 目录结构\n\n```\nsrc/lib/agents/\n  core/\n    types.ts\n    registry.ts\n    event-stream.ts\n    message-assembler.ts\n    projector.ts\n    model-catalog.ts\n  plugins/\n    codex/\n      manifest.ts\n      capabilities.ts\n      models.ts\n      config.ts\n      runtime.ts\n      events.ts\n    claude/\n    pi/\n    kimi/\n    antigravity/\n    generic-terminal/\n```\n\n### Capability 声明\n\n```ts\ninterface AgentCapabilities {\n  models: { configurable: boolean; discovery?: 'static' | 'runtime' };\n  reasoning: { supported: boolean; presets?: string[] };\n  sessionResume: boolean;\n  liveControl: boolean;\n  interactionRequests: boolean;\n  subagents: boolean;\n  semanticEvents: boolean;\n}\n```\n\n前端根据 capability 动态显示配置项，而非硬编码。\n\n---\n\n## 配置体系\n\n### AgentRunConfig\n\n平台保存用户意图，不保存 CLI-specific 参数：\n\n```ts\ninterface AgentRunConfig {\n  model?: string;\n  reasoning?: {\n    preset?: 'minimal' | 'low' | 'medium' | 'high' | 'xhigh';\n    native?: unknown;\n  };\n  permissions?: {\n    sandbox?: 'read-only' | 'workspace-write' | 'full-access';\n    network?: boolean;\n    approval?: 'never' | 'on-request';\n  };\n}\n```\n\n由 Agent Plugin / Config Adapter 翻译为具体 CLI 参数。\n\n### Agent Profile\n\n避免每次任务重新选择全部参数：\n\n```json\n{\n  \"name\": \"Codex Deep\",\n  \"harnessType\": \"codex\",\n  \"model\": \"<model-id>\",\n  \"reasoning\": { \"preset\": \"high\" },\n  \"permissions\": {\n    \"sandbox\": \"workspace-write\",\n    \"network\": true,\n    \"approval\": \"on-request\"\n  }\n}\n```\n\n---\n\n## Runtime Backend 抽象\n\nAgent 类型与 Runtime Backend 是两个独立维度：\n\n```ts\ninterface AgentRuntimeBackend {\n  start(...): Promise<RuntimeHandle>;\n  sendInput(...): Promise<void>;\n  interrupt(...): Promise<void>;\n  stop(...): Promise<void>;\n  resume?(...): Promise<RuntimeHandle>;\n  subscribeRawEvents(...): AsyncIterable<RawRuntimeEvent>;\n}\n```\n\n| Backend | 说明 |\n|---------|------|\n| LocalProcessRuntime | 本地 child_process |\n| RemoteSshRuntime | SSH 远程执行 |\n| HerdrRuntime | Herdr PTY 托管 |\n| GatewayRuntime | 远程网关 |\n\n例如 `Pi + LocalProcess`、`Pi + SSH`、`Pi + Herdr` 都应产出完全一样的 `AgentRunEvent`。\n\n---\n\n## 渐进迁移路线\n\n| 阶段 | 目标 | 关键动作 |\n|------|------|----------|\n| Phase 1 | 定义统一 contract | 明确 AgentRunEvent、delta/snapshot/completed、Tool lifecycle、Presentation State |\n| Phase 2 | MessageAssembler + Projector | 实现组装和投影，建立测试 |\n| Phase 3 | 迁移 Antigravity | text_delta → assistant.delta，验证 Assembler |\n| Phase 4 | 迁移 Pi Agent | 处理 delta vs snapshot 判断 |\n| Phase 5 | 迁移 Kimi | 统一多种兼容 parser 输出 |\n| Phase 6 | 迁移 Codex | 删除 live-room-progress.ts 中 Codex 特判 |\n| Phase 7 | 改造 Feishu / Live Room | 消费 AgentRunProjection 而非 Harness callback |\n| Phase 8 | Agent Plugin / Registry | 收敛为 Plugin Contract |\n| Phase 9 | Herdr Runtime | 作为 Runtime Backend 插入 |\n\n**第一张 PLAN 范围（最小可行）：**\n\n1. 定义 `AgentRunEvent` contract\n2. 明确 delta / snapshot / completed\n3. 实现 `MessageAssembler`\n4. 实现基础 `AgentRunProjector`\n5. 建立 replay / fixture tests\n6. 选择 Antigravity 作为第一个迁移 Harness\n7. 保持现有 Feishu / Live Room 路径兼容\n\n**明确不在范围内：** Herdr 接入、全部 Harness 一次性迁移、Model Catalog 完整 UI、Agent Profile UI、删除旧 callback API、Codex 大规模改写。\n\n---\n\n## 反模式（开发时必须避免）\n\n| 反模式 | 说明 |\n|--------|------|\n| Presentation 层增加 Harness 判断 | 不要新增 `if (harnessType === 'xxx')` |\n| 为解决 UI rate limit 丢 Event | 全量 ingest，throttle 只在 renderer |\n| 每个 Agent 单独维护完整转发逻辑 | Agent-specific 逻辑只集中在 Plugin / Adapter |\n| 把 stdout 当 assistant message | stdout 是 Transport Signal，必须经 Adapter 转换 |\n| 先删除 Codex 旧路径再重写 | 保持兼容，先增加 Event Pipeline，再切流量 |\n\n---\n\n## 测试策略\n\n以 contract test 为核心：\n\n| 测试类型 | 输入 | 输出 | 覆盖点 |\n|----------|------|------|--------|\n| Adapter fixtures | 真实 CLI output fixture | expected AgentRunEvent[] | 每个 Agent 的 raw → semantic 转换 |\n| Message Assembler | delta/snapshot/completed 序列 | 最终文本 | 拼接、替换、重复、空文本、中断 |\n| Replay | 已保存 Event Stream | Presentation State | 确定性结果 |\n| Renderer | Projection fixture | 渲染输出 | 不感知 Harness |\n\nFixture 目录：\n```\ntests/fixtures/agents/\n  codex/\n  pi/\n  kimi/\n  antigravity/\n```\n\n---\n\n## 成功标准\n\n> 让未来新增一个 Agent 时，只需实现一个 Plugin / Adapter；让任何 Agent 的输出、模型、reasoning、权限和 runtime 差异，都不再污染平台核心、Web Room 和 Feishu。\n\n具体衡量：\n\n- 新增 Agent → 不修改 live-room-progress\n- 不修改 Feishu renderer\n- 不修改 Web renderer\n- 不增加公共层 harnessType 判断\n- 不复制 final response extraction 流程\n- 只增加 Plugin / Adapter / Capability / Runtime binding\n\n---\n\n## 架构原则总结\n\n1. **平台应该理解\"Agent Event\"，而不应该理解每一个 Agent 的 stdout。**\n2. **平台应该表达\"用户想用什么能力\"，而不是在业务层拼每一个 Agent 的 CLI 参数。**\n3. **Agent-specific 差异应该存在，但只能存在于 Plugin / Adapter 边界。**","docs-docs":"# docs — docs\n\n\n\n# Docs 模块\n\n## 概述\n\n`docs/` 目录是 Agent Platform 项目的**机构记忆层**，承载了从架构设计、里程碑记录到运维交接的完整项目演进历史。它不是静态参考文档，而是一套**按时间线组织的交接协议**——每个文件代表一次会话/阶段的结束状态，为下一次会话提供精确的起点。\n\n## 命名规范\n\n文件采用**数字前缀 + 主题**的扁平结构：\n\n| 前缀范围 | 用途 | 示例 |\n|---------|------|------|\n| `00`–`13` | 早期架构设计与基础能力 | `00_ARCHITECTURE_REVIEW.md` |\n| `100`–`110` | 后期功能迭代与运维交接 | `104_AGENT_BIDIRECTIONAL_AND_CONTEXT_WATERMARK_NEXT_HANDOVER.md` |\n\n命名模式：\n\n```\n{序号}_{主题关键词}.md\n```\n\n- 序号递增，不回收\n- 主题关键词使用英文大写 + 下划线\n- 后期文件（107+）允许中文主题：`107_HANDOVER_20260609_Codex路径修复.md`\n\n## 文档类型\n\n### 1. 架构审查 / 设计文档\n\n记录架构决策、问题诊断和方案对比。\n\n- `00_ARCHITECTURE_REVIEW.md` — 识别 Node/Gateway 模型混淆，提出正确架构\n- `01_CONTROL_PLANE_ARCHITECTURE.md` — Control Plane 三层设计（GatewayClient → GatewayManager → FeishuCommandRouter）\n- `05_MULTI_GATEWAY_AGENT_MEETING_PLAN.md` — 多 Gateway Agent 会议的分层推进计划\n\n### 2. 里程碑 / 交接文档\n\n记录一次会话完成的工作、验证结果和下一步建议。这是**最主要的文档类型**。\n\n标准结构：\n\n```markdown\n# {序号} {标题}\n\n## 日期 / 任务类型 / 所属主线\n## 为什么做\n## 修改内容\n## 验证结果\n## 对主线的影响\n## 下一步建议\n```\n\n### 3. 运维指南\n\n面向接手者的操作手册。\n\n- `04_HANDOVER.md` — 快速启动、API 概览、故障排查\n- `102_FEISHU_SERVICE_RECOVERY_LESSONS_20260531.md` — 服务恢复经验\n\n### 4. 实施清单\n\n将设计文档拆解为可执行任务。\n\n- `06_STAGE1_MULTI_GATEWAY_MVP_CHECKLIST.md` — 阶段 1 的 A–H 工作分解\n\n## 项目演进时间线\n\n```mermaid\ntimeline\n    title Agent Platform 演进\n    section 基础架构\n        03-11 : 架构审查，识别 Node/Gateway 混淆\n        03-19 : Control Plane 设计\n        03-20 : 首次运维交接\n    section 多 Gateway 通信\n        03-21 : 双机联调，OpenClaw HTTP 验证\n        03-21 : 跨 Gateway Agent Chat 闭环\n        03-23 : Gateway Tags\n    section 产品化\n        03-21 : Dashboard/Chat 布局重构\n        03-21 : Feishu 平台集成方案\n    section Live Room 协议\n        05-25 : directed_visible 基础\n        05-31 : 双向通信 + 上下文水位\n        06-02 : 水位展示 + Feishu 自动绑定\n    section 扩展\n        06-09 : Codex 路径修复\n        07-17 : 开源准备 + Agy 集成 + Workspace 角色\n```\n\n## 核心架构决策（从文档中提取）\n\n### 双层 Token 模型\n\n这是项目中最关键的架构约束，在多个文档中反复强调：\n\n| Token 类型 | 来源 | 用途 |\n|-----------|------|------|\n| **平台 Token** | `POST /api/gateways/token` | Gateway 注册、心跳、平台身份认证 |\n| **OpenClaw Token** | OpenClaw 自身配置 | 访问 `/v1/responses`、`/v1/chat/completions` |\n\n**规则：平台 Token 不能直接调用 OpenClaw AI 端点。**\n\n### 分层原则\n\n```\nGateway 通信层 → Agent Adapter 层 → Meeting/Orchestrator 层\n```\n\n- 不一次性混合所有层\n- A2A 协议定位为中期适配层，不是第一阶段依赖\n\n### 软输入 / 硬内部协议\n\n- 用户输入可以保持自然语言（`@codex 你去问一下 pi`）\n- 内部路由必须使用结构化记录（`directed_visible` + `primaryTargetMemberId`）\n- 不依赖自由文本正则匹配作为路由真相源\n\n### 运行时管理\n\n- 使用 **user-level systemd** 管理，不用 `nohup`\n- 重启命令：`systemctl --user restart agent-platform-dev.service agent-platform-feishu.service`\n- `prisma/dev.db` 不纳入 Git 跟踪（103 号文档修复）\n\n## 关键代码位置索引\n\n文档中反复引用的核心文件：\n\n| 文件 | 职责 |\n|------|------|\n| `src/lib/gateway-router.ts` | Gateway 消息路由 |\n| `src/lib/openclaw-client.ts` | OpenClaw HTTP 调用 |\n| `src/lib/openclaw-gateway-rpc.ts` | OpenClaw WS 控制面 |\n| `src/lib/gateway-auth.ts` | Token 验证中间件 |\n| `src/lib/encryption.ts` | AES-256-GCM Token 加密 |\n| `src/lib/live-room.ts` | Live Room 核心模型 |\n| `src/lib/live-room-delivery.ts` | 消息投递与路由 |\n| `src/lib/feishu.ts` | Feishu 命令解析 |\n| `src/lib/feishu-long-connection.ts` | Feishu 长连接运行时 |\n| `src/lib/task-room.ts` | Task Room 上下文管理 |\n| `src/lib/acpx/runner.ts` | ACPX Agent 执行器 |\n| `src/components/live-room/LiveRoomWorkspace.tsx` | Live Room Web UI |\n\n## 阅读指南\n\n### 新接手者推荐阅读顺序\n\n根据当前阶段选择入口：\n\n**如果接手 Live Room / Feishu 方向：**\n1. `104_AGENT_BIDIRECTIONAL_AND_CONTEXT_WATERMARK_NEXT_HANDOVER.md`\n2. `105_LIVE_ROOM_MEMBER_WATERMARK_SLICE_HANDOVER.md`\n3. `106_FEISHU_AUTO_BIND_DEFAULT_AGENT_AND_REMOTE_WORKDIR_NEXT_HANDOVER.md`\n4. `109_HANDOVER_20260717_Agy本地集成.md`\n\n**如果接手 Gateway 通信方向：**\n1. `04_HANDOVER.md`\n2. `07_OPENCLAW_HTTP_MILESTONE.md`\n3. `08_OPENCLAW_HTTP_HANDOVER.md`\n4. `09_CROSS_GATEWAY_AGENT_CHAT_HANDOVER.md`\n\n**如果接手产品/布局方向：**\n1. `10_LAYOUT_AND_FEISHU_HANDOVER.md`\n2. `11_DASHBOARD_CHAT_LAYOUT_PLAN.md`\n3. `12_FEISHU_PLATFORM_INTEGRATION_PLAN.md`\n\n### 每个交接文档的\"下一步建议\"\n\n每个文档末尾的\"下一步建议\"或\"Recommended Next Session\"是**最关键的导航信息**——它告诉下一个会话应该从哪里开始、先读什么、先验证什么。\n\n## 编写新交接文档的规范\n\n基于现有文档的惯例：\n\n1. **序号递增**，不复用已删除的序号\n2. **必须包含**：日期、任务类型、所属主线、为什么做、修改内容、验证结果、对主线的影响、下一步建议\n3. **验证结果**要具体：列出执行的命令和通过/失败状态\n4. **下一步建议**要可执行：明确\"先读什么文件\"、\"先验证什么\"、\"先改什么代码\"\n5. **不要假设读者有上下文**：每个文档应自包含足够信息让新会话独立启动\n6. **文件变更列表**要完整：列出所有修改的文件路径\n\n## 与代码的关系\n\n`docs/` 不直接参与运行时，但它是**开发流程的核心基础设施**：\n\n- 每次会话结束 → 写交接文档\n- 每次会话开始 → 读交接文档确定起点\n- 架构决策 → 记录在文档中，代码实现引用文档编号\n- 运维操作 → 文档中的命令可直接复制执行\n\n文档中引用的代码路径（如 `src/lib/gateway-router.ts`）是**当前有效的**，但具体实现可能已演进。以最新交接文档中的\"文件变更\"列表为准。","docs-inbox":"# docs — inbox\n\n\n\n# docs/inbox — Workflow 候选需求收件箱\n\n## 概述\n\n`docs/inbox/` 是 Agent Platform workflow `auto` 模式使用的 **Git 收件箱**（Git Inbox）。它不是本地临时草稿目录，而是通过 Git 提交持久化的候选需求存储层。每个候选需求以独立的 Markdown 文件形式存在，由平台 watcher 在 workflow 的 PLAN 阶段自动扫描并提议转化为可执行的 PLAN。\n\n## 文件命名规范\n\n```\nNNN_TYPE_YYYYMMDD_标题.md\n```\n\n| 字段 | 说明 | 示例 |\n|------|------|------|\n| `NNN` | 三位数递增编号 | `347`、`380`、`442` |\n| `TYPE` | 文档类型（大写） | `ISSUE`、`ROADMAP` |\n| `YYYYMMDD` | 提出日期 | `20260804` |\n| `标题` | 简短描述（下划线分隔） | `Workflow编排失败恢复收据与断点继续` |\n\n## YAML Frontmatter 结构\n\n每个文件头部包含以下元数据：\n\n```yaml\n---\ndoc_type: ISSUE          # 文档类型：ISSUE | ROADMAP\ndoc_status: draft        # 状态：draft | active | superseded\nnext_action: none        # 下一步动作（当前均为 none）\n---\n```\n\n### 状态语义\n\n| `doc_status` | 含义 |\n|---|---|\n| `draft` | 已记录，等待排期实施 |\n| `active` | 正在执行或已激活（如 ROADMAP） |\n| `superseded` | 已被其他文件替代/拆分，不再独立排期 |\n\n## 使用约定\n\n1. **每个候选需求一个文件**：一级标题作为候选名称，正文描述范围和验收目标。\n2. **`README.md` 仅说明规则**：watcher 会忽略它，不将其视为候选项。\n3. **只读已提交内容**：watcher 只读取目标 Git HEAD 中已提交的内容，不读取工作区草稿。\n4. **仅 `auto` 模式消费**：只有 `auto` 在 phase PLAN 完成后可从此处提议新 PLAN；`manual` 和 `semi_auto` 不消费 Inbox。\n5. **新 PLAN 仍需用户审批**：Inbox 中的条目不会自动执行，必须经过审批。\n6. **去重机制**：已有 PLAN 记录相同 `WORKFLOW_INBOX_ITEM` 时不会重复认领。\n7. **安全约束**：不在候选文件中保存凭证、Token、个人数据或未经授权的真实环境信息。\n\n## 文件类型与当前内容\n\n### ISSUE（候选需求）\n\n当前 Inbox 中的 ISSUE 文件覆盖了以下主题域：\n\n| 编号 | 主题 | 优先级 | 状态 |\n|------|------|--------|------|\n| 347 | Workflow Validator 沙箱绝对路径依赖 | P2 | draft |\n| 348 | Feishu Watchdog 误判 Platform Local 长任务 | P1 | draft |\n| 349 | 网页平台登录认证与 Inbox 快捷记录命令 | P1 | superseded |\n| 350 | 远程 Agent 守护进程与 WebSocket 接入网络 | P1 | draft |\n| 351 | 并行工作流调度与 Git Worktree 任务隔离执行 | P1 | draft |\n| 357 | 网页平台登录认证与 RBAC | P1 | draft |\n| 375 | AP 命令卡片增加角色工作流入口 | P2 | draft |\n| 376 | 用户分支变更致 Watcher 阻断与 Handoff 链状态反馈优化 | P1 | draft |\n| 377 | Agent 执行过程详细信息折叠显示方案 | P1 | draft |\n| 380 | Workflow 编排失败恢复收据与断点继续 | P1 | draft |\n| 382 | Agent 职责分工与按意图路由 | P1 | draft |\n| 391 | 双工作模式演进（Worktree 并行 + 角色串行） | P1 | draft |\n| 442 | Agent 运行时能力增强（模型切换/思考长度/Skill/插话） | P1 | draft |\n| 444 | 并行 Slice 执行引擎落地 TODO | P1 | draft |\n| 448 | 每个 Slice 重置会话 | P1 | draft |\n| 481 | Pi 主机级供应商与模型切换 TODO | P1 | draft |\n| 482 | 服务监控、Agent 决策审计与历史保留策略研究 | P1 | draft |\n\n### ROADMAP（排期规划）\n\n| 编号 | 标题 | 状态 |\n|------|------|------|\n| 378 | Inbox 议题优先级排期与实施规划 | active |\n\nROADMAP 文件（`378`）维护了所有 Inbox 议题的优先级梯度，分为：\n- **第一梯队**：高感知收益，解决现实痛点（380、442、376、377）\n- **第二梯队**：提升系统可靠性与快捷交互（348、382、375）\n- **第三梯队**：中长期演进与安全基石（357、351、350）\n- **暂缓/维护项**：347、349\n\n## 与平台其他组件的关系\n\n```mermaid\ngraph LR\n    A[\"docs/inbox/*.md<br/>(Git 已提交)\"] -->|watcher 扫描| B[\"Workflow Watcher\"]\n    B -->|auto 模式 PLAN 阶段| C[\"提议新 PLAN\"]\n    C -->|用户审批| D[\"执行 Workflow\"]\n    E[\"workflow-contract.yaml\"] -->|校验格式| B\n    F[\"workflow-validator.ts\"] -->|校验内容| B\n    G[\"WORKFLOW_INBOX_ITEM\"] -->|去重| B\n```\n\n### 关键交互点\n\n| 组件 | 与 Inbox 的关系 |\n|------|----------------|\n| **Workflow Watcher** | 扫描 Git HEAD 中 `docs/inbox/` 下已提交文件，识别候选项 |\n| **Workflow Validator** (`src/lib/scheduled-jobs/workflow-validator.ts`) | 校验 Inbox 文件是否符合 `workflow-contract.yaml` 规范 |\n| **`workflow-contract.yaml`** | 定义 `allowed_types: ISSUE` 等格式约束 |\n| **`WORKFLOW_INBOX_ITEM`** | PLAN 中记录来源 Inbox 条目编号，实现去重 |\n| **`npm run workflow:validate`** | 本地校验命令，可验证 Inbox 文件格式 |\n\n## 生命周期\n\n```\n提出 → 提交到 Git → Watcher 扫描 → (auto 模式) 提议 PLAN → 用户审批 → 执行\n                ↓\n         被拆分/替代 → doc_status: superseded\n```\n\n1. **提出**：用户或 Agent 在 `docs/inbox/` 下创建新文件并 Git 提交。\n2. **扫描**：Watcher 在 workflow `auto` 模式的 PLAN 阶段读取已提交文件。\n3. **提议**：Watcher 将候选项转化为 PLAN 提议，记录 `WORKFLOW_INBOX_ITEM` 编号。\n4. **审批**：用户审批后 PLAN 进入执行。\n5. **归档**：已实施的条目可标记为 `superseded` 或保留为 `draft`（视情况）。\n\n## 贡献指南\n\n### 新增候选需求\n\n1. 确定下一个可用编号（查看现有最大编号 + 1）。\n2. 创建文件：`docs/inbox/NNN_ISSUE_YYYYMMDD_标题.md`。\n3. 填写 YAML frontmatter（`doc_type: ISSUE`、`doc_status: draft`、`next_action: none`）。\n4. 正文包含：状态、问题背景、处理思路/方案、验收标准。\n5. Git 提交（必须提交，工作区草稿不会被 watcher 读取）。\n\n### 注意事项\n\n- 不要在工作区未提交状态下期望 watcher 识别新条目。\n- 不要在同一文件中混合多个不相关需求。\n- 如果需求被拆分为多个子项，将原文件标记为 `superseded` 并在新文件中注明来源。\n- 参考 `378_ROADMAP` 了解当前优先级排期，避免重复提出已有议题。","docs-workflow-bugfix-notes":"# docs — workflow-bugfix-notes\n\n\n\n# docs/workflow-bugfix-notes\n\n## 模块概述\n\n本目录是**工作流 Session 换代（Session Rotation）系统**的修复记录归档。每篇文档对应一次线上问题的完整闭环：现象 → 根因 → 修复 → 验证 → 运维备注。\n\n这些记录不是设计文档，而是**事后分析（post-mortem）**，用于：\n\n- 帮助新成员理解 Session 换代机制中容易出错的边界条件\n- 为后续类似问题的排查提供模式参考\n- 记录运维决策（如历史残留文件是否回收、游标是否移动）\n\n## 涉及的核心组件\n\n修复记录中反复出现的代码模块：\n\n| 文件 | 职责 |\n|------|------|\n| `feishu-workflow.ts` | 工作流派发主逻辑，负责从上一轮 Prompt 提取建议 Handover 路径，决定走\"复用已提交 Handover\"还是\"应急生成检查点\"分支 |\n| `workflow-session-rotation.ts` | Session 换代核心，包含 `suggestHandoverPathFromPrompt` 等路径提取函数 |\n| `feishu-new-session.ts` | 飞书侧换代命令入口，处理 `/ap new-session` 命令及确认卡片回调，负责检查点生成与提交 |\n| `feishu-long-connection.ts` | 飞书长连接卡片交互层，处理卡片按钮回调并发送进度提示 |\n\n## 问题一：换代派发误生成 Session 换代检查点（2026-08-30）\n\n### 问题摘要\n\nS04 完成后 S05 的 `next_slice` 派发每分钟失败一次，目标仓库 `docs/` 根目录持续生成 `NNN_HANDOVER_20260830_Session换代_*.md` 暂存残留。\n\n### 根因链\n\n```mermaid\ngraph TD\n    A[\"feishu-workflow.ts 正则提取建议路径\"] -->|\"只匹配 docs/ 根目录\"| B[\"建议路径为空\"]\n    B --> C[\"平台误判：无已提交 Handover\"]\n    C --> D[\"走应急生成分支\"]\n    D --> E[\"嵌入最近 30 条房间消息\"]\n    E --> F[\"消息含 PROMPT_START/END 标记\"]\n    F --> G[\"目标仓库钩子拒绝提交\"]\n    G --> H[\"文件残留暂存区\"]\n    H --> I[\"下次重试生成新编号文件\"]\n    I --> D\n```\n\n三个独立缺陷叠加：\n\n1. **路径正则不匹配子目录** — `docs\\/\\d+_HANDOVER_\\d{8}_...` 无法匹配 `docs/dev/229_HANDOVER_...md`\n2. **应急生成器未脱敏** — 原样嵌入 transcript，其中包含 `<!-- WORKFLOW_PROMPT_START/END -->` 标记\n3. **重试分支丢失参数** — `rotation_pending` 分支未传 `suggestedPath`，即使首轮已提取成功，重试时仍退回应急生成\n\n### 修复要点（commit `b4f6e83`）\n\n- `suggestHandoverPathFromPrompt` 扩展为接受 `docs/<branch_space>/NNN_HANDOVER_YYYYMMDD_*.md` 多级路径\n- `prepared` 与 `rotation_pending` 两个分支统一传入建议路径\n- 生成检查点前调用 `redactWorkflowPromptMarkers` 脱敏\n- 提交失败时撤销暂存并删除文件，防止残留累积\n\n### 运维决策\n\n- 历史 `docs/NNN_HANDOVER_..._Session换代_*.md`（001–013）保留在 Git 历史中，不回收\n- 未提交的重复残留（011/012）由当值 Agent 清理\n- 不改变合同、扫描边界或游标\n\n---\n\n## 问题二：直接切换 Session 误生成 Handover（2026-09-03）\n\n### 问题摘要\n\n用户在飞书卡片中点击「直接切换」后，平台仍执行了应急检查点生成逻辑，在目标仓库产生大量 `NNN_HANDOVER_*.md` 文档和 Git 提交。\n\n### 根因链\n\n```mermaid\ngraph TD\n    A[\"用户点击「直接切换」\"] --> B[\"卡片回调 onStarted\"]\n    B --> C[\"硬编码提示：正在处理 Session 切换与 Handover 生成...\"]\n    A --> D[\"handleNewSessionConfirmationCardAction\"]\n    D --> E[\"透传原始选项，未清理 handover 参数\"]\n    E --> F[\"handleNewSessionCommand\"]\n    F --> G{\"generate-handover === 'true'?\"}\n    G -->|是| H[\"执行 generateCommittedHandover\"]\n    H --> I[\"生成检查点并提交\"]\n```\n\n三个独立缺陷：\n\n1. **卡片提示文案硬编码** — `onStarted` 不区分 `direct` 和 `handover` 决策\n2. **确认卡片回调未清理参数** — `decision === 'direct'` 时仍透传 `generate-handover`、`handover`、`from-handover`\n3. **核心入口缺少 direct 守卫** — `handleNewSessionCommand` 未对 `direct` 做强制隔离\n\n### 修复要点（commit `a1c002a`）\n\n- `buildCardActionHandler` 的 `onStarted` 接收 `decision` 参数，按决策类型区分提示文案\n- `handleNewSessionConfirmationCardAction` 在 `decision === 'direct'` 时显式 `delete` 所有 Handover 相关选项\n- `handleNewSessionCommand` 中：\n  - `direct` 为 true 时强制 `handoverOption = ''`\n  - 生成检查点条件增加 `!direct` 守卫：`if (confirmed && !direct && command.options['generate-handover'] === 'true')`\n- 回归测试断言：直接切换后 Git HEAD 不变，不产生任何文档\n\n### 中断恢复记录\n\n修复过程中 `agent-platform-feishu.service` 收到 SIGTERM 重启，正在执行的 antigravity 任务被停止。恢复命令接管后：\n\n1. Git 状态保护确认未提交代码完整\n2. 加固审阅：将原地修改传入参数改为构建新的纯净选项对象\n3. 跑通回归测试后正式提交\n\n---\n\n## 排查模式参考\n\n两篇记录共同揭示的 Session 换代系统脆弱点：\n\n| 脆弱点 | 表现 | 防御手段 |\n|--------|------|----------|\n| 路径匹配假设 | 正则只覆盖单一目录布局 | 路径提取函数应接受多级目录，测试覆盖 `docs/` 根和 `docs/<branch_space>/` 子目录 |\n| 参数透传污染 | 上游选项泄漏到下游执行层 | 在决策分支入口显式清理不相关参数，构建纯净选项对象 |\n| 应急生成副作用 | 生成失败后文件残留 | 提交失败时必须撤销暂存并删除文件 |\n| 重试路径不一致 | 首轮和重试走不同分支 | 所有分支统一传入关键参数 |\n| 外部内容注入 | transcript 含不可执行标记 | 生成检查点前统一脱敏 |\n\n## 文件清单\n\n| 文件 | 日期 | 主题 |\n|------|------|------|\n| `20260830_handover-suggestion-and-checkpoint-sanitize.md` | 2026-08-30 | 路径正则 + 标记脱敏 + 重试参数 |\n| `20260903_direct-session-rotation-handover-free.md` | 2026-09-03 | direct 模式隔离 + 卡片文案 + 中断恢复 |","docs-workflow-kit":"# docs — workflow-kit\n\n\n\n# Workflow Kit — 通用工作流套件\n\n## 概述\n\n`docs/workflow-kit/` 是一个**可拷贝的模板目录**，用于将 agent-platform-v2 平台的 PLAN/HANDOVER 文档工作流接入任意新仓库。它不包含可执行代码，而是提供一组带 `[CHANGE-ME]` 占位符的配置文件和文档模板，套用时逐项替换即可。\n\n核心设计原则：\n\n- **规则值永远来自目标 Git ref 中已提交的合同**，平台代码不硬编码仓库规则\n- **watcher 只读已提交内容**，不消费工作区文件，不从正文猜测动作\n- **同一仓库、ref、branch space 只允许一个 workflow consumer**\n\n## 架构关系\n\n```mermaid\ngraph LR\n    subgraph \"workflow-kit（模板源）\"\n        A[workflow-contract.yaml]\n        B[PLAN-writing-standard.md]\n        C[templates/PLAN.md]\n        D[templates/HANDOVER.md]\n        E[AGENTS-workflow-section.md]\n        F[docs-workflow-README.md]\n        G[docs-workflow-AUTOMATION_GUIDE.md]\n        H[projects.yaml.example]\n    end\n\n    subgraph \"目标仓库\"\n        A2[docs/workflow/workflow-contract.yaml]\n        B2[docs/workflow/PLAN-writing-standard.md]\n        C2[docs/workflow/templates/PLAN.md]\n        D2[docs/workflow/templates/HANDOVER.md]\n        E2[AGENTS.md 追加段落]\n        F2[docs/workflow/README.md]\n        G2[docs/workflow/AUTOMATION_GUIDE.md]\n    end\n\n    subgraph \"agent-platform-v2\"\n        P[config/projects.yaml]\n        W[workflow-watcher]\n        V[validator]\n    end\n\n    A -->|复制| A2\n    B -->|复制| B2\n    C -->|复制| C2\n    D -->|复制| D2\n    E -->|并入| E2\n    F -->|复制| F2\n    G -->|复制| G2\n    H -->|合并条目| P\n    P --> W\n    A2 --> V\n    W -->|扫描已提交文档| A2\n```\n\n## 文件清单与目标位置\n\n| 套件文件 | 复制到目标仓库 | 说明 |\n| --- | --- | --- |\n| `workflow-contract.yaml` | `docs/workflow/workflow-contract.yaml` | 机器可读合同，平台 validator/watcher 的唯一规则源 |\n| `PLAN-writing-standard.md` | `docs/workflow/PLAN-writing-standard.md` | 跨仓 PLAN 写作与 Slice 划分规范 |\n| `templates/PLAN.md` | `docs/workflow/templates/PLAN.md` | PLAN 骨架模板 |\n| `templates/HANDOVER.md` | `docs/workflow/templates/HANDOVER.md` | HANDOVER 骨架模板 |\n| `docs-workflow-README.md` | `docs/workflow/README.md` | 工作流目录入口说明 |\n| `docs-workflow-AUTOMATION_GUIDE.md` | `docs/workflow/AUTOMATION_GUIDE.md` | 平台监测执行操作指南 |\n| `AGENTS-workflow-section.md` | 并入根 `AGENTS.md` | 工作流守则段落（追加，非整文件替换） |\n| `projects.yaml.example` | **不复制进仓库** | 平台 `config/projects.yaml` 的项目条目示例 |\n\n另需在目标仓库自建：\n\n- 分支文档空间目录（合同 `branch_spaces.root` 指向的目录，如 `docs/codex/<branch-space>/`）\n- 需求池 `docs/inbox/`（可选，`auto` 模式使用）\n\n## 核心概念\n\n### 合同（workflow-contract.yaml）\n\n合同是平台运行时读取的**唯一规则源**，定义了：\n\n| 配置段 | 作用 |\n| --- | --- |\n| `documents` | 文档类型、文件名模式、Slice 编号模式、状态枚举、必填字段 |\n| `actions` | 可执行动作（`start_first_slice`、`next_slice`、`resume_parent`）、审批动作（`await_approval`）、终止动作（`await_acceptance`、`blocked`、`none`） |\n| `prompt` | Prompt 标记（`WORKFLOW_PROMPT_START` / `WORKFLOW_PROMPT_END`），标记之间的内容是投递给下一 Session 的唯一 Prompt |\n| `templates` | 模板文件路径（validator 校验存在性） |\n| `standards` | PLAN 写作标准文件路径 |\n| `validation` | 校验模式（`balanced`：策略规则产生 warning） |\n| `completion_gate` | 完成门禁超时（秒） |\n| `numbering` | 文档编号规则（宽度、作用域、唯一性、候选选择策略） |\n| `branch_spaces` | 分支文档空间根目录、无编号分支、编号目录模式 |\n| `large_files` | 长文件告警/阻断阈值、源文件扩展名、忽略路径 |\n| `legacy` | 存量文档豁免截止 commit |\n\n### PLAN 与 HANDOVER\n\n**PLAN** 是工作流的核心驱动文档，描述一个可执行目标及其 Slice 分解。两种尺度：\n\n- **Phase PLAN**：目标跨越多个能力阶段，先说明完整路线，执行部分仍拆成可交付 Slice\n- **Slice PLAN**：目标已收敛，直接拆成一个或少量 Session\n\n**HANDOVER** 是 Slice 完成后的交接文档，驱动状态转换：\n\n| `next_action` | 含义 |\n| --- | --- |\n| `next_slice` | 投递下一 Slice |\n| `resume_parent` | 恢复父 PLAN（Interrupt PLAN 完成后） |\n| `await_acceptance` | 停下等人工验收 |\n| `blocked` / `none` | 通知后停止 |\n\n### Slice 划分规则\n\n每个 Slice 必须满足：\n\n1. 一个 Agent 在一个 Session 内能完成理解、修改、验证、HANDOVER 和提交\n2. 只有一个主要结果和一个主要失败原因\n3. 默认只跨一个工程边界（算法 / HTTP / UI / 数据库四选一）\n4. 通常不超过 2 个生产文件与 2 个测试文件\n5. 不依赖下一个 Slice 也能运行本 Slice 的验收\n6. 只提交本 Slice，创建 HANDOVER，然后停止\n\n### 状态机\n\n```mermaid\nstateDiagram-v2\n    [*] --> ready[\"ready:\"] 提交 PLAN\n    ready --> in_progress[\"in_progress:\"] 审批通过，start_first_slice\n    in_progress --> in_progress[\"in_progress:\"] next_slice（继续下一 Slice）\n    in_progress --> ready[\"ready:\"] resume_parent（恢复父 PLAN）\n    in_progress --> completed[\"completed:\"] await_acceptance / blocked / none\n    completed --> [*]\n```\n\n关键约束：\n\n- 新 PLAN 永远需要人工审批\n- `auto` 模式只负责从 Roadmap/Inbox 生成提案，不拥有批准权\n- 修改、拒绝或审批超时都不得启动 Slice\n- 每完成一个 Slice：运行项目门禁，创建 HANDOVER，提交后停止\n\n## 套用步骤\n\n1. **复制文件**到上表位置，创建分支文档空间与 `docs/inbox/`\n2. **逐项替换 CHANGE-ME**（见下方核对表）\n3. **决定 `legacy.cutoff_commit` 与 `initial_cursor_commit`**（通常都取接入时的 HEAD）\n4. **在 agent-platform-v2 `config/projects.yaml` 登记项目**，先 `mode: shadow` 干跑观察\n5. **确认 watcher 状态正常**（`/ap workflow status`、`/ap job diagnose workflow-watcher`）后切 `active`\n6. **首个 PLAN 用模板手工创建并提交**，走一遍\"校验 → 审批卡 → 执行\"闭环验证\n\n## CHANGE-ME 核对表\n\n### A. `workflow-contract.yaml`\n\n| 字段 | 说明 |\n| --- | --- |\n| `contract_version` | 目标仓库自定版本号（建议 `YYYY.MM.DD.N`） |\n| `documents.allowed_types` | 按仓库需要增删（如加 `DISCUSSION`、`TODO`） |\n| `documents.slice_pattern` | 默认宽松版；要强制标题行内 Slice 号改用严格版 |\n| `branch_spaces.root` | 分支文档空间根目录（如 `docs/codex`） |\n| `branch_spaces.unnumbered_branches` | 不建编号目录的分支名 |\n| `legacy.cutoff_commit` | 接入时当前 HEAD 的完整 SHA |\n| `large_files.thresholds` | 按仓库实际调整（默认 800 告警 / 1000 阻断） |\n| `large_files.source_extensions` | 按技术栈增删 |\n| `large_files.ignored_path_parts` | 按技术栈补充 |\n\n### B. 平台注册（`projects.yaml.example`）\n\n| 字段 | 说明 |\n| --- | --- |\n| `id` / `name` / `path` | 项目唯一 id、显示名、服务器绝对路径 |\n| `ref` | 完整 `refs/heads/...` |\n| `feishu.chat_id` / `approver_open_ids` | 审批通知会话与审批人 |\n| `branch_space` | 文档空间子目录名（根空间用 `.`） |\n| `initial_cursor_commit` | 接入起点 HEAD 的完整 SHA |\n| `workflow_autonomy` | `manual` / `semi_auto` / `auto` |\n| `execution_policy.preset` | `workspace` / `full_access` |\n\n## Agent 完成约定\n\nAgent 完成一个 Slice 后必须：\n\n1. 提交 HANDOVER 文档\n2. 取得该文档最后一次变更的完整 commit SHA\n3. 最终回复原样重复合同 Prompt 标记之间的下一 Session Prompt\n4. 以 `WORKFLOW_READY <document_commit_full_sha> <document_basename>` 作为最后一行\n\n## 安全规则\n\n- 自动化只读已提交内容，不从自然语言正文猜测下一步；元数据无效即停止并报告\n- watcher 已读取提交后，Git 历史只追加：禁止 amend、rebase、reset、强推\n- 不重复消费同一事件（commit + path + blob + action 幂等）\n- 超时告警不自动 reset；恢复操作须显式命令并在 diagnose 之后执行\n- 已达合同 `large_files.blocking_lines` 阈值的文件不得增长；需要新增职责时，先在同一提交中提取明确边界的模块\n\n## 常用操作命令\n\n```text\n/ap workflow status              # 查看工作流状态\n/ap workflow autonomy show       # 查看自治模式\n/ap dashboard                    # 打开 Dashboard\n/ap job run workflow-watcher     # 手动触发 watcher\n/ap job diagnose workflow-watcher # 诊断 watcher\n/ap job cursor workflow-watcher --latest  # 查看最新 cursor\n```\n\n> `--latest`、`--clear-pending` 不是常规重试按钮；移动 cursor / 清 pending 必须先诊断确认。\n\n## 边界与原则\n\n- 平台代码不硬编码仓库规则值；规则值永远来自目标 Git ref 中已提交的合同\n- 本套件是模板快照，与平台实现可能有版本差；以平台仓库的 `docs/workflow/AUTOMATION_GUIDE.md` 为权威操作说明\n- 复制文件不等于接入完成：agent-platform-v2 侧的项目注册是平台侧配置，每个仓库都要单独做","docs-workflow":"# docs — workflow\n\n\n\n# docs/workflow — 文档驱动工作流自动化\n\n## 模块定位\n\n`docs/workflow/` 是 Agent Platform 工作流自动化的**规则源与操作入口**。它定义了一套以 Git 已提交文档为事件源的状态机，驱动 Agent 按 Slice 粒度连续执行、交接和停止。\n\n核心原则：**自动化只消费已提交的文档，不读取工作区半成品，不从正文猜测意图。**\n\n```\n已提交 PLAN/HANDOVER → workflow-watcher → 校验 → 审批/执行 → 新 Session\n```\n\n## 文件结构\n\n| 文件 | 职责 |\n| --- | --- |\n| `workflow-contract.yaml` | 唯一机器可读规则源：合法字段、动作、模板路径、编号、阈值 |\n| `AUTOMATION_GUIDE.md` | 状态机、自治模式、Roadmap/Inbox、恢复与操作说明 |\n| `PLAN-writing-standard.md` | 跨仓 PLAN 写作与 Slice 划分规范 |\n| `templates/PLAN.md` | Phase PLAN 和 Interrupt PLAN 最小模板 |\n| `templates/HANDOVER.md` | 三种 HANDOVER 状态转换模板 |\n| `225_DECISION_20260725_文档自动化状态机.md` | 设计决策记录 |\n| `README.md` | 本目录入口索引 |\n\n## 文档类型与自动化语义\n\n| 类型 | 语义 | 是否触发执行 |\n| --- | --- | --- |\n| `PLAN` | 阶段多 Slice 计划，或阻塞 bug 的嵌套计划 | 仅 `ready` + `start_first_slice` 可启动 |\n| `HANDOVER` | 一次 Session 的事实记录和受控转换 | 仅 `next_slice` / `resume_parent` 可启动 |\n| `ROADMAP` | 总体路线、阶段顺序和验收后的阶段状态 | 永不直接启动 |\n| `DECISION` | 已接受的规则 | 不启动 |\n| `ISSUE` | bug 证据、调查或队列项 | 不启动 |\n| `REPORT` | 验收、里程碑、进度或验证结果 | 不启动 |\n| `FIX` | 缺陷根因与验证 | 不启动 |\n\n## 主状态机\n\n```mermaid\nstateDiagram-v2\n    [*] --> PLAN_draft[\"PLAN_draft:\"] 创建 PLAN\n    PLAN_draft --> PLAN_ready[\"PLAN_ready:\"] 人工修订完成\n    PLAN_ready --> PLAN_pending[\"PLAN_pending:\"] start_first_slice 提交\n    PLAN_pending --> PLAN_approved[\"PLAN_approved:\"] 人工批准\n    PLAN_pending --> PLAN_rejected[\"PLAN_rejected:\"] 拒绝/超时\n    PLAN_approved --> S01[\"S01:\"] 投递首个 Slice Prompt\n    S01 --> S02[\"S02:\"] HANDOVER next_slice\n    S02 --> S03[\"S03:\"] HANDOVER next_slice\n    S03 --> Awaiting[\"Awaiting:\"] 最终 Slice await_acceptance\n    Awaiting --> [*]: 用户验收\n    S01 --> Blocked[\"Blocked:\"] blocked\n    S02 --> Blocked[\"Blocked:\"] blocked\n    Blocked --> [*]: 通知并停止\n    S01 --> Interrupt[\"Interrupt:\"] 大型阻塞 bug\n    Interrupt --> S01[\"S01:\"] resume_parent 返回\n```\n\n### PLAN 生命周期\n\n1. **创建**：`doc_status: ready`，按用户意图选择 `next_action`：\n   - `await_approval`（默认）：留在候选清单，不自动发审批卡\n   - `start_first_slice`：提交后由 watcher 直接进入审批\n2. **审批**：人工批准 / 修改 / 拒绝 / 超时\n3. **执行**：批准后只派发第一个 Slice\n4. **推进**：每个 Slice 完成后创建 HANDOVER，由 `next_slice` 驱动下一 Slice\n5. **终止**：最终 Slice 使用 `await_acceptance`，通知用户验收并停止\n\n### HANDOVER 动作\n\n| 动作 | 含义 | 后续 |\n| --- | --- | --- |\n| `next_slice` | 当前 Slice 完成，Phase PLAN 仍在进行 | 投递下一 Slice Prompt |\n| `resume_parent` | Interrupt PLAN 完成 | 恢复父 PLAN 的 `return_to` Slice |\n| `await_acceptance` | Phase PLAN 完成 | 通知验收；`auto` 可提议下一 PLAN |\n| `blocked` / `none` | 无可执行推进 | 通知并停止 |\n\n## 控制字段（YAML Frontmatter）\n\n参与自动化的 PLAN/HANDOVER 在文件首部写 YAML：\n\n```yaml\n---\ndoc_type: HANDOVER\ndoc_status: completed\nplan: 147_PLAN_20260725_阶段计划.md\nslice: S01\nplan_progress: in_progress\nnext_action: next_slice\n---\n```\n\n### 动作分类\n\n**可执行动作**（允许携带 Prompt 标记）：\n- `start_first_slice`\n- `next_slice`\n- `resume_parent`\n\n**终止动作**（禁止携带 Prompt）：\n- `await_acceptance`\n- `blocked`\n- `none`\n\n**审批动作**：\n- `await_approval`\n\n### Prompt 标记规则\n\n只有可执行 action 才允许在文末出现**一次** `WORKFLOW_PROMPT_START / WORKFLOW_PROMPT_END` 标记。非可执行 action 禁止携带 Prompt。\n\n```markdown\n<!-- WORKFLOW_PROMPT_START -->\n读取 `docs/<HANDOVER>.md`、`docs/<PLAN>.md` 和 `docs/workflow/workflow-contract.yaml`，只执行 S02。\n完成验证、创建下一 HANDOVER、提交后停止。\n<!-- WORKFLOW_PROMPT_END -->\n```\n\n## 自治模式\n\n`workflow-watcher` 的启停与自治模式是两个独立控制面。\n\n| 模式 | 已批准 PLAN S01 | `next_slice` | `resume_parent` | Phase 完成后 |\n| --- | --- | --- | --- | --- |\n| `manual` | 手工运行 watcher | 手工运行 watcher | 手工运行 watcher | 不提议 |\n| `semi_auto` | 自动 | 自动 | 停止，等待人工 | 不提议 |\n| `auto` | 自动 | 自动 | 自动 | 自动生成待审批 PLAN |\n\n关键约束：\n- 任何模式都不会越过 `blocked`，也不会自动批准 PLAN\n- 项目配置中的模式只是默认值；数据库 override 优先\n- 切换模式必须携带当前 40 位 HEAD\n\n## Roadmap 与 Git Inbox\n\n`auto` 模式在 Phase PLAN 完成后，按以下顺序选取下一 PLAN 候选：\n\n1. Phase PLAN 的 `roadmap` 非空时，读取该 ROADMAP 第一条未勾选项\n2. `roadmap: null` 时，扫描 `docs/inbox/` 直属 Markdown（忽略 `README.md`）\n3. 跳过已被 `WORKFLOW_INBOX_ITEM` 标记认领的条目\n4. 自动创建并提交一份新的 Phase PLAN，进入正常审批流程\n\nInbox 是已提交需求池，不是可执行 PLAN 目录。推荐每项一个 `ISSUE`：\n\n```bash\n/ap inbox add \"需求标题\" --body=\"范围与验收目标\" --head=<当前40位HEAD>\n```\n\n## 校验与幂等\n\n### 校验模式\n\n- `balanced`（默认）：策略规则产生 warning；结构、动作、引用和调度安全问题仍是 error\n- `strict`：策略规则也提升为 error\n\n### 幂等机制\n\n- 事件身份由 `(commit, path, blob hash, action)` 共同确定\n- cursor 记录已消费位置；pending 记录审批或待执行 PLAN\n- 两者都在 PostgreSQL 中，不写入仓库\n- 相同事件不会重复执行\n\n### Git 历史保护\n\nwatcher 已读取或可能读取提交后，Git 历史必须只追加。禁止 amend、rebase、reset 和强推改写历史。检测到 ref 改写时自动化停止并要求人工判断。\n\n## 编号规则\n\n- 宽度：3 位数字\n- 作用域：branch space（`docs/` 下）\n- 唯一性：同一 branch space 内唯一\n- 候选选择：取本轮变更中编号最高的文档\n- 无编号分支：`main`、`master`、`dev`\n- 编号目录模式：`^[0-9]{3}_[a-z0-9][a-z0-9._-]*$`\n\n## 大文件保护\n\n| 阈值 | 行为 |\n| --- | --- |\n| 800 行 | warning |\n| 1000 行 | blocking（阻止继续增长） |\n\n适用于 `.py`, `.js`, `.jsx`, `.ts`, `.tsx`, `.vue`, `.java`, `.go`, `.rs`, `.cs`, `.php`, `.rb` 等源码文件。\n\n## Bug 分叉与返回\n\n- **小 bug**（不阻塞当前 Slice）：写入 ISSUE 或 Bugfix Queue，不打断主线\n- **大型阻塞 bug**：\n  1. 父 Slice 写一次 `paused` HANDOVER\n  2. 创建 `plan_kind: interrupt` 的嵌套 PLAN，记录 `parent_plan`、`parent_slice`、`return_to`\n  3. 嵌套 PLAN 最终 HANDOVER 使用 `resume_parent` 返回精确父 Slice\n  4. 未被预先授权的嵌套 PLAN 默认为 `await_plan_approval`\n\n## 代码入口\n\n| 文件 | 职责 |\n| --- | --- |\n| `src/lib/scheduled-jobs/workflow-watcher.ts` | 扫描、校验、审批门、执行与终止动作 |\n| `src/lib/scheduled-jobs/workflow-autonomy.ts` | 自治模式判定 |\n| `src/lib/scheduled-jobs/workflow-roadmap-inbox.ts` | Roadmap/Inbox 选取与 PLAN 提案 |\n| `src/lib/scheduled-jobs/workflow-validator.ts` | 合同解析与文档校验 |\n| `src/lib/scheduled-jobs/workflow-status.ts` | 状态与唯一下一步 |\n| `src/lib/scheduled-jobs/workflow-inspection.ts` | Dashboard 队列与文档检查 |\n| `src/lib/scheduled-jobs/git-history-guard.ts` | 只追加历史保护 |\n| `src/lib/acpx/workflow-completion-gate.ts` | Session 完成门 |\n| `src/lib/feishu-workflow-policy.ts` | 飞书自治模式和权限操作 |\n| `src/lib/feishu-scheduled-jobs.ts` | Workflow Dashboard 与 Scheduled Job 命令 |\n\n## 常用操作\n\n```bash\n# 仓库内校验\nnpm run workflow:validate -- HEAD docs/<编号>_PLAN_<日期>_<主题>.md\nnpm run check:long-files\n\n# watcher 控制\n/ap job enable workflow-watcher\n/ap job disable workflow-watcher\n/ap job run workflow-watcher\n/ap job diagnose workflow-watcher\n\n# 自治模式\n/ap workflow autonomy show\n/ap workflow autonomy set manual --head=<40位HEAD>\n/ap workflow autonomy set semi_auto --head=<40位HEAD>\n/ap workflow autonomy set auto --head=<40位HEAD>\n\n# 状态与恢复\n/ap workflow status\n/ap job cursor workflow-watcher --latest\n/ap job cursor workflow-watcher --clear-pending\n```\n\n## 维护规则\n\n更新规则时按职责修改，不重复维护：\n\n| 内容 | 修改位置 |\n| --- | --- |\n| 合法字段、动作、模板路径、编号、阈值 | `workflow-contract.yaml` |\n| 合格示例 | `templates/PLAN.md`、`templates/HANDOVER.md` |\n| 人类流程说明 | `AUTOMATION_GUIDE.md` 与本目录 README |\n| 历史决策 | 编号 DECISION 文档 |\n| 操作验收证据 | 编号 REPORT |\n| 缺陷根因与验证 | 编号 FIX |\n\n修改实现后运行对应的 `test:workflow-*` 聚焦测试；提交前运行 GitNexus `detect_changes()` 核对影响范围。","docs":"# docs\n\n\n\n# docs\n\n## 模块概述\n\n`docs/` 是 Agent Platform 的**机构记忆层**，承载从架构设计、需求收集、工作流自动化到运维修复的完整项目演进记录。它不是静态参考文档，而是一套**以 Git 已提交内容为事件源**的协作协议——每个子目录承担工作流生命周期中不同阶段的角色。\n\n## 子模块关系\n\n```mermaid\ngraph TD\n    subgraph \"上游输入\"\n        ARCH[architecture<br/>架构方向指引]\n        INBOX[inbox<br/>候选需求收件箱]\n    end\n\n    subgraph \"核心引擎\"\n        WF[workflow<br/>状态机 + 规则源]\n    end\n\n    subgraph \"下游输出\"\n        KIT[workflow-kit<br/>可拷贝模板]\n        NOTES[workflow-bugfix-notes<br/>事后修复记录]\n    end\n\n    subgraph \"时间线主干\"\n        ROOT[docs 根目录<br/>编号交接文档]\n    end\n\n    ARCH -->|\"PLAN 依据\"| WF\n    INBOX -->|\"PLAN 阶段扫描\"| WF\n    WF -->|\"模板化输出\"| KIT\n    WF -->|\"运行中问题闭环\"| NOTES\n    WF -->|\"阶段结束状态\"| ROOT\n    ROOT -->|\"历史上下文\"| WF\n```\n\n## 子模块定位\n\n| 子模块 | 角色 | 详见 |\n|--------|------|------|\n| [docs 根目录](docs.md) | 按时间线编号的交接协议，记录每次会话/阶段的结束状态 | `00`–`13` 早期架构，`100`+ 后期迭代 |\n| [architecture](architecture.md) | V2 统一 Agent Runtime 的架构方向指引，定义消息流与配置体系重构方向 | 核心文档：`agent-platform-v2_unified-agent-architecture_handover.md` |\n| [inbox](inbox.md) | Workflow `auto` 模式的 Git 收件箱，存储候选需求（ISSUE / ROADMAP） | 命名：`NNN_TYPE_YYYYMMDD_标题.md` |\n| [workflow](workflow.md) | 文档驱动工作流自动化的**规则源与操作入口**，定义状态机、审批与执行语义 | 核心文件：`workflow-contract.yaml`、`AUTOMATION_GUIDE.md` |\n| [workflow-kit](workflow-kit.md) | 可拷贝的模板目录，将 workflow 接入任意新仓库 | 包含 `workflow-contract.yaml`、PLAN/HANDOVER 模板、`AGENTS-workflow-section.md` |\n| [workflow-bugfix-notes](workflow-bugfix-notes.md) | Session 换代系统的事后修复记录归档 | 涉及 `feishu-workflow.ts`、`workflow-session-rotation.ts` 等组件 |\n\n## 跨子模块的关键工作流\n\n### 需求 → 执行 → 交接\n\n```\ninbox 候选需求\n    ↓  PLAN 阶段扫描\nworkflow 状态机（校验 → 审批 → 执行）\n    ↓  Slice 完成\nHANDOVER 文档提交\n    ↓  阶段结束\ndocs 根目录编号文档（交接状态固化）\n```\n\n- **inbox** 提供原始需求，由 `workflow` 的 watcher 在 PLAN 阶段自动扫描并提议转化为可执行 PLAN。\n- **architecture** 为 PLAN 提供架构约束——例如统一 Agent Runtime 的消息流设计决定了 Slice 的划分粒度。\n- **workflow** 的 `workflow-contract.yaml` 是唯一机器可读规则源，所有自动化行为（编号、阈值、合法动作）均从中读取。\n- 阶段结束后，状态固化到 **docs 根目录**的编号文档中，成为下一次会话的精确起点。\n\n### 模板化扩展\n\n当需要将工作流接入新仓库时，**workflow-kit** 提供带 `[CHANGE-ME]` 占位符的完整模板集。其设计原则与 **workflow** 一致：规则值来自目标 Git ref 中已提交的合同，watcher 只读已提交内容。\n\n### 故障闭环\n\n**workflow-bugfix-notes** 记录的是 **workflow** 运行中 Session 换代机制的边界条件问题。每篇记录遵循\"现象 → 根因 → 修复 → 验证 → 运维备注\"的闭环结构，为后续排查提供模式参考。","overview":"# agent-platform-v2 — Wiki\n\n\n\n# Agent Platform v2\n\nAgent Platform v2 是一个基于 **Next.js 14** 的控制面平台，用于编排和协调本地、远程及聊天集成的 AI Agent 执行。它提供 ACPX 任务运行、Live Room 实时协作、飞书/Lark 消息集成、远程 SSH 执行以及面向工作区的任务视图。\n\n## 核心能力\n\n- **ACPX 任务引擎** — 统一调度本地和远程 Agent 执行，支持 Codex、Claude Code、Antigravity、Gemini CLI、DeepSeek、Pi Agent 等多种 harness\n- **Live Room** — 多参与者实时协作房间，支持用户、系统和助手消息，带上下文水印和权限展示\n- **飞书/Lark 集成** — 长连接 + Webhook 双通道，支持卡片交互、命令解析、权限审批\n- **远程 Runner** — 通过 SSH 在远程机器上注册和运行 Agent 节点\n- **工作流自动化** — 基于 `docs/` 目录的状态机驱动开发流程\n\n## 架构总览\n\n```mermaid\ngraph TB\n    MW[\"中间件<br/>认证 / 授权拦截\"]\n    API[\"API 路由<br/>src/app\"]\n    ACPX[\"ACPX 执行引擎<br/>src/lib/acpx\"]\n    FEISHU[\"飞书集成<br/>src/lib/feishu*\"]\n    ROOM[\"Live Room<br/>src/lib/live-room*\"]\n    UI[\"UI 组件<br/>src/components\"]\n    DB[\"数据库<br/>Prisma + SQLite/PG\"]\n    REMOTE[\"远程 Runner<br/>scripts/remote-runner*\"]\n    CONFIG[\"配置层<br/>config/\"]\n    SKILLS[\"技能定义<br/>skills/\"]\n\n    MW --> API\n    API --> ACPX\n    API --> FEISHU\n    API --> ROOM\n    API --> UI\n    ACPX --> DB\n    FEISHU --> ROOM\n    ROOM --> DB\n    ACPX --> REMOTE\n    CONFIG --> ACPX\n    SKILLS --> ACPX\n```\n\n## 请求处理链路\n\n一次典型的请求从浏览器或飞书进入后，经过以下路径：\n\n1. **中间件**（`src/src/middleware.ts`）拦截请求，完成认证和授权校验\n2. **API 路由**（`src/app/api/`）解析请求参数，分发到对应业务逻辑\n3. **业务逻辑层**（`src/lib/`）执行核心操作——无论是 ACPX 任务调度、飞书命令处理还是 Live Room 状态变更\n4. **数据层**（`prisma/`）通过 Prisma ORM 持久化状态\n\n飞书侧的入口则通过长连接或 Webhook 直接调用 `src/lib/feishu.ts` 中的命令处理器，再路由到 Live Room 或任务绑定逻辑。\n\n## 关键端到端流程\n\n### 飞书卡片交互 → 任务绑定\n\n用户在飞书中点击卡片按钮时，`buildCardActionHandler`（`src/lib/feishu-long-connection.ts`）接收事件，通过 `getBoundLiveRoom` 解析目标房间，再经 `resolveFeishuTaskConversation` 和 `scopeKey` 确定任务上下文，最终触发对应的 Agent 执行。\n\n### 飞书命令 → Agent 选择\n\n当用户在 Live Room 中发送命令时，`handleRoomCommand`（`src/lib/feishu-live-room-commands.ts`）解析指令，调用 `resolveFeishuSelectedAgentIds` 确定目标 Agent，再通过 `deriveGatewayHarnessOptions` 和 `ensurePlatformLocalAgents` 构建执行选项，最终由 ACPX 引擎调度执行。\n\n### 远程节点注册与执行\n\n远程机器通过 `scripts/register-remote-node.ts` 向 Gateway 注册自身，Gateway 维护节点状态。当 ACPX 引擎需要远程执行时，通过 SSH 通道将任务下发到对应节点。\n\n## 模块导航\n\n- **[src](src.md)** — 应用源码，包含中间件、API 路由、业务逻辑、UI 组件和类型定义\n- **[config](config.md)** — 声明式配置，定义项目注册表、飞书参数和定时任务编排\n- **[prisma](prisma.md)** — 数据库 Schema 和迁移历史\n- **[scripts](scripts.md)** — 辅助脚本，涵盖飞书集成、远程节点管理、工作流验证等\n- **[skills](skills.md)** — 为各类 Agent 提供的标准化操作指南\n- **[tests](tests.md)** — 分层测试基础设施，从单元测试到 Playwright E2E\n- **[deploy](deploy.md)** — systemd 服务定义，用于生产环境部署\n- **[docs](docs.md)** — 项目演进记录和工作流状态机\n- **[plans](plans.md)** — 开发阶段计划与进展跟踪\n\n## 快速开始\n\n### 环境要求\n\n- Node.js 20+\n- npm\n- 本地 SQLite（开发）或 PostgreSQL（生产）\n\n### 安装与启动\n\n```bash\n# 安装依赖\nnpm install\n\n# 运行数据库迁移（开发环境使用 SQLite）\nnpm run db:migrate:sqlite\n\n# 启动开发服务器\nnpm run dev\n```\n\n### 常用脚本\n\n| 命令 | 用途 |\n|------|------|\n| `npm run dev` | 启动 Next.js 开发服务器 |\n| `npm run feishu:runtime` | 启动飞书长连接运行时 |\n| `npm run scheduled-jobs:runtime` | 启动定时任务调度器 |\n| `npm run remote-runner:gateway` | 启动远程 Runner Gateway |\n| `npm run build` | 生产构建 |\n| `npm run lint` | 代码检查 |\n\n### 测试\n\n```bash\n# 运行特定模块测试\nnpm run test:auth-users\nnpm run test:workflow-validator\nnpm run test:remote-node-ws\n\n# 运行 E2E 测试（需要应用已启动）\nnpx playwright test\n```\n\n## 技术栈\n\n| 层级 | 技术 |\n|------|------|\n| 框架 | Next.js 14 + React 18 |\n| 语言 | TypeScript 5.x |\n| ORM | Prisma 5 |\n| 数据库 | SQLite（开发）/ PostgreSQL（生产） |\n| 实时通信 | Socket.IO 4.x |\n| 飞书 SDK | @larksuiteoapi/node-sdk |\n| 样式 | Tailwind CSS 3.x |\n| 测试 | Playwright + Node.js 原生 assert |","plans":"# plans\n\n\n\n# Plans 模块\n\n`plans/` 目录是 Agent Platform v2 项目的**计划管理目录**，用于记录每个开发阶段的完整计划、进展日志和状态跟踪。每个计划文件对应一个开发阶段，采用 Markdown 格式，包含 Features 列表、时间线、进展日志和阻塞问题等结构化信息。\n\n---\n\n## 文件命名规范\n\n```\nplans/{序号}_{创建日期}_{阶段名}_{主题}.md\n```\n\n| 字段 | 示例 | 说明 |\n|------|------|------|\n| 序号 | `001`, `002` | 三位数字，按创建顺序递增 |\n| 创建日期 | `2026-03-15` | 计划创建日期 |\n| 阶段名 | `阶段 2` | 所属开发阶段 |\n| 主题 | `Agent 集成` | 阶段核心主题 |\n\n当前文件：\n\n| 文件 | 阶段 | 状态 |\n|------|------|------|\n| `001_2026-03-15_阶段 2_Agent 集成.md` | 阶段 2 | ✅ 已完成 (12/12) |\n| `002_2026-03-20_阶段 3_控制平面增强.md` | 阶段 3 | 🟡 进行中 (1.5/10) |\n\n---\n\n## 计划文档结构\n\n每个计划文件遵循统一的结构模板：\n\n```\n# 阶段标题\n├── 元信息（创建时间、项目、状态、进度）\n├── Features 列表（表格：编号、名称、优先级、状态、预计/实际时间）\n├── 阶段目标（核心目标 + 成功标准 checklist）\n├── 进展日志（按时间倒序，记录每次关键事件）\n├── 阻塞问题（表格：问题、发现时间、状态、需要决策）\n├── 下一步行动（立即执行 + 等待确认）\n├── 自主推进规则（行为矩阵 + 汇报格式）\n└── 相关文档（链接到 STATUS.md、docs/ 等）\n```\n\n### 关键设计决策\n\n- **进展日志按时间倒序排列**：最新事件在最上方，方便快速定位当前状态\n- **Features 使用表格**：支持快速扫描整体进度\n- **阻塞问题独立成表**：明确区分\"可自主推进\"和\"需要用户决策\"的事项\n- **自主推进规则显式声明**：定义 Agent 在无人干预时的行为边界\n\n---\n\n## 阶段生命周期\n\n```mermaid\ngraph LR\n    A[创建计划] --> B[自主推进 Features]\n    B --> C{遇到阻塞?}\n    C -->|否| B\n    C -->|是| D[汇报 + 等待确认]\n    D --> B\n    B --> E[阶段结项]\n    E --> F[创建下一阶段计划]\n```\n\n每个阶段遵循以下流程：\n\n1. **创建**：定义 Features 列表、优先级、时间线\n2. **推进**：按优先级顺序完成 Features，每次完成后更新进展日志\n3. **阻塞处理**：遇到需要用户决策的问题时暂停并汇报\n4. **结项**：所有 Features 完成后标记为已完成，记录最终进度\n\n---\n\n## 阶段 2：Agent 集成与跨网关通信（已完成）\n\n**时间范围**: 2026-03-10 ~ 2026-03-20  \n**最终进度**: 12/12 (100%)\n\n### 核心交付物\n\n| 类别 | 交付内容 |\n|------|----------|\n| Agent 集成 | Codex + Claude Code 真实 Agent 接入 |\n| 群聊协作 | @提及功能、Agent 自动响应 |\n| 任务编排 | 任务 CRUD、多 Agent 分配、状态跟踪 |\n| Gateway 架构 | Node → Gateway 模型重构、Token 认证、消息路由 |\n| 安全 | AES-256-GCM Token 加密存储 |\n| 测试 | Playwright E2E 框架（18 个测试用例） |\n\n### 关键技术实现\n\n- **Gateway 模型重构**：`Node` 表重命名为 `Gateway`，新增 `url`、`token` 字段；`Agent.nodeId` → `Agent.gatewayId`\n- **Token 认证**：`/api/gateways/token` (POST/GET/DELETE) + `src/lib/gateway-auth.ts` 中间件\n- **消息路由**：`src/lib/gateway-router.ts`，发送端点 `/api/gateways/messages/send`，接收端点 `/api/gateways/messages/incoming`\n- **加密存储**：`src/lib/encryption.ts`，AES-256-GCM 算法\n\n### 遗留问题\n\n| 问题 | 影响 |\n|------|------|\n| Linux Gateway 消息 API 端点不匹配 | 跨网关消息路由无法端到端验证 |\n| UI 测试选择器需优化 | 12/18 E2E 测试未通过 |\n\n---\n\n## 阶段 3：控制平面增强（进行中）\n\n**创建日期**: 2026-03-20  \n**当前进度**: 1.5/10 (15%)\n\n### Features 概览\n\n| 优先级 | Features | 状态 |\n|--------|----------|------|\n| P0 | Control Plane 集成测试、Linux Gateway 通信修复、Gateway 状态监控面板、消息路由日志 | 1 完成, 1 部分完成, 2 待开始 |\n| P1 | Dashboard 性能优化、通知系统、搜索功能 | 待开始 |\n| P2 | 任务模板系统、Agent 能力标签、批量操作 | 待开始 |\n\n### 当前阻塞\n\n**Linux Gateway 通信修复**（Feature 2）部分完成：\n- ✅ 连接测试通过（Ping 19ms，端口 18789 开放）\n- ✅ Health Check 通过（`/health` 返回 live）\n- ❌ 消息 API 端点不匹配（预期 `/api/messages/incoming` 返回 404）\n\n**解决方向**：等待 Linux-Agent 确认 API 配置，或改用 Feishu 群聊通信作为替代方案。\n\n### 团队分工\n\n| 角色 | Agent | 职责 |\n|------|-------|------|\n| Orchestrator | HK-vision (Main) | 项目编排、进度跟踪、文档维护 |\n| Coder | Claude Code (ACPX) | 主要编码工作 |\n| QA | Gemini 2.5 Flash | 测试审阅、边界条件检查 |\n| Researcher | Kimi K2.5 | 技术调研、方案对比 |\n\n---\n\n## 自主推进机制\n\n计划文档中显式定义了 Agent 的自主推进规则：\n\n| 场景 | 行为 |\n|------|------|\n| Feature 完成 | 自动开始下一个 Feature + 群聊汇报 |\n| 遇到阻塞问题 | 汇报 + 等待用户确认 |\n| 用户长时间无回复 | 继续自主推进（默认继续） |\n| 用户明确打断 | 暂停当前任务，响应用户 |\n\n**标准汇报格式**：\n\n```\n✅ Feature X 完成\n📊 进度：X/12 (XX%)\n⏭️ 自动开始 Feature X+1\n🔜 预计完成时间：XX 分钟\n```\n\n---\n\n## 与项目其他部分的关系\n\n| 关联文件/目录 | 关系 |\n|---------------|------|\n| `STATUS.md` | 项目总体状态，plans 中的进度数据汇总于此 |\n| `HEARTBEAT.md` | 心跳检查流程，引用 plans 确认当前任务 |\n| `docs/ARCHITECTURE_REVIEW.md` | 架构审查文档，阶段 2 中产出 |\n| `docs/CROSS_GATEWAY_REGISTRATION.md` | 跨网关注册指南 |\n| `CONTROL_PLANE_STATUS.md` | Control Plane 实施状态，阶段 3 核心参考 |\n| `tests/e2e/` | E2E 测试，各 Feature 的验证产物 |\n| `memory/YYYY-MM-DD.md` | 当天详细记录，plans 进展日志的补充 |\n\n**唤醒规则**：每次会话启动时，Agent 读取当前计划文件 → 检查进展日志确认最后完成的任务 → 继续执行下一个待办 → 更新进展日志。这确保了跨会话的连续性。","prisma":"# prisma\n\n\n\n# Prisma 数据库 Schema\n\n## 概述\n\n本模块定义了系统的完整数据层，基于 **Prisma ORM** + **PostgreSQL**。包含：\n\n- `schema.prisma` — 所有数据模型的 Prisma 定义\n- `migrations/` — 数据库迁移历史（从 SQLite 到 PostgreSQL 的完整演进）\n- `seed.ts` — 开发环境种子数据\n\n数据库通过环境变量 `DATABASE_URL` 连接，使用 `cuid()` 作为主键生成策略。\n\n## 数据域总览\n\n```mermaid\nerDiagram\n    Gateway ||--o{ Agent : \"托管\"\n    Gateway ||--o{ ControlPlaneState : \"状态\"\n    Task ||--o{ TaskSession : \"会话\"\n    TaskSession ||--o{ TaskRun : \"执行\"\n    TaskRun ||--o{ TaskRunParticipant : \"参与者\"\n    TaskRun ||--o{ TaskRunEvent : \"事件流\"\n    LiveRoom ||--o{ LiveRoomMember : \"成员\"\n    LiveRoomMember ||--o{ LiveRoomMemberSession : \"会话\"\n    LiveRoomMemberSession ||--o{ LiveRoomDelivery : \"投递\"\n    LiveRoom ||--o{ FeishuConversationBinding : \"飞书绑定\"\n    User ||--o{ Task : \"拥有\"\n    User ||--o{ LiveRoom : \"拥有\"\n```\n\n系统数据按以下领域划分：\n\n| 领域 | 核心模型 | 职责 |\n|------|---------|------|\n| 基础设施 | `Gateway`, `RemoteHarnessHost`, `RemoteNode`, `ControlPlaneState` | 节点注册、资源发现、健康监控 |\n| 任务执行 | `Task`, `TaskSession`, `TaskRun`, `TaskRunParticipant`, `TaskRunEvent` | 任务生命周期、多参与者编排、事件流 |\n| 实时房间 | `LiveRoom`, `LiveRoomMember`, `LiveRoomMessage`, `LiveRoomMemberSession`, `LiveRoomDelivery` | 多 Agent 协作讨论、消息投递 |\n| 飞书集成 | `FeishuConversationBinding`, `FeishuUserAccess`, `FeishuGroupBroadcast` 等 | 飞书群/DM 与 LiveRoom 的映射、权限审批、群广播 |\n| 跨网关通信 | `GatewayMessage`, `IncomingGatewayMessage`, `CrossGatewayChatSession` | 网关间消息传递、跨网关对话 |\n| 调度 | `ScheduledJobState`, `ScheduledJobRun`, `ScheduledJobRequest`, `WorkflowDispatch` | 定时任务状态、执行记录、工作流分发 |\n| 用户与认证 | `User`, `PairingTicket` | Web 认证、设备配对 |\n| 聊天 | `ChatRoom`, `Message` | 基础聊天室（早期设计） |\n\n## 基础设施层\n\n### Gateway\n\n网关是 Agent 的宿主节点，提供 API 端点和资源信息。\n\n```prisma\nmodel Gateway {\n  id              String   @id @default(cuid())\n  name            String\n  url             String?  // Gateway API URL\n  token           String?  // 认证 token（加密存储）\n  openclawToken   String?  // OpenClaw HTTP API token\n  ip              String?  // 兼容旧字段\n  status          String   @default(\"offline\") // online, offline, maintenance\n  resources       String?  // JSON: { cpu, memory, disk }\n}\n```\n\n### Agent\n\nAgent 是执行任务的基本单元，可归属于某个 Gateway。\n\n```prisma\nmodel Agent {\n  id             String   @id @default(cuid())\n  name           String\n  runtimeAgentId String?  // 运行时标识\n  type           String\n  status         String   @default(\"offline\") // online, offline, busy, error\n  lastHeartbeat  DateTime @default(now())\n  gatewayId      String?\n  // 身份管理字段\n  userNickname   String?  // 用户自定义昵称\n  roleDescription String? // 角色描述\n  colorTag       String?  // UI 颜色标签\n  emojiIcon      String?  // 表情图标\n  hostname       String?  // 服务器主机名\n}\n```\n\nAgent 与 Task 之间是**多对多**关系（通过 Prisma 隐式中间表 `_AgentToTask`）。\n\n### RemoteHarnessHost\n\n远程 SSH 执行主机，用于在远程机器上运行 harness。\n\n```prisma\nmodel RemoteHarnessHost {\n  id                 String   @id @default(cuid())\n  label              String\n  host               String\n  port               Int      @default(22)\n  sshUser            String\n  authType           String   @default(\"ssh_key\")\n  encryptedPrivateKey String?\n  viaNetwork         String   @default(\"wireguard\") // wireguard, lan, public\n  supportedHarnesses String?  // JSON 数组\n}\n```\n\n### RemoteNode\n\n通过 WebSocket 注册的远程节点（较新设计，替代部分 Gateway 功能）。\n\n```prisma\nmodel RemoteNode {\n  id        String   @id @default(cuid())\n  name      String   @unique\n  host      String\n  secretHash String\n  status    String   @default(\"offline\")\n  lastSeen  DateTime?\n  ownerUserId String?\n}\n```\n\n### ControlPlaneState\n\n每个 Gateway 的控制平面状态，用于负载均衡和健康检查。`gatewayId` 是唯一约束，保证每个网关只有一条状态记录。\n\n```prisma\nmodel ControlPlaneState {\n  id               String   @id @default(cuid())\n  gatewayId        String   @unique\n  status           String   @default(\"offline\")\n  loadScore        Float    @default(0)  // 0-100，越低越好\n  latency          Int      @default(0)  // ms\n  consecutiveFails Int      @default(0)\n}\n```\n\n## 任务执行层\n\n任务执行是系统的核心流程，采用 **Task → TaskSession → TaskRun → TaskRunParticipant** 的层级结构。\n\n### 层级关系\n\n```\nTask (任务定义)\n └── TaskSession (会话，可多次执行)\n      └── TaskRun (单次执行)\n           └── TaskRunParticipant (参与者)\n                └── TaskRunEvent (事件流)\n```\n\n### Task\n\n```prisma\nmodel Task {\n  id                   String   @id @default(cuid())\n  name                 String\n  status               String   @default(\"pending\") // pending, running, completed, failed\n  executionMode        String   @default(\"standard\") // standard, acpx\n  workingDirectory     String?\n  currentTaskSessionId String?  // 指向当前活跃会话\n  ownerUserId          String?\n  result               String?  // JSON\n  error                String?\n}\n```\n\n### TaskSession\n\n会话是 Task 的一次\"对话上下文\"，一个 Task 可以有多个 Session（例如用户重新发起）。\n\n```prisma\nmodel TaskSession {\n  id             String   @id @default(cuid())\n  taskId         String\n  status         String   @default(\"active\") // active, waiting_user, paused, completed, failed\n  attentionState String   @default(\"normal\") // normal, needs_review, needs_user_input, stuck, error\n  activeRunId    String?  // 当前活跃 Run\n}\n```\n\n### TaskRun\n\n单次执行实例，包含编排模式和状态机。\n\n```prisma\nmodel TaskRun {\n  id                String   @id @default(cuid())\n  taskId            String\n  taskSessionId     String?\n  mode              String   @default(\"acpx\")\n  orchestrationMode String   @default(\"single\") // single, staged\n  status            String   @default(\"pending\")\n  controlState      String   @default(\"normal\") // normal, interrupt_requested, stop_requested\n  activityState     String   @default(\"quiet\")  // streaming, quiet, stalled, waiting_user, terminating\n  watchdogConfig    String?  // JSON\n}\n```\n\n### TaskRunParticipant\n\n执行中的参与者，可以是本地 Agent 或远程 Gateway Agent。\n\n```prisma\nmodel TaskRunParticipant {\n  id                   String   @id @default(cuid())\n  taskRunId            String\n  executionBackend     String   @default(\"gateway_openclaw\") // platform_local, gateway_openclaw\n  harnessType          String\n  role                 String\n  status               String   @default(\"pending\")\n  activityState        String   @default(\"quiet\")\n  interruptSupported   Boolean  @default(false)\n  resumeSupported      Boolean  @default(false)\n  sessionControlSupported Boolean @default(false)\n  softStopSupported    Boolean  @default(false)\n}\n```\n\n### TaskRunEvent\n\n事件流记录，按 `sequence` 排序，支持 `tier` 字段区分摘要和详细级别。\n\n```prisma\nmodel TaskRunEvent {\n  id           String   @id @default(cuid())\n  taskRunId    String\n  participantId String?\n  sequence     Int\n  eventType    String\n  stream       String   @default(\"system\") // system, stdout, stderr\n  tier         String   @default(\"summary\") // summary, detail\n  content      String\n}\n```\n\n### TaskRunControlMessage\n\n用户向运行中任务发送的控制消息（如中断、停止、追加指令）。\n\n```prisma\nmodel TaskRunControlMessage {\n  id             String   @id @default(cuid())\n  taskId         String\n  taskRunId      String\n  participantId  String?\n  senderUserId   String\n  deliveryMode   String   @default(\"queued\") // queued, immediate\n  deliveryStatus String   @default(\"pending\") // pending, delivered, superseded, rejected\n  controlAction  String   @default(\"queue_message\") // queue_message, interrupt_now, stop_run\n  content        String\n}\n```\n\n### TaskRunInteractionRequest\n\nHarness 向用户发起的交互请求（如确认操作、选择选项）。\n\n```prisma\nmodel TaskRunInteractionRequest {\n  id           String   @id @default(cuid())\n  taskRunId    String\n  participantId String?\n  source       String   @default(\"harness\") // harness, system\n  requestKind  String\n  status       String   @default(\"pending\") // pending, approved, denied, answered, expired, cancelled\n  message      String\n  optionsJson  String?\n  expiresAt    DateTime?\n}\n```\n\n## 实时房间层\n\nLiveRoom 是多 Agent 协作讨论的核心，支持消息投递、会话管理和 handoff 机制。\n\n### LiveRoom\n\n```prisma\nmodel LiveRoom {\n  id                     String   @id @default(cuid())\n  title                  String\n  mode                   String   @default(\"discussion\") // discussion, execution, hybrid\n  status                 String   @default(\"active\") // active, archived\n  sourceTaskId           String?  // 可选关联到 Task\n  currentSpeakerMemberId String?\n  workingDirectory       String?\n  handoffLimit           Int      @default(4)\n  executionTimeoutMs     Int?     // 房间级执行超时（毫秒），null 使用后端默认值\n  ownerUserId            String?\n}\n```\n\n### LiveRoomMember\n\n房间成员，可以是用户、本地 Agent、网关 Agent 或系统。\n\n```prisma\nmodel LiveRoomMember {\n  id           String   @id @default(cuid())\n  roomId       String\n  memberType   String   @default(\"user\") // user, local_agent, gateway_agent, system\n  displayName  String\n  role         String   @default(\"custom\")\n  specialty    String?  // documentation, diagnostics, implementation, general\n  backend      String?  // platform_local, gateway_openclaw\n  joinStatus   String   @default(\"joined\") // joined, invited, removed\n  presenceStatus String @default(\"idle\")   // idle, online, busy, offline\n  canReply     Boolean  @default(false)\n  sortOrder    Int      @default(0)\n  // 身份管理\n  userNickname String?\n  shortAlias   String?  // 用于 @提及\n  // 执行配置\n  acpxPermissionConfig String?\n  codexModel           String?\n  codexReasoningEffort String?\n}\n```\n\n### LiveRoomMessage\n\n房间消息，支持回复链和 handoff 追踪。\n\n```prisma\nmodel LiveRoomMessage {\n  id               String   @id @default(cuid())\n  roomId           String\n  senderMemberId   String?\n  replyToMessageId String?  // 自引用，形成回复链\n  messageType      String   @default(\"user\") // user, assistant, system, tool, topic, control\n  visibility       String   @default(\"room\") // room, system\n  content          String\n  // Handoff 字段\n  handoffRootMessageId  String?\n  handoffLimitSnapshot  Int?\n  handoffCount          Int    @default(0)\n  handoffClaimStatus    String?\n  handoffTargetMemberId String?\n}\n```\n\n### LiveRoomMemberSession\n\n成员的后端会话，记录连接状态和能力。\n\n```prisma\nmodel LiveRoomMemberSession {\n  id                    String   @id @default(cuid())\n  roomId                String\n  memberId              String\n  backend               String   // platform_local, gateway_openclaw\n  sessionKey            String\n  status                String   @default(\"online\") // online, offline, busy, expired\n  supportsStreaming     Boolean  @default(false)\n  supportsAppendMessage Boolean  @default(true)\n  supportsInterrupt     Boolean  @default(false)\n  lastHeartbeatAt       DateTime?\n  lastDeliveredAt       DateTime?\n}\n```\n\n### LiveRoomDelivery\n\n消息投递记录，追踪每条消息到每个成员的投递状态。\n\n```prisma\nmodel LiveRoomDelivery {\n  id             String   @id @default(cuid())\n  roomMessageId  String\n  targetMemberId String\n  sessionId      String?\n  deliveryStatus String   @default(\"pending\") // pending, delivered, failed, fallback\n  fallbackReason String?\n  attemptedAt    DateTime @default(now())\n  acknowledgedAt DateTime?\n}\n```\n\n### 消息投递流程\n\n```mermaid\nsequenceDiagram\n    participant M as LiveRoomMessage\n    participant D as LiveRoomDelivery\n    participant S as LiveRoomMemberSession\n    participant A as Agent/Backend\n\n    M->>D: 创建投递记录 (pending)\n    D->>S: 查找目标成员会话\n    S->>A: 通过 sessionKey 投递\n    A-->>S: 确认接收\n    S-->>D: 更新 acknowledgedAt\n    D->>D: deliveryStatus → delivered\n```\n\n## 飞书集成层\n\n飞书集成将 LiveRoom 映射到飞书群/DM，支持权限审批、任务绑定和群广播。\n\n### FeishuConversationBinding\n\n飞书会话与 LiveRoom 的绑定关系。`scopeKey` 唯一标识一个绑定。\n\n```prisma\nmodel FeishuConversationBinding {\n  id                 String   @id @default(cuid())\n  scopeKey           String   @unique\n  chatId             String\n  chatType           String\n  appId              String?  // 任务绑定模式\n  threadId           String?\n  rootMessageId      String?\n  liveRoomId         String\n  typingReactionId   String?  // 正在输入的表情\n  typingForMessageId String?\n}\n```\n\n**约束**：`threadId` 和 `rootMessageId` 要么都为 NULL（传统群/DM 绑定），要么都非 NULL 且 `chatType = 'group'`（任务绑定模式）。\n\n### FeishuUserAccess\n\n飞书用户访问权限。\n\n```prisma\nmodel FeishuUserAccess {\n  openId        String   @id\n  status        String   @default(\"pending\") // pending, approved, denied, revoked, blocked\n  displayName   String?\n  workspaceRoot String?\n  decidedBy     String?\n  decidedAt     DateTime?\n}\n```\n\n### FeishuAdminApproval\n\n管理员审批流程（用户配对、完全访问）。\n\n```prisma\nmodel FeishuAdminApproval {\n  id              String   @id @default(cuid())\n  kind            String   // user_pairing, full_access\n  status          String   @default(\"pending\") // pending, processing, approved, denied, expired\n  requesterOpenId String\n  requesterChatId String\n  cardMessageId   String?  // 飞书卡片消息 ID\n  expiresAt       DateTime?\n}\n```\n\n### FeishuGroupBroadcast\n\n群广播：一条源消息发布到多个目标房间。\n\n```\nFeishuGroupBroadcast (源消息)\n └── FeishuGroupBroadcastTarget (发布时固定的目标快照)\n      └── FeishuGroupBroadcastMemberDelivery (每个成员的投递进度)\n```\n\n**设计要点**：`FeishuGroupBroadcastTarget` 中的 `bindingId`、`liveRoomId`、`threadId`、`rootMessageId` 是**快照字段**，不建立外键。这确保历史广播记录在绑定变更或房间删除后仍然完整。\n\n### FeishuTaskBindingRequest\n\n任务绑定的持久化创建意图。在飞书卡片线程确认之前，房间尚不存在。\n\n```prisma\nmodel FeishuTaskBindingRequest {\n  id               String   @id @default(cuid())\n  appId            String\n  chatId           String\n  sourceMessageId  String\n  title            String\n  workingDirectory String\n  rootMessageId    String?\n  bindingId        String?  @unique\n}\n```\n\n### FeishuProcessedMessage\n\n已处理的飞书消息去重表，以 `messageId` 为主键。\n\n## 跨网关通信\n\n### GatewayMessage / IncomingGatewayMessage\n\n网关间消息传递。`GatewayMessage` 是出站消息，`IncomingGatewayMessage` 是入站消息。\n\n```prisma\nmodel GatewayMessage {\n  fromGatewayId String\n  toGatewayId   String\n  type          String   @default(\"direct\") // direct, broadcast, request\n  payload       String   // JSON\n  status        String   @default(\"pending\") // pending, sent, delivered, failed\n}\n```\n\n### CrossGatewayChatSession\n\n跨网关对话会话，记录两个网关 Agent 之间的多轮对话。\n\n```prisma\nmodel CrossGatewayChatSession {\n  id            String   @id @default(cuid())\n  fromGatewayId String\n  toGatewayId   String\n  fromAgentId   String   @default(\"main\")\n  toAgentId     String   @default(\"main\")\n  prompt        String\n  turns         Int      @default(2)\n  status        String   @default(\"completed\")\n}\n```\n\n## 调度层\n\n### ScheduledJobState\n\n每个项目-任务组合的调度状态（唯一约束 `projectId + jobId`）。\n\n```prisma\nmodel ScheduledJobState {\n  id               String   @id @default(cuid())\n  projectId        String\n  jobId            String\n  enabledOverride  Boolean?\n  modeOverride     String?\n  scheduleOverride String?\n  lastScheduledAt  DateTime?\n  lastStartedAt    DateTime?\n  lastFinishedAt   DateTime?\n  lastSuccessAt    DateTime?\n  lastError        String?\n  cursorJson       Json?\n  workflowAutonomy Json?\n}\n```\n\n### ScheduledJobRun\n\n每次执行的记录，`idempotencyKey` 唯一约束防止重复执行。\n\n```prisma\nmodel ScheduledJobRun {\n  id             String   @id @default(cuid())\n  projectId      String\n  jobId          String\n  trigger        String\n  mode           String\n  status         String\n  scheduledFor   DateTime\n  startedAt      DateTime\n  finishedAt     DateTime?\n  idempotencyKey String   @unique\n}\n```\n\n### ScheduledJobRequest\n\n调度请求队列，用于解耦触发和执行。\n\n```prisma\nmodel ScheduledJobRequest {\n  id          String   @id @default(cuid())\n  projectId   String\n  jobId       String\n  status      String   @default(\"pending\") // pending, processing, completed, failed\n  requestedAt DateTime @default(now())\n  claimedAt   DateTime?\n  finishedAt  DateTime?\n}\n```\n\n### WorkflowDispatch\n\n工作流分发状态机，追踪每个事件的分发进度。\n\n```prisma\nmodel WorkflowDispatch {\n  id        String   @id @default(cuid())\n  projectId String\n  jobId     String\n  eventKey  String\n  state     String   @default(\"prepared\")\n  roomId    String?\n  feishuMessageId String?\n  messageId String?\n}\n```\n\n状态流转：`prepared` → `rotation_not_required` / `rotation_checkpoint_prepared` → `rotation_confirmation_posting` → `rotation_confirmation_required` → `rotation_pending` → `rotation_completed` → `session_reset` → `feishu_posted` → `prompt_posted` → `reply_queued`\n\n## 用户与认证\n\n### User\n\nWeb 认证用户。\n\n```prisma\nmodel User {\n  id           String   @id @default(cuid())\n  username     String   @unique\n  passwordHash String\n  role         String   @default(\"user\") // admin, user\n  displayName  String?\n}\n```\n\nUser 是 `Task`、`LiveRoom`、`RemoteNode` 的可选所有者（`ownerUserId` 外键，`ON DELETE SET NULL`）。\n\n### PairingTicket\n\n设备配对票据，用于安全地关联远程节点到用户。\n\n```prisma\nmodel PairingTicket {\n  id          String   @id @default(cuid())\n  tokenHash   String   @unique\n  ownerUserId String?\n  expiresAt   DateTime\n  consumedAt  DateTime?\n}\n```\n\n## 迁移历史\n\n数据库经历了从 **SQLite** 到 **PostgreSQL** 的迁移。关键迁移节点：\n\n| 迁移 | 说明 |\n|------|------|\n| `20260308075929_init` | 初始 schema（SQLite）：Agent, Node, Task |\n| `20260309142041_add_chat` | 添加 ChatRoom, Message |\n| `20260321090000_add_openclaw_token` | Gateway 添加 openclawToken |\n| `20260321180556_add_cross_gateway_chat_history` | 跨网关对话 |\n| `20260325093000_add_live_rooms` | LiveRoom 完整体系 |\n| `20260325110000_add_remote_harness_hosts` | 远程 SSH 主机 |\n| `20260328120000_add_feishu_conversation_bindings` | 飞书绑定 |\n| `20260405124000_add_task_run_interaction_requests` | 交互请求 |\n| `20260722160000_postgresql_baseline` | **PostgreSQL 基线**（完整重建） |\n| `20260725113000_add_scheduled_jobs` | 调度系统 |\n| `20260726173000_add_workflow_dispatch` | 工作流分发 |\n| `20260729043000_add_live_room_handoff` | Handoff 机制 |\n| `20260805163000_add_user_model` | 用户模型 |\n| `20260805163500_add_remote_node` | 远程节点 |\n| `20260815150000_add_resource_owners` | 资源所有权 |\n| `20260815153000_add_pairing_tickets` | 配对票据 |\n| `20260922180000_add_feishu_task_bindings` | 飞书任务绑定 |\n| `20260923113000_add_feishu_group_broadcasts` | 群广播 |\n\n`migration_lock.toml` 确认当前 provider 为 `postgresql`。\n\n## 种子脚本\n\n`seed.ts` 用于开发环境初始化，创建三个示例 Gateway：\n\n```typescript\n// 删除旧数据\nawait prisma.task.deleteMany();\nawait prisma.agent.deleteMany();\nawait prisma.gateway.deleteMany();\n\n// 创建示例网关\nawait prisma.gateway.createMany({\n  data: [\n    { name: 'Local Gateway', ip: '127.0.0.1', status: 'online', resources: JSON.stringify({ cpu: 32, memory: 64, disk: 512 }) },\n    { name: 'Remote Gateway A', ip: '10.0.8.12', status: 'online', resources: JSON.stringify({ cpu: 16, memory: 32, disk: 256 }) },\n    { name: 'Remote Gateway B', ip: '10.0.8.21', status: 'offline', resources: JSON.stringify({ cpu: 8, memory: 16, disk: 128 }) },\n  ],\n});\n```\n\n## 关键设计决策\n\n1. **JSON 字段以 TEXT 存储**：`capabilities`、`resources`、`acpxParticipants`、`watchdogConfig` 等字段以 JSON 字符串形式存储在 TEXT 列中，而非使用 PostgreSQL 的 `JSONB` 类型（仅 `ScheduledJobState.cursorJson` 和 `workflowAutonomy` 使用了 `Json` 类型）。\n\n2. **快照模式**：`TaskRunParticipant` 中的 `gatewayNameSnapshot`、`harnessNameSnapshot`、`agentNameSnapshot` 以及 `FeishuGroupBroadcastTarget` 中的身份字段都是快照，不依赖实时外键，确保历史记录在源数据变更或删除后仍然完整。\n\n3. **Handoff 机制**：`LiveRoomMessage` 上的 `handoffRootMessageId`、`handoffCount`、`handoffClaimStatus` 字段实现消息的接力传递，`LiveRoom.handoffLimit` 控制最大接力次数。\n\n4. **投递追踪**：`LiveRoomDelivery` 和 `FeishuGroupBroadcastMemberDelivery` 都采用\"每消息×每成员\"的投递记录模式，支持重试和降级（`fallbackReason`）。\n\n5. **幂等性**：`ScheduledJobRun.idempotencyKey` 唯一约束确保同一调度事件不会重复执行。\n\n6. **所有权模型**：`User` 通过 `ownerUserId` 可选关联到 `Task`、`LiveRoom`、`RemoteNode`，使用 `ON DELETE SET NULL` 保证用户删除后资源不丢失。","root":"# Root\n\n\n\n# Root 模块\n\n## 概述\n\nRoot 模块是 **Agent Platform v2** 项目的根目录，包含项目级配置、开发指南、状态跟踪文档和辅助脚本。它定义了项目的技术栈、构建流程、开发规范和工作流自动化规则。\n\nAgent Platform v2 是一个基于 Next.js 14 的控制面，用于编排本地、远程和聊天集成的 AI Agent 执行，支持 ACPX 任务运行、Live Room 协作、飞书/Lark 消息集成和远程 SSH 执行。\n\n## 技术栈\n\n| 层级 | 技术 | 版本 |\n|------|------|------|\n| 框架 | Next.js | 14.2.35 |\n| 前端 | React | 18 |\n| ORM | Prisma | 5.22.0 |\n| 数据库 | SQLite（开发）/ PostgreSQL（生产） | — |\n| 实时通信 | Socket.IO | 4.8.3 |\n| 飞书 SDK | @larksuiteoapi/node-sdk | 1.60.0 |\n| A2A | @a2a-js/sdk | 0.3.10 |\n| 测试 | Playwright | 1.58.2 |\n| 样式 | Tailwind CSS | 3.4.1 |\n| 语言 | TypeScript | 5.x |\n\n## 项目结构\n\n```\nagent-platform-v2/\n├── src/\n│   ├── app/                  # Next.js App Router 页面和 API 路由\n│   ├── components/           # React 组件\n│   ├── lib/                  # 核心业务逻辑\n│   │   ├── acpx/            # ACPX 运行时（runner, session, interactions）\n│   │   ├── real-agents/     # 真实 Agent 执行（claude-agent, codex-agent）\n│   │   ├── control-plane/   # 控制平面（GatewayClient, GatewayManager）\n│   │   ├── feishu*.ts       # 飞书集成\n│   │   ├── live-room*.ts    # Live Room 协作\n│   │   └── websocket.ts     # Socket.IO 服务\n│   └── types/               # TypeScript 类型定义\n├── prisma/\n│   ├── schema.prisma        # 数据库模型\n│   └── migrations/          # 数据库迁移\n├── scripts/                 # 辅助脚本\n├── tests/                   # 测试文件\n├── docs/                    # 文档\n├── plans/                   # 实施计划\n├── deploy/                  # 部署配置（systemd）\n├── package.json\n├── tsconfig.json\n├── next.config.mjs\n├── tailwind.config.ts\n├── postcss.config.mjs\n├── playwright.config.ts\n└── CLAUDE.md / AGENTS.md    # Agent 开发指南\n```\n\n## 核心配置\n\n### `package.json` — 脚本与依赖\n\n项目通过 `package.json` 中的 `scripts` 字段定义所有可执行命令：\n\n**开发命令：**\n\n```bash\nnpm run dev              # 开发服务器（端口 3010，先执行 prisma generate）\nnpm run build            # 生产构建\nnpm start                # 生产服务器\nnpm run lint             # ESLint 检查\n```\n\n**运行时服务：**\n\n```bash\nnpm run feishu:runtime           # 飞书 WebSocket 独立监听器\nnpm run scheduled-jobs:runtime   # 定时任务运行器\nnpm run remote-runner:gateway    # 远程 Runner Gateway\nnpm run remote-runner:register   # 远程节点注册\n```\n\n**数据库：**\n\n```bash\nnpm run db:migrate:sqlite -- /path/to/dev.db   # SQLite → PostgreSQL 一次性迁移\nnpm run db:verify:migration -- /path/to/dev.db # 迁移验证\nnpx prisma migrate dev                        # 应用迁移 + 重新生成客户端\nnpx prisma generate                           # 重新生成 Prisma Client\n```\n\n**测试命令（按模块）：**\n\n```bash\nnpm run test:acpx-session-tracking\nnpm run test:live-room-steering\nnpm run test:feishu-room-timeout\nnpm run test:workflow-watcher\nnpm run test:codex-steering\n# ... 更多见 package.json\n```\n\n**工作流自动化：**\n\n```bash\nnpm run workflow:new       # 生成 PLAN/HANDOVER 骨架\nnpm run workflow:validate  # 校验工作流文档\nnpm run check:long-files   # 长文件守卫检查\n```\n\n### `tsconfig.json` — TypeScript 配置\n\n关键配置项：\n\n- `strict: true` — 严格模式\n- `moduleResolution: \"bundler\"` — 使用 bundler 解析策略\n- `paths: { \"@/*\": [\"./src/*\"] }` — 路径别名，`@/` 映射到 `src/`\n- `jsx: \"preserve\"` — 保留 JSX 由 Next.js 处理\n\n### `next.config.mjs` — Next.js 配置\n\n当前配置极简，仅忽略构建时的 ESLint 检查：\n\n```javascript\nconst nextConfig = {\n  eslint: {\n    ignoreDuringBuilds: true,\n  },\n};\n```\n\n### `playwright.config.ts` — E2E 测试配置\n\n- 测试目录：`./tests/e2e`\n- 基础 URL：`http://localhost:3000`\n- 并行执行，CI 环境重试 2 次\n- 报告器：HTML + List\n- 失败时自动截图和录制视频\n- 支持 Chromium、Firefox、WebKit 三浏览器\n\n### `tailwind.config.ts` — 样式配置\n\n扫描 `src/pages`、`src/components`、`src/app` 下的所有模板文件，扩展了 `background` 和 `foreground` 颜色变量。\n\n## 开发工作流\n\n### 运行时管理\n\n项目使用 **用户级 systemd 服务** 管理运行时，而非 `nohup` 或手动后台进程：\n\n```bash\nsystemctl --user restart agent-platform-dev.service\nsystemctl --user restart agent-platform-feishu.service\n```\n\n修改 `deploy/systemd-user/*.service` 后需执行：\n\n```bash\nsystemctl --user daemon-reload\nsystemctl --user restart agent-platform-dev.service\nsystemctl --user restart agent-platform-feishu.service\n```\n\n### 工作流自动化\n\n项目支持基于 Git 提交文档的 PLAN/HANDOVER 自动化：\n\n- 唯一规则源：`docs/workflow/workflow-contract.yaml`\n- 新建文档必须使用 `npm run workflow:new` 生成骨架\n- 提交后必须运行 `npm run workflow:validate -- --preflight <文档路径>`\n- 自动化只读取目标 Git ref 中已提交的文档\n- `automation_enabled: false` 时只维护文档，不启动 watcher\n\n### 长文件守卫\n\n```bash\nnpm run check:long-files\n```\n\n开工前运行此命令确认已达阻断阈值的文件。这些文件不得增长，需要新增职责时先提取明确边界的模块。\n\n### Git 历史规则\n\n当 workflow watcher 已启用后，Git 历史必须只追加：\n\n- 禁止 `git commit --amend`、rebase、reset 或强推\n- 对同一文件的后续修正必须创建新 commit\n- 发现历史改写时停止自动化，由人工确认\n\n## 测试策略\n\n项目没有统一的自动化测试框架，测试分为三类：\n\n| 类型 | 工具 | 位置 | 说明 |\n|------|------|------|------|\n| 单元测试 | ts-node | `tests/*.test.ts` | 按模块独立运行，通过 `npm run test:<name>` |\n| E2E 测试 | Playwright | `tests/e2e/` | 需要开发服务器运行 |\n| 手动测试 | 飞书机器人 / API 调用 | — | 通过飞书 bot 或 curl 验证 |\n\n### 测试脚本示例\n\n`test-real-agents.ts` 是一个独立的集成测试脚本，直接调用 Agent 执行函数：\n\n```typescript\nimport { executeCodexTask } from './src/lib/real-agents/codex-agent';\nimport { executeClaudeTask } from './src/lib/real-agents/claude-agent';\n\nasync function testAgents() {\n  const testTask = {\n    id: 'test-1',\n    name: 'Test Task',\n    description: 'This is a test task to verify agent execution',\n  };\n\n  const codexResult = await executeCodexTask(testTask);\n  const claudeResult = await executeClaudeTask(testTask);\n}\n```\n\n调用关系：\n\n```mermaid\ngraph LR\n    A[\"test-real-agents.ts\"] --> B[\"testAgents()\"]\n    B --> C[\"executeCodexTask()\"]\n    B --> D[\"executeClaudeTask()\"]\n    C --> E[\"src/lib/real-agents/codex-agent.ts\"]\n    D --> F[\"src/lib/real-agents/claude-agent.ts\"]\n```\n\n## 环境变量\n\n关键环境变量（参考 `.env.example`）：\n\n| 变量 | 用途 |\n|------|------|\n| `DATABASE_URL` | 数据库连接（SQLite 或 PostgreSQL） |\n| `SOCKET_PORT` / `NEXT_PUBLIC_SOCKET_PORT` | Socket.IO 端口（默认 3101） |\n| `FEISHU_CONNECTION_MODE` | 飞书连接模式：`long_connection` 或 `webhook` |\n| `FEISHU_APP_ID` / `FEISHU_APP_SECRET` | 飞书应用凭证 |\n| `FEISHU_VERIFICATION_TOKEN` / `FEISHU_ENCRYPT_KEY` | 飞书安全配置 |\n| `ACPX_CODEX_SANDBOX_MODE` | Codex 沙箱模式：`workspace-write` / `read-only` / `danger-full-access` |\n| `ANTIGRAVITY_CLI_PATH` | Antigravity CLI 可执行文件路径 |\n| `OPENCLAW_ENCRYPTION_KEY` | Gateway Token 加密密钥（32 字符） |\n| `LINUX_GATEWAY_*` | 远程 Gateway 冒烟测试目标 |\n\n## 关键文档\n\n| 文件 | 用途 |\n|------|------|\n| `CLAUDE.md` | Claude Code 开发指南，包含架构概述、命令、行为准则 |\n| `AGENTS.md` | Agent 使用规范，GitNexus 使用规则、工作流约定、长文件守卫 |\n| `README.md` | 项目入口文档，功能列表、技术栈、设置步骤 |\n| `STATUS.md` | 项目状态跟踪，各阶段完成情况和 Bug 修复记录 |\n| `PROGRESS.md` | 实施计划，三阶段任务清单和验收标准 |\n| `HEARTBEAT.md` | 心跳驱动自主推进机制，记忆结构定义 |\n| `REAL_AGENTS_SETUP.md` | 真实 Agent（Codex/Claude）安装和注册指南 |\n| `CONTROL_PLANE_STATUS.md` | 控制平面增量集成的实施状态 |\n| `FEATURE_3_SUMMARY.md` | Gateway 状态监控面板的完成总结 |\n\n## 与子模块的连接\n\nRoot 模块通过以下方式与子模块交互：\n\n1. **`package.json` 脚本** → 调用 `scripts/` 下的工具脚本和 `tests/` 下的测试文件\n2. **`tsconfig.json` 路径别名** → 使 `src/` 下所有模块可通过 `@/` 导入\n3. **`CLAUDE.md` / `AGENTS.md`** → 为所有 Agent 定义行为边界和开发规范\n4. **`playwright.config.ts`** → 配置 `tests/e2e/` 的 E2E 测试运行环境\n5. **环境变量** → 被 `src/lib/` 下所有运行时模块消费（飞书、ACPX、控制平面等）\n\n## 部署\n\n生产部署通过 systemd 用户服务管理：\n\n- `agent-platform-dev.service` — 主应用（Next.js + Socket.IO）\n- `agent-platform-feishu.service` — 飞书 WebSocket 监听器\n\n两个服务共享同一仓库的本地飞书环境变量回退（`scripts/load-local-env.sh`），启动脚本会将 `DATABASE_URL` 规范化为 `/data1/code/agent-platform-v2/prisma/dev.db`。","scripts":"# scripts\n\n\n\n# Scripts 模块\n\n`scripts/` 目录包含 Agent Platform v2 项目的所有辅助脚本，涵盖飞书集成、远程节点管理、工作流文档管理、数据库迁移、部署运维、质量检查和项目管理等场景。\n\n---\n\n## 目录结构\n\n| 脚本 | 用途分类 |\n|------|----------|\n| `feishu-bot-mvp.ts` | 飞书集成 |\n| `feishu-standalone-monitor.js` | 飞书集成 |\n| `feishu-ws-smoke.js` | 飞书集成 |\n| `agent-platform-runner.js` | 远程节点 |\n| `remote-runner-gateway.ts` / `.js` | 远程节点 |\n| `register-remote-gateway.js` | 远程节点 |\n| `register-remote-node.ts` / `.js` | 远程节点 |\n| `new-workflow-document.ts` | 工作流管理 |\n| `validate-workflow-documents.ts` | 工作流管理 |\n| `build-workflow-validator.mjs` | 工作流管理 |\n| `migrate-sqlite-to-postgresql.mjs` | 数据库迁移 |\n| `verify-postgresql-migration.mjs` | 数据库迁移 |\n| `bootstrap-postgresql.sh` | 数据库迁移 |\n| `install-systemd-user-services.sh` | 部署运维 |\n| `run-agent-platform-dev.sh` | 部署运维 |\n| `run-feishu-runtime.sh` | 部署运维 |\n| `run-scheduled-job-runner.sh` | 部署运维 |\n| `load-local-env.sh` | 部署运维 |\n| `check-long-files.ts` | 质量检查 |\n| `capture-full.mjs` | 截图 |\n| `take-s
